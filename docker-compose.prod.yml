# Lệnh chạy production:
#   docker compose -f docker-compose.prod.yml --env-file deploy/.env up -d --build
# Lưu ý bảo mật: Chỉ duy nhất dịch vụ frontend (Nginx) mở cổng ra bên ngoài máy chủ.

name: wpe-prod

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wpe_db}
      POSTGRES_USER: ${POSTGRES_USER:-wpe_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-wpe_rabbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Thiếu RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  ai-service:
    build:
      context: ./wpe-ai-service
      dockerfile: ../deploy/ai-service.Dockerfile
    restart: unless-stopped
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL-gemini-3.1-flash-lite}
      GEMINI_TIMEOUT_MS: ${GEMINI_TIMEOUT_MS:-90000}
      GEMINI_TOTAL_TIMEOUT_MS: ${GEMINI_TOTAL_TIMEOUT_MS:-170000}
      AI_INTERNAL_KEY: ${AI_INTERNAL_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./wpe-backend
      dockerfile: ../deploy/backend.Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-wpe_db}
      DB_USERNAME: ${POSTGRES_USER:-wpe_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      AI_CONNECT_TIMEOUT_SECONDS: ${AI_CONNECT_TIMEOUT_SECONDS:-5}
      AI_READ_TIMEOUT_SECONDS: ${AI_READ_TIMEOUT_SECONDS:-180}
      AI_COOLDOWN_SECONDS: ${AI_COOLDOWN_SECONDS:-60}
      # S05: lúc khởi động backend tự xóa task mồ côi (phase_id NULL); đặt false để tắt
      CLEANUP_ORPHAN_NODES: ${CLEANUP_ORPHAN_NODES:-true}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-wpe_rabbit}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Thiếu RABBITMQ_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Thiếu JWT_SECRET}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost}
      AI_SERVICE_URL: http://ai-service:8081
      AI_INTERNAL_KEY: ${AI_INTERNAL_KEY:-}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-}
      APP_UPLOAD_DIR: /app/uploads
      # Gửi email (quên mật khẩu, xác nhận đổi mật khẩu); để trống MAIL_HOST hoặc MAIL_FROM = tắt
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Workflow Pipeline Engine}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
      # Tài khoản mẫu (admin, alex.kim, sarah.chen) còn mật khẩu công khai trong README thì backend đổi sang
      # SEED_ACCOUNT_PASSWORD lúc khởi động; thiếu biến này thì backend không chạy (xem docs/DEPLOY.md mục 7)
      SEED_ACCOUNT_PASSWORD: ${SEED_ACCOUNT_PASSWORD:-}
      SEED_ACCOUNT_GUARD_ENABLED: ${SEED_ACCOUNT_GUARD_ENABLED:-true}
      # Cong cu demo (ep trang thai, qua han gia...). Chi bat khi demo, mac dinh tat
      DEMO_TOOLS_ENABLED: ${DEMO_TOOLS_ENABLED:-false}
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  frontend:
    build:
      context: ./wpe-frontend
      dockerfile: ../deploy/frontend.Dockerfile
      additional_contexts:
        deploy: ./deploy
        shared: ./shared
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  rabbitmq_data:
  uploads:
