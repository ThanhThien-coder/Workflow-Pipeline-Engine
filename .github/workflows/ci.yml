name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wpe-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test backend
        run: ./mvnw -B test

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wpe-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: wpe-frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test frontend
        run: npm test

  ai-service:
    name: ai-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wpe-ai-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: wpe-ai-service/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Test ai-service (không gọi Gemini thật)
        env:
          GEMINI_API_KEY: ''
          AI_INTERNAL_KEY: ''
        run: python -m unittest discover -s tests -p "test_*.py" -v
