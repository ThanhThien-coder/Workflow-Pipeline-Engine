# Header bảo mật cho mọi phản hồi. Nạp bằng `include` ở cấp server VÀ ở từng location có add_header riêng,
# vì nginx bỏ add_header của cấp cha khi location tự khai báo add_header.
# - nosniff: trình duyệt không đoán kiểu file (ảnh tải lên không bị chạy như HTML/JS).
# - X-Frame-Options + frame-ancestors: trang khác không nhúng được WPE vào iframe (chống clickjacking).
# - CSP: chỉ nạp script, style, ảnh, font, API từ chính tên miền này. style 'unsafe-inline' vì vài thư viện giao diện chèn style trực tiếp.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
