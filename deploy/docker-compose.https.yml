# Bật HTTPS tự động bằng Caddy (chứng chỉ Let's Encrypt miễn phí, tự gia hạn).
# Cần: tên miền đã trỏ (bản ghi A/AAAA) về IP máy chủ, cổng 80 và 443 mở ra Internet, SITE_DOMAIN trong deploy/.env.
# Chạy:
#   docker compose -f docker-compose.prod.yml -f deploy/docker-compose.https.yml --env-file deploy/.env up -d --build
# Khi bật file này, frontend (nginx) không mở cổng ra ngoài nữa; chỉ Caddy nhận kết nối ở cổng 80/443.

services:
  frontend:
    ports: !reset []
    networks:
      default: {}
      edge: {}

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Thiếu SITE_DOMAIN (tên miền, ví dụ wpe.example.com)}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      # đường dẫn tương đối tính từ thư mục của file compose đầu tiên (gốc repo)
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
        # deploy/nginx.conf chỉ tin header IP thật từ đúng địa chỉ này; đổi ở đây thì đổi cả ở nginx.conf
        ipv4_address: 10.203.77.10
    depends_on:
      frontend:
        condition: service_started

networks:
  edge:
    ipam:
      config:
        - subnet: 10.203.77.0/28

volumes:
  # Chứng chỉ và khóa TLS của Caddy; mất volume này thì Caddy xin lại chứng chỉ (Let's Encrypt giới hạn số lần xin)
  caddy_data:
  caddy_config:
