server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 5m;

    # Chuyển tiếp API sang backend Spring Boot
    # 1. Ghi đè X-Forwarded-For bằng $remote_addr (không nối thêm chuỗi) để AdminAuditService lấy đúng IP thật của client, chống giả mạo IP.
    # 2. Tắt proxy_buffering và proxy_cache, đặt timeout 3600s để hỗ trợ truyền phát sự kiện thời gian thực (Server-Sent Events - SSE).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Tài nguyên tĩnh frontend được đánh hash theo nội dung (cache dài hạn)
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Phục vụ tệp tải lên (ảnh đại diện) từ backend
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        expires 7d;
    }

    # Điều hướng Single Page Application (SPA), không cache index.html để luôn nhận bản mới
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
