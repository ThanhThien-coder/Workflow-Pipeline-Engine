# Khi chạy kèm Caddy (deploy/docker-compose.https.yml), Caddy có IP cố định 10.203.77.10 trong mạng `edge`.
# Chỉ tin header X-Forwarded-For / X-Forwarded-Proto từ đúng IP đó. Chạy không có Caddy thì không container nào có IP này,
# nên khách không giả được IP bằng cách tự gửi header.
map $realip_remote_addr $forwarded_proto {
    10.203.77.10 $http_x_forwarded_proto;
    default      $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 5m;

    set_real_ip_from 10.203.77.10;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    include /etc/nginx/snippets/security-headers.conf;

    # Chuyển tiếp API sang backend Spring Boot
    # 1. Ghi đè X-Forwarded-For bằng $remote_addr (không nối thêm chuỗi) để AdminAuditService lấy đúng IP thật của client, chống giả mạo IP.
    #    Sau Caddy, $remote_addr đã là IP thật của khách nhờ khối set_real_ip_from ở trên.
    # 2. Tắt proxy_buffering và proxy_cache, đặt timeout 3600s để hỗ trợ truyền phát sự kiện thời gian thực (Server-Sent Events - SSE).
    location /api/ {
        proxy_pass http://backend:8080;
        # backend không phản hồi thì báo lỗi sau 5 giây thay vì treo 60 giây
        proxy_connect_timeout 5s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        # Spring Security đã gửi 2 header này; bỏ bản của backend để không bị lặp với bản của nginx
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
    }

    # Tài nguyên tĩnh frontend được đánh hash theo nội dung (cache dài hạn)
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Phục vụ tệp tải lên (ảnh đại diện) từ backend
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        expires 7d;
    }

    # Điều hướng Single Page Application (SPA), không cache index.html để luôn nhận bản mới
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
