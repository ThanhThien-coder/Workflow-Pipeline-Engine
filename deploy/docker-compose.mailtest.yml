# CHỈ DÙNG ĐỂ THỬ trên máy: thêm Mailpit (hộp thư giả) để bắt mọi email backend gửi ra.
# Chạy kèm file chính:
#   docker compose -f docker-compose.prod.yml -f deploy/docker-compose.mailtest.yml --env-file deploy/.env up -d
# Xem email tại http://127.0.0.1:8025 (chỉ mở cho máy này). KHÔNG dùng file này trên production thật.
services:
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  backend:
    environment:
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_SMTP_AUTH: "false"
      MAIL_SMTP_STARTTLS: "false"
      MAIL_FROM: no-reply@wpe.test
    depends_on:
      mailpit:
        condition: service_started
