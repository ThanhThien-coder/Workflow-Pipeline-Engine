/* =====================================================================
   Dataset 2: a big messy project (10 phases, ~250 tasks, 12 members)
   Generated with a fixed seed so it looks the same on every load.
   ===================================================================== */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function makeLarge() {
  const rnd = mulberry32(20261120);
  const pick = (a) => a[Math.floor(rnd() * a.length)];
  const start = D('2026-02-02');
  const PH = 33; // days per phase
  const phases = ['Kickoff', 'Requirements', 'a', 'a', 'New phase', 'Architecture & design', 'Backend services', 'Web frontend', 'Integration & testing', 'Release and final report'];
  const fn = ['Lan', 'Minh', 'Hà', 'Quân', 'Trang', 'Phúc', 'Ngọc', 'Huy', 'Thảo', 'Khoa', 'Vy', 'Tuấn'];
  const ln = ['Nguyễn', 'Trần', 'Lê', 'Phạm', 'Hoàng', 'Võ', 'Đặng', 'Bùi', 'Đỗ', 'Hồ', 'Ngô', 'Dương'];
  const members = fn.map((f, i) => ({ id: 'm' + i, name: `${f} ${ln[i]}`, role: i === 0 ? 'Owner' : i === 1 ? 'Manager' : 'Collaborator' }));
  const weights = [6, 5, 5, 4, 3, 3, 2, 2, 2, 1, 1, 0]; // uneven load; the last member has no task at all
  const wsum = weights.reduce((a, b) => a + b, 0);
  const pickMember = () => { let r = rnd() * wsum; for (let i = 0; i < weights.length; i++) { r -= weights[i]; if (r < 0) return members[i].id; } return members[0].id; };
  const verbs = ['Implement', 'Design', 'Write tests for', 'Review', 'Document', 'Refactor', 'Set up', 'Fix bugs in', 'Polish', 'Spec out'];
  const objects = ['event list page', 'ticket checkout', 'QR check-in', 'organizer dashboard', 'campus SSO login', 'notification service', 'search API', 'room booking rules', 'payment webhook', 'admin roles', 'analytics export', 'seat map editor', 'mobile layout', 'email templates', 'audit log', 'CSV import', 'rate limiting', 'venue calendar', 'feedback survey', 'error pages'];
  const longTitles = ['Refactor the notification service so overdue reminders are batched per member instead of one email per task', 'Investigate why ticket checkout occasionally charges twice when the payment provider times out'];

  const tasks = [];
  let k = 0;
  const code = () => `CEP-${String(++k).padStart(3, '0')}`;
  phases.forEach((_, p) => {
    const n = 18 + Math.floor(rnd() * 14);
    const ws = start.getTime() + p * PH * DAY;
    for (let i = 0; i < n; i++) {
      const due = new Date(startOfDay(new Date(ws + ((i + 1) / n) * PH * DAY)).getTime() + 12 * 3600000);
      const created = new Date(Math.max(start.getTime(), ws - 18 * DAY + Math.floor(rnd() * 10) * DAY));
      const ago = daysBetween(due, TODAY); // > 0: due date already passed
      let status;
      if (ago > 10) status = rnd() < 0.97 ? 'DONE' : 'IN_PROGRESS';
      else if (ago > 0) status = rnd() < 0.55 ? 'DONE' : pick(['IN_PROGRESS', 'IN_PROGRESS', 'REVIEW']);
      else if (ago > -14) status = pick(['DONE', 'IN_PROGRESS', 'IN_PROGRESS', 'REVIEW', 'TODO', 'LOCKED']);
      else status = rnd() < 0.75 ? 'LOCKED' : 'TODO';
      let done = null;
      if (status === 'DONE') {
        const off = rnd() < 0.72 ? -Math.floor(rnd() * 5) : 1 + Math.floor(rnd() * 6);
        done = new Date(Math.min(TODAY.getTime() - 3600000, Math.max(created.getTime() + DAY, due.getTime() + off * DAY)));
      }
      const title = rnd() < 0.03 ? pick(longTitles) : `${pick(verbs)} ${pick(objects)}`;
      tasks.push({ code: code(), title, phase: p, who: pickMember(), due, status, est: pick([2, 4, 4, 6, 8, 8, 12, 16]), created, deps: [], desc: rnd() < 0.5 ? `Acceptance criteria for "${title.toLowerCase()}" are in the phase document.` : '', reopened: status === 'DONE' && rnd() < 0.03, done });
    }
  });
  // a few tasks never put into a phase (phaseId = null in the database)
  [['Weekly meeting notes', 'DONE', '2026-11-14'], ['Update README', 'IN_PROGRESS', '2026-11-24'], ['Collect peer feedback', 'TODO', '2026-11-27'], ['Fix typo on landing page', 'DONE', '2026-11-10']].forEach(([title, status, due]) => {
    tasks.push({ code: code(), title, phase: -1, who: pickMember(), due: D(due), status, est: 2, created: D('2026-11-01'), deps: [], desc: '', reopened: false, done: status === 'DONE' ? new Date(D(due).getTime() - DAY) : null });
  });

  // Dependencies only point to earlier tasks, and stay consistent with status:
  // a started or finished task depends on finished tasks; a LOCKED task waits on at least one open task.
  const sorted = [...tasks].sort((a, b) => a.due - b.due);
  sorted.forEach((t, idx) => {
    if (t.phase === -1) return;
    const cand = sorted.slice(Math.max(0, idx - 40), idx).filter((c) => c.phase !== -1);
    const doneC = cand.filter((c) => c.status === 'DONE'), openC = cand.filter((c) => c.status !== 'DONE');
    const add = (c) => { if (c && !t.deps.includes(c.code)) t.deps.push(c.code); };
    if (t.status === 'LOCKED') {
      if (openC.length) { add(pick(openC)); if (rnd() < 0.4 && doneC.length) add(pick(doneC)); } else t.status = 'TODO';
    } else {
      const nd = rnd() < 0.25 ? 0 : rnd() < 0.6 ? 1 : 2;
      for (let j = 0; j < nd && doneC.length; j++) add(pick(doneC));
    }
  });
  tasks.forEach((t) => { if (t.status !== 'DONE' && rnd() < 0.07) t.who = null; });

  const artifacts = [];
  let pr = 100;
  tasks.filter((t) => t.status === 'DONE').forEach((t) => {
    if (rnd() >= 0.2) return;
    const type = pick(['PR', 'PR', 'PR', 'DOCS', 'DOCS', 'FIGMA', 'SWAGGER', 'OTHER_LINK']);
    const name = { PR: `PR #${++pr}: ${t.title}`, DOCS: `${t.title} (Google Docs)`, FIGMA: `${t.title} (Figma)`, SWAGGER: `${t.title} API (Swagger)`, OTHER_LINK: `${t.title} demo link` }[type];
    artifacts.push({ id: 'x' + t.code, task: t.code, name, type, at: t.done, defaultHidden: rnd() < 0.08 });
  });

  return {
    project: {
      name: 'Campus Event Platform', team: 'Capstone · Team 7',
      description: 'Ticketing and check-in for university events: organizers publish events, students book seats and check in with a QR code. A long project with many phases and members, used here to test how the page holds up with lots of data.',
      startedAt: start, linkExpiresAt: D('2027-01-31'), lastActivityAt: new Date(TODAY - 40 * 60000),
    },
    members, phases, tasks, artifacts,
    ai: { ago: 1, content: 'Project health: at risk. The first seven phases are essentially complete, but Integration & testing is slipping: a cluster of overdue tasks there holds up most of the release phase.', highlights: ['Clear the overdue integration tasks before starting new frontend work.', 'Give an owner to the unassigned tasks due next week.'], risks: ['Several overdue tasks sit on the path to the final release.', 'Three members hold most of the open work; the load is uneven.'] },
    feedback: { resolved: 17, total: 21, sentThisHour: 8 },
  };
}

/* Adds dependency facts to every task (what the backend would compute from node_dependency). */
// Same rule as ArtifactService.detectArtifactType: the guest page derives the type from the link, not from the stored type
function detectType(url) {
  const u = (url || '').toLowerCase();
  if (u.includes('figma.com')) return 'FIGMA';
  if (u.includes('github.com') || u.includes('gitlab.com')) return 'PR';
  if (u.includes('swagger') || u.includes('openapi') || u.includes('/api-docs')) return 'SWAGGER';
  if (u.includes('docs.google.com') || u.includes('drive.google.com') || u.includes('notion.so') || u.includes('wiki')) return 'DOCS';
  return 'OTHER_LINK';
}
const hostOf = (url) => { try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return 'link'; } };
// mock links; the real page gets ArtifactEntity.url
const MOCK_URL = { PR: (i) => `https://github.com/team/repo/pull/${i}`, FIGMA: (i) => `https://figma.com/file/kit-${i}`, DOCS: (i) => `https://docs.google.com/document/d/doc-${i}`, SWAGGER: (i) => `https://api.team.dev/swagger-ui/${i}`, OTHER_LINK: (i) => `https://youtu.be/demo-${i}` };

function prepare(ds, phaseDeps = []) {
  ds.phaseDeps = phaseDeps; // phase_dependency rows: [parent phase index, child phase index]
  ds.artifacts.forEach((a, i) => { a.url = a.url || MOCK_URL[a.type](i + 3); a.type = detectType(a.url); a.host = hostOf(a.url); });
  const by = Object.fromEntries(ds.tasks.map((t) => [t.code, t]));
  const dependents = Object.fromEntries(ds.tasks.map((t) => [t.code, []]));
  ds.tasks.forEach((t) => t.deps.forEach((d) => dependents[d] && dependents[d].push(t.code)));
  ds.tasks.forEach((t) => {
    t.dependents = dependents[t.code];
    t.waitingOn = t.deps.filter((d) => by[d].status !== 'DONE');
    // every open task further down the chain: "if this slips, these slip too"
    const seen = new Set(), stack = [...t.dependents];
    while (stack.length) { const c = stack.pop(); if (seen.has(c)) continue; seen.add(c); stack.push(...dependents[c]); }
    t.downstream = t.status === 'DONE' ? [] : [...seen].filter((c) => by[c].status !== 'DONE');
    // mock stand-in for NodeEntity.startedAt (the real page reads the column)
    const back = Math.max(1, Math.ceil(t.est / 4)) * DAY;
    if (t.done) t.started = new Date(Math.max(t.created.getTime(), t.done.getTime() - back));
    else if (['IN_PROGRESS', 'REVIEW'].includes(t.status)) t.started = new Date(Math.max(t.created.getTime(), Math.min(TODAY.getTime() - DAY, t.due.getTime() - back)));
    else t.started = null;
  });
  ds.by = by;
  return ds;
}

/* =====================================================================
   Metrics (formulas from the proposal, section 5)
   ===================================================================== */
const today0 = startOfDay(TODAY);
const isOverdue = (t) => t.status !== 'DONE' && startOfDay(t.due) < today0;
const isOnTime = (t) => t.status === 'DONE' && startOfDay(t.done) <= startOfDay(t.due);
const lateBy = (t) => (t.status === 'DONE' ? daysBetween(t.due, t.done) : 0); // > 0: finished after its due date
const isLateDone = (t) => lateBy(t) > 0;
const phaseLabel = (ph) => (ph.index >= 0 ? `Phase ${ph.index + 1} · ${ph.name}` : 'No phase');

function computeMetrics(ds) {
  const tasks = ds.tasks;
  const total = tasks.length;
  const done = tasks.filter((t) => t.status === 'DONE');
  const overdue = tasks.filter(isOverdue).sort((a, b) => b.downstream.length - a.downstream.length || a.due - b.due);
  const holdUp = new Set(overdue.flatMap((t) => t.downstream));
  overdue.forEach((t) => holdUp.delete(t.code));
  const onTime = done.filter(isOnTime).length;
  const count = (s) => tasks.filter((t) => t.status === s).length;

  const groups = ds.phases.map((name, i) => ({ name, index: i }));
  if (tasks.some((t) => t.phase === -1)) groups.push({ name: 'No phase', index: -1 });
  const phases = groups.map((g) => {
    const ts = tasks.filter((t) => t.phase === g.index).sort((a, b) => a.due - b.due);
    const d = ts.filter((t) => t.status === 'DONE').length;
    let status = 'TODO';
    if (ts.length && d === ts.length) status = 'COMPLETED';
    else if (ts.length && ts.every((t) => t.status === 'LOCKED')) status = 'LOCKED';
    else if (ts.some((t) => ['IN_PROGRESS', 'REVIEW', 'DONE'].includes(t.status))) status = 'IN_PROGRESS';
    // Phase scorecard: the phase has no deadline column, so its planned end = latest task due date
    const overdueN = ts.filter(isOverdue).length, lateN = ts.filter(isLateDone).length;
    const plannedEnd = ts.length ? new Date(Math.max(...ts.map((t) => t.due))) : null;
    // startedAt is cleared when a task goes back to TODO and may be empty in old data: fall back to completedAt
    const starts = ts.map((t) => t.started || t.done).filter(Boolean).map((d) => d.getTime());
    const start = starts.length ? new Date(Math.min(...starts)) : null;
    const end = ts.length && d === ts.length ? new Date(Math.max(...ts.map((t) => t.done))) : null;
    const onTimeN = ts.filter(isOnTime).length, base = d + overdueN;
    let verdict;
    if (!ts.length) verdict = { label: 'No tasks', tone: 'slate' };
    else if (end) { const diff = daysBetween(plannedEnd, end); verdict = diff <= 0 ? { label: 'Finished on time', tone: 'emerald' } : { label: `Finished ${diff}d late`, tone: 'orange', diff }; }
    else if (overdueN) verdict = { label: `Behind · ${overdueN} overdue`, tone: 'rose' };
    else if (!start) verdict = { label: 'Not started', tone: 'slate' };
    else verdict = { label: 'On track', tone: 'blue' };
    return { ...g, tasks: ts, done: d, pct: ts.length ? Math.round((d / ts.length) * 100) : 0, status, overdueN, lateN, plannedEnd, start, end, verdict, onTimePct: base ? Math.round((onTimeN / base) * 100) : null };
  });
  const real = phases.filter((p) => p.index >= 0);
  // "Current" = where the team is working now: the phase with the most tasks in progress or in review (later phase wins a tie).
  // "First phase not completed" is wrong on real data: one forgotten task in phase 1 would pin the header to phase 1 forever.
  const active = (p) => p.tasks.filter((t) => ['IN_PROGRESS', 'REVIEW'].includes(t.status)).length;
  const busiest = real.reduce((best, p) => (active(p) >= active(best) ? p : best), real[0]);
  const current = active(busiest) > 0 ? busiest : real.find((p) => p.status !== 'COMPLETED') || real[real.length - 1];

  // Whole-project deadline record: survives after the project is finished (needs only dueDate + completedAt)
  const completed = ds.project.status === 'COMPLETED';
  const lateDone = done.filter(isLateDone).sort((a, b) => lateBy(b) - lateBy(a) || a.due - b.due);
  const overdueDays = overdue.reduce((s, t) => s + daysBetween(t.due, TODAY), 0);
  const lateDays = lateDone.reduce((s, t) => s + lateBy(t), 0);
  const deadline = new Date(Math.max(...tasks.map((t) => t.due)));
  const finishedAt = done.length ? new Date(Math.max(...done.map((t) => t.done))) : null;

  // "Needs attention": fixed rules only, no AI. Nothing to act on once the project is completed.
  const attention = [];
  tasks.filter((t) => !completed && t.status !== 'DONE').forEach((t) => {
    const left = daysBetween(TODAY, t.due);
    if (isOverdue(t)) attention.push({ t, kind: 0, text: `Overdue ${-left}d${t.who ? '' : ' · no assignee'}` });
    else if (left <= 2 && t.downstream.length) attention.push({ t, kind: 1, text: left === 0 ? 'Due today' : `Due in ${left}d` });
    else if (!t.who && left <= 7) attention.push({ t, kind: 2, text: `No assignee · due in ${left}d` });
  });
  attention.sort((a, b) => a.kind - b.kind || b.t.downstream.length - a.t.downstream.length || a.t.due - b.t.due);

  return {
    total, done: done.length, pct: total ? Math.round((done.length / total) * 100) : 0,
    overdue, holdUp: holdUp.size, onTime, onTimeBase: done.length + overdue.length,
    breakdown: [
      { key: 'DONE', label: 'Done on time', n: count('DONE') - lateDone.length, c: 'bg-emerald-500' },
      { key: 'LATE', label: 'Done late', n: lateDone.length, c: 'bg-orange-400' },
      { key: 'REVIEW', label: 'In review', n: count('REVIEW'), c: 'bg-amber-400' },
      { key: 'IN_PROGRESS', label: 'In progress', n: count('IN_PROGRESS'), c: 'bg-blue-500' },
      { key: 'TODO', label: 'To do', n: count('TODO'), c: 'bg-sky-300' },
      { key: 'LOCKED', label: 'Waiting', n: count('LOCKED'), c: 'bg-slate-300' },
    ],
    phases, realPhaseCount: real.length, current, attention,
    attentionSet: new Set(attention.map((a) => a.t.code)),
    completed, lateDone, lateDays, overdueDays, deadline, finishedAt,
    missed: lateDone.length + overdue.length,
    reopenedN: tasks.filter((t) => t.reopened).length,
  };
}

            {diff > 0 ? <b className="text-orange-600">({plural(diff, 'day')} after the planned end, {fmt(m.deadline)})</b>

        <span><b className="text-slate-700">{ds.members.length}</b> members</span>

      <Note>"Phase X of N" = the phase with the most tasks in progress or in review, i.e. where the team is working now (the backend currently always shows phase 1; "first unfinished phase" is also wrong, since one forgotten old task would pin it). The phase number is always shown next to its name, because teams leave names like "a" or "New phase". Target deadline = latest task due date (the project has no deadline column). Completed project: finished = last completedAt, compared with that planned end.</Note>

/* =====================================================================
   Row 2: Burn-up + Team contribution
   ===================================================================== */
function niceStep(raw) {
  const mag = Math.pow(10, Math.floor(Math.log10(Math.max(raw, 1))));
  return [1, 2, 5, 10].find((s) => s * mag >= raw) * mag;
}
function BurnUp({ ds, m }) {
  const [hover, setHover] = useState(null);
  const { unit, buckets } = useMemo(() => {
    const tasks = ds.tasks;
    const first = startOfDay(new Date(Math.min(ds.project.startedAt.getTime(), ...tasks.map((t) => t.created.getTime()))));
    // run to the later of the plan and reality: a late project must show the days after its planned end
    const end = m.completed ? new Date(Math.max(m.deadline, m.finishedAt)) : new Date(Math.max(m.deadline, TODAY));
    const span = daysBetween(first, end);
    const unit = span < 14 ? 'day' : span <= 26 * 7 ? 'week' : 'month';
    const cur = new Date(first);
    if (unit === 'week') cur.setDate(cur.getDate() - ((cur.getDay() + 6) % 7));
    if (unit === 'month') cur.setDate(1);
    const next = (d) => { const n = new Date(d); if (unit === 'day') n.setDate(n.getDate() + 1); else if (unit === 'week') n.setDate(n.getDate() + 7); else n.setMonth(n.getMonth() + 1); return n; };
    const out = [];
    for (let c = cur; c <= end; c = next(c)) {
      const end = new Date(next(c).getTime() - 1);
      const past = c <= TODAY, cut = end < TODAY ? end : TODAY;
      const fin = past ? tasks.filter((t) => t.done && t.done >= c && t.done <= cut) : [];
      out.push({ start: c, scope: tasks.filter((t) => t.created <= end).length, done: past ? tasks.filter((t) => t.done && t.done <= cut).length : null, fin, future: !past });
    }
    return { unit, buckets: out };
  }, [ds, m.deadline]);

  // Draw at the container's real width so text stays 10px on phones instead of shrinking with the whole picture
  const boxRef = useRef(null);
  const [W, setW] = useState(680);
  useEffect(() => {
    const el = boxRef.current; if (!el) return;
    const ro = new ResizeObserver(([e]) => setW(Math.max(280, Math.round(e.contentRect.width))));
    ro.observe(el); return () => ro.disconnect();
  }, []);
  const n = buckets.length;
  const H = W < 480 ? 190 : 230, P = { l: 36, r: 14, t: 16, b: 28 };
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  const step = niceStep(Math.max(...buckets.map((b) => b.scope)) / 4);
  const maxY = Math.ceil(Math.max(...buckets.map((b) => b.scope)) / step) * step;
  const x = (i) => P.l + (n > 1 ? (iw * i) / (n - 1) : iw / 2);
  const y = (v) => P.t + ih - (ih * v) / maxY;
  const past = buckets.map((b, i) => (b.done !== null ? i : -1)).filter((i) => i >= 0);
  const scopePath = buckets.map((b, i) => `${i ? 'L' : 'M'}${x(i)},${y(b.scope)}`).join(' ');
  const donePath = past.map((i, k) => `${k ? 'L' : 'M'}${x(i)},${y(buckets[i].done)}`).join(' ');
  const doneArea = `${donePath} L${x(past[past.length - 1])},${y(0)} L${x(0)},${y(0)} Z`;
  const todayX = x(past[past.length - 1]);
  const dIdx = buckets.reduce((k, b, i) => (b.start <= m.deadline ? i : k), 0);
  const labelEvery = Math.ceil(n / Math.min(8, Math.max(3, Math.floor(iw / 70))));
  const lab = (d) => (unit === 'month' ? d.toLocaleDateString('en-GB', { month: 'short' }) : fmt(d));
  const h = hover !== null ? buckets[hover] : null;
  const ticks = []; for (let v = 0; v <= maxY; v += step) ticks.push(v);
  const unitWord = { day: 'day by day', week: 'week by week', month: 'month by month' }[unit];
  const headOf = (b) => (unit === 'day' ? fmt(b.start) : unit === 'week' ? `Week of ${fmt(b.start)}` : b.start.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }));

  return (
    <Card title="Progress over time" note={<Sub>Tasks finished (cumulative) against total scope, {unitWord}. A flat line followed by a jump means work was crammed.</Sub>}
      right={<div className="flex shrink-0 gap-3 text-[11px] text-slate-500"><span className="flex items-center gap-1"><span className="h-0.5 w-4 bg-indigo-500" />Done</span><span className="flex items-center gap-1"><span className="w-4 border-t-2 border-dashed border-slate-400" />Scope</span></div>}>
      <div ref={boxRef} className="relative">
        <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H} className="block" onMouseLeave={() => setHover(null)}>
          <defs><linearGradient id="doneFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor="#6366f1" stopOpacity=".25" /><stop offset="1" stopColor="#6366f1" stopOpacity="0" /></linearGradient></defs>
          {ticks.map((v) => (
            <g key={v}>
              <line x1={P.l} x2={W - P.r} y1={y(v)} y2={y(v)} stroke="#e2e8f0" />
              <text x={P.l - 8} y={y(v) + 4} textAnchor="end" fontSize="10" fill="#94a3b8">{v}</text>
            </g>
          ))}
          {buckets.map((b, i) => i % labelEvery === 0 && (
            <text key={i} x={x(i)} y={H - 8} textAnchor={i === 0 ? 'start' : x(i) > W - P.r - 24 ? 'end' : 'middle'} fontSize="10" fill="#94a3b8">{lab(b.start)}</text>
          ))}
          <rect x={todayX} y={P.t} width={Math.max(0, W - P.r - todayX)} height={ih} fill="#f8fafc" />
          <path d={scopePath} fill="none" stroke="#94a3b8" strokeWidth="2" strokeDasharray="5 4" />
          <path d={doneArea} fill="url(#doneFill)" />
          <path d={donePath} fill="none" stroke="#4f46e5" strokeWidth="2.5" strokeLinejoin="round" />
          {n <= 40 && past.map((i) => <circle key={i} cx={x(i)} cy={y(buckets[i].done)} r={hover === i ? 5 : 3} fill="#4f46e5" stroke="#fff" strokeWidth="1.5" />)}
          {!m.completed && <>
            <line x1={todayX} x2={todayX} y1={P.t} y2={P.t + ih} stroke="#4f46e5" strokeDasharray="3 3" />
            <text x={todayX + 4} y={P.t + 10} fontSize="10" fill="#4f46e5" fontWeight="600">Today</text>
          </>}
          <line x1={x(dIdx)} x2={x(dIdx)} y1={P.t} y2={P.t + ih} stroke="#e11d48" strokeDasharray="3 3" />
          <text x={x(dIdx) - 4} y={P.t + ih - 6} fontSize="10" fill="#e11d48" fontWeight="600" textAnchor="end">Planned end</text>
          {buckets.map((b, i) => (
            <rect key={i} x={x(i) - iw / Math.max(n - 1, 1) / 2} y={P.t} width={iw / Math.max(n - 1, 1)} height={ih} fill="transparent" onMouseEnter={() => setHover(i)} />
          ))}
        </svg>
        {h && (
          <div className="pointer-events-none absolute top-2 max-w-[240px] rounded-lg border border-slate-200 bg-white px-3 py-2 text-xs shadow-lg" style={{ left: `${Math.min(62, (x(hover) / W) * 100)}%` }}>
            <div className="font-semibold text-slate-800">{headOf(h)}</div>
            <div className="text-slate-600">Scope: {h.scope} tasks</div>
            {h.future ? <div className="text-slate-400">Not reached yet</div> : <>
              <div className="text-indigo-700">Done so far: {h.done}</div>
              <div className="text-slate-500">Finished in this period: {h.fin.length ? h.fin.slice(0, 5).map((t) => t.code).join(', ') + (h.fin.length > 5 ? ` +${h.fin.length - 5}` : '') : 'none'}</div>
            </>}
          </div>
        )}
      </div>
      <Note>Bucket size follows project length: daily under 14 days, weekly up to 26 weeks, monthly beyond, so the chart never gets crowded. Labels thin out to at most 8. Done time = completedAt (falls back to updatedAt for old data). Scope = tasks counted by creation date.</Note>
    </Card>
  );
}

          {arts.length > 0 && <span className="flex items-center gap-0.5 text-[11px] font-semibold text-indigo-600" title={arts.map((a) => a.name).join('\n')}><Icon d={I.clip} className="h-3.5 w-3.5" />{arts.length}</span>}
        </div>
        <span className="no-print hidden text-slate-400 sm:block"><Icon d={I.chev} className={`h-3.5 w-3.5 transition-transform ${open ? 'rotate-90' : ''}`} /></span>
      </div>
      {open && <TaskDetails t={t} by={by} people={people} arts={arts} onJump={onJump} onComment={onComment} />}
    </div>
  );
}

/* =====================================================================
   Phase graph (read-only). Simplified stand-in for the app's MindmapTree:
   columns by dependency depth, tasks from other phases drawn as dashed "ghost" cards
   on the left (needed first) and on the right (unlocked next).
   ===================================================================== */
const STATUS_BAR = { DONE: 'border-l-emerald-500', REVIEW: 'border-l-amber-400', IN_PROGRESS: 'border-l-blue-500', TODO: 'border-l-sky-300', LOCKED: 'border-l-slate-300' };
const ROW_LIMIT = 10;
/* =====================================================================
   Right column of row 3: Deliverables + Feedback
   ===================================================================== */
const FEEDBACK_LIMIT = 10; // per project per hour (backend MAX_FEEDBACK_PER_HOUR)
function Feedback({ ds, m, task, setTask, focusKey }) {
  const [name, setName] = useState('');
  const [role, setRole] = useState('TEACHER');
  const [msg, setMsg] = useState('');
  const [sent, setSent] = useState([]);
  const [err, setErr] = useState('');
  const boxRef = useRef(null), areaRef = useRef(null);
  useEffect(() => {
    if (!focusKey) return;
    boxRef.current?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    const t = setTimeout(() => areaRef.current?.focus({ preventScroll: true }), 350);
    return () => clearTimeout(t);
  }, [focusKey]);
  const left = FEEDBACK_LIMIT - ds.feedback.sentThisHour - sent.length;
  const [ok, setOk] = useState(false);
  const submit = (e) => {
    e.preventDefault();
    setOk(false);
    if (!name.trim()) { setErr('Please enter your name so the team knows who wrote this.'); return; }
    if (!msg.trim()) return;
    // the backend enforces MAX_FEEDBACK_PER_HOUR; the page only shows its error, no counter
    if (left <= 0) { setErr('This project has received too many feedback items in the last hour. Please try again later.'); return; }
    setSent([...sent, Date.now()]);
    setMsg(''); setErr(''); setOk(true);
  };
  // scope: '' = whole project, 'p:<index>' = a phase (sent as content prefix, no nodeId), otherwise a task code (sent as nodeId)
  const isPhase = task.startsWith('p:');
  const ph = isPhase ? m.phases.find((p) => p.index === +task.slice(2)) : null;
  const t = !isPhase && task ? ds.by[task] : null;
  const st = ds.feedback;
  return (
    <Card id="feedback" title="Send feedback" note={<Sub>One-way: the team reads and resolves it. There is no reply thread.</Sub>}>
      <div className="mb-3 flex items-center gap-2 rounded-lg bg-slate-50 px-3 py-2 text-xs text-slate-600">
        <span className="flex h-5 w-5 shrink-0 items-center justify-center rounded-full bg-emerald-100 text-emerald-700"><Icon d={I.check} className="h-3 w-3" /></span>
        {st.total ? <span>The team has resolved <b className="text-slate-800">{st.resolved} of {st.total}</b> feedback items so far.</span> : <span>No feedback received yet. Yours would be the first.</span>}
      </div>
      <form ref={boxRef} onSubmit={submit} className="no-print space-y-2.5">
        <div className="grid grid-cols-[1fr_auto] gap-2">
          <input value={name} onChange={(e) => setName(e.target.value)} maxLength={60} placeholder="Your name, e.g. Dr. Tran" className="min-w-0 rounded-lg border border-slate-200 px-3 py-2 text-sm outline-none focus:border-indigo-400" />
          <div className="flex rounded-lg border border-slate-200 p-0.5 text-xs font-semibold">
            {['TEACHER', 'GUEST'].map((r) => (
              <button type="button" key={r} onClick={() => setRole(r)} className={`rounded-md px-2.5 py-1.5 ${role === r ? 'bg-indigo-600 text-white' : 'text-slate-600'}`}>{r === 'TEACHER' ? 'Teacher' : 'Guest'}</button>
            ))}
          </div>
        </div>
        <select value={task} onChange={(e) => setTask(e.target.value)} className="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-700 outline-none focus:border-indigo-400">
          <option value="">About the whole project</option>
          <optgroup label="A whole phase">
            {m.phases.filter((p) => p.index >= 0).map((p) => <option key={'p' + p.index} value={'p:' + p.index}>{phaseLabel(p)}</option>)}
          </optgroup>
          {m.phases.map((p) => (
            <optgroup key={p.index} label={`Tasks · ${phaseLabel(p)}`}>
              {p.tasks.map((x) => <option key={x.code} value={x.code}>{x.code} · {x.title.length > 48 ? x.title.slice(0, 47) + '…' : x.title}</option>)}
            </optgroup>
          ))}
        </select>
        {t && <p className="-mt-1 text-[11px] text-slate-500">Commenting on <span className="mono">{t.code}</span>, status <b>{STATUS_CHIP[t.status][0].toLowerCase()}</b>.</p>}
                <textarea ref={areaRef} value={msg} onChange={(e) => setMsg(e.target.value)} rows={3} maxLength={2000} placeholder={t ? `Your comments on "${t.title}"…` : ph ? `Your evaluation of ${phaseLabel(ph)}…` : 'Your comments for the team…'} className="w-full resize-none rounded-lg border border-slate-200 p-3 text-sm outline-none focus:border-indigo-400" />
        {err && <p className="text-xs text-rose-600">{err}</p>}
        {ok && <p className="flex items-center gap-1.5 rounded-lg bg-emerald-50 px-2.5 py-2 text-xs text-emerald-800"><Icon d={I.check} className="h-3.5 w-3.5" /> Sent. The team will see it in their feedback list.</p>}
        <div className="flex items-center justify-between">
          <span className="text-[11px] text-slate-400">{msg.length}/2000</span>
          <button disabled={!msg.trim()} className="btn-grad flex items-center gap-1.5 rounded-lg px-3.5 py-2 text-xs font-semibold text-white disabled:opacity-50"><Icon d={I.send} className="h-3.5 w-3.5" /> Send</button>
        </div>
      </form>
      <Note>Three scopes, all on the existing endpoint: whole project (nodeId empty), a phase (nodeId empty, content prefixed with "[Phase N · name]", no new column), a task (nodeId). reviewerName is required by the backend (@NotBlank), so there is no anonymous option.</Note>
      <Note>Uses the existing endpoint only (reviewerName, reviewerRole TEACHER/GUEST, nodeId, content). After sending, the page just confirms; nothing else is listed, and other reviewers' comments are never shown. The hourly limit is enforced by the backend and its error is shown as is (try sending 3 times on the Large data). "Comment on this task" in the task list pre-selects the task here.</Note>
    </Card>
  );
}

/* Owner's task editor: the new backend rule in DueDateRules (no database change).
   A due date that has already passed, or the due date of a DONE task, can no longer be moved or cleared. */
function DueLockDemo({ ds }) {
  const pickable = useMemo(() => {
    const past = ds.tasks.filter((t) => startOfDay(t.due) < today0).sort((a, b) => (isOverdue(b) - isOverdue(a)) || b.due - a.due);
    const future = ds.tasks.filter((t) => startOfDay(t.due) >= today0 && t.status !== 'DONE');
    return [...past.slice(0, 6), ...future.slice(0, 3)];
  }, [ds]);
  const [code, setCode] = useState(pickable[0]?.code || '');
  const [res, setRes] = useState(null);
  const t = ds.by[code];
  const iso = (d) => new Date(d.getTime() + 7 * 3600000).toISOString().slice(0, 10);
  const [val, setVal] = useState('');
  useEffect(() => { if (t) setVal(iso(new Date(Math.max(t.due.getTime(), TODAY.getTime()) + 7 * DAY))); setRes(null); }, [code]);
  if (!t) return null;
  const save = (clear) => {
    const passed = startOfDay(t.due) < today0;
    if (t.status === 'DONE') setRes({ ok: false, code: 'DUE_DATE_LOCKED', msg: 'This task is already done, so its due date is part of the record and cannot be changed.' });
    else if (passed) setRes({ ok: false, code: 'DUE_DATE_LOCKED', msg: `This due date (${fmt(t.due)}) has already passed, so it can no longer be ${clear ? 'cleared' : 'moved'}. The task keeps counting as late until it is done.` });
    else setRes({ ok: true, msg: clear ? 'Due date cleared.' : `Due date moved to ${fmt(new Date(val + 'T12:00:00+07:00'))}. Allowed: the old date had not passed yet.` });
  };
  return (
    <div className="mt-4 rounded-lg border border-slate-200 p-3">
      <p className="text-xs font-semibold text-slate-700">Try it: change a due date <span className="font-normal text-slate-400">(task editor, shown here for the demo)</span></p>
      <div className="mt-2 grid grid-cols-[1fr_auto] gap-2">
        <select value={code} onChange={(e) => setCode(e.target.value)} className="min-w-0 rounded-lg border border-slate-200 bg-white px-2 py-1.5 text-xs">
          {pickable.map((x) => <option key={x.code} value={x.code}>{x.code} · due {fmt(x.due)} · {STATUS_CHIP[x.status][0]}{isOverdue(x) ? ' · overdue' : ''}</option>)}
        </select>
        <input type="date" value={val} onChange={(e) => setVal(e.target.value)} className="rounded-lg border border-slate-200 px-2 py-1.5 text-xs" />
      </div>
      <div className="mt-2 flex gap-2">
        <button onClick={() => save(false)} className="btn-grad rounded-md px-3 py-1.5 text-xs font-semibold text-white">Save due date</button>
        <button onClick={() => save(true)} className="rounded-md border border-slate-200 px-3 py-1.5 text-xs font-semibold text-slate-600 hover:bg-slate-50">Clear due date</button>
      </div>
      {res && (
        <div className={`mt-2 rounded-md px-2.5 py-2 text-xs ${res.ok ? 'bg-emerald-50 text-emerald-800' : 'bg-rose-50 text-rose-800'}`}>
          {res.code && <span className="mono mr-1 font-semibold">{res.code}</span>}{res.msg}
        </div>
      )}
      <p className="mt-2 text-[11px] text-slate-400">Moving a date that is still ahead stays allowed (that is re-planning). Once a date has passed, the slip is a fact and stays on record. No database change is needed.</p>
    </div>
  );
}

/* =====================================================================
   v6 · Band 2: deadline audit (tabs + summary numbers, idea from the Neon mock)
   ===================================================================== */
const AUDIT_TONE = {
  0: ['bg-rose-600', 'border-rose-200 bg-rose-50/50', 'bg-rose-100 text-rose-700'],
  1: ['bg-amber-500', 'border-amber-200 bg-amber-50/50', 'bg-amber-100 text-amber-800'],
  2: ['bg-amber-500', 'border-amber-200 bg-amber-50/50', 'bg-amber-100 text-amber-800'],
  3: ['bg-orange-600', 'border-orange-200 bg-orange-50/40', 'bg-orange-100 text-orange-800'],
};
function DeadlineAudit({ m, people, onGraph, onComment }) {
  const LIMIT = 4;
  const tabs = [...(m.completed ? [] : [['now', 'Needs attention', m.attention.length]]), ['late', 'Finished late', m.lateDone.length]];
  const [tab, setTab] = useState(tabs[0][0]);
  const [all, setAll] = useState(false);
  const nowItems = m.attention.map(({ t, kind, text }) => {
    const left = daysBetween(TODAY, t.due);
    return { t, kind, badge: kind === 0 ? `+${-left}d now` : kind === 1 ? (left === 0 ? 'due today' : `due in ${left}d`) : 'no owner', line: kind === 2 ? `Due ${fmt(t.due)}` : text };
  });
  const lateItems = m.lateDone.map((t) => ({ t, kind: 3, badge: `+${lateBy(t)}d late`, line: `Due ${fmt(t.due)} → done ${fmt(t.done)}` }));
  const slips = [...m.overdue.map((t) => daysBetween(t.due, TODAY)), ...m.lateDone.map(lateBy)];
  const avg = slips.length ? (slips.reduce((a, b) => a + b, 0) / slips.length).toFixed(1) : '0';
  const worst = slips.length ? Math.max(...slips) : 0;

  const Item = ({ it }) => {
    const [chip, box, badge] = AUDIT_TONE[it.kind];
    return (
      <div className={`rounded-xl border p-2.5 ${box}`}>
        <div className="flex items-start justify-between gap-2">
          <div className="flex min-w-0 items-center gap-1.5">
            <span className={`mono shrink-0 rounded px-1.5 py-0.5 text-[10px] font-bold text-white ${chip}`}>{it.t.code}</span>
            <span className="truncate text-xs font-semibold text-slate-900" title={it.t.title}>{it.t.title}</span>
          </div>
          <span className={`shrink-0 rounded-full px-1.5 py-0.5 text-[10px] font-bold ${badge}`}>{it.badge}</span>
        </div>
        <div className="mt-1 flex flex-wrap items-center justify-between gap-x-2 gap-y-1 text-[11px] text-slate-600">
          <span className="flex min-w-0 flex-wrap items-center gap-x-2">
            <span>{it.line}</span>
            {it.kind !== 3 && it.t.downstream.length > 0 && <span className="font-semibold text-rose-700">blocks → <span className="mono">{it.t.downstream.slice(0, 2).join(', ')}</span>{it.t.downstream.length > 2 && ` +${it.t.downstream.length - 2}`}</span>}
            {it.t.who && <span className="text-slate-400">{people[it.t.who].label}</span>}
            {it.t.reopened && <span className="rounded bg-violet-100 px-1 text-[9.5px] font-semibold text-violet-700">Reopened</span>}
          </span>
          <span className="no-print flex shrink-0 gap-2 font-semibold">
            <button onClick={() => onGraph(it.t.code)} className="text-indigo-700 hover:underline">Graph</button>
            <button onClick={() => onComment(it.t.code)} className="text-slate-700 hover:underline">Comment</button>
          </span>
        </div>
      </div>
    );
  };
  const List = ({ items, active }) => (
    <div className={active ? '' : 'hidden print-block'}>
      {!active && <p className="mb-1.5 mt-3 hidden text-[11px] font-bold uppercase tracking-wide text-slate-500 print-block">{tabs.find((x) => x[0] !== tab)?.[1]}</p>}
      {items.length === 0
        ? <p className="rounded-xl border border-emerald-200 bg-emerald-50 px-3 py-3 text-xs font-semibold text-emerald-700">{tab === 'now' ? 'Nothing needs action right now.' : 'Clean record: no task was delivered after its due date.'}</p>
        : <div className="space-y-2">{items.map((it, i) => <div key={it.t.code} className={all || i < LIMIT ? '' : 'hidden print-block'}><Item it={it} /></div>)}</div>}
      {active && items.length > LIMIT && (
        <button onClick={() => setAll(!all)} className="no-print mt-2 w-full rounded-lg border border-dashed border-slate-300 py-1.5 text-xs font-semibold text-slate-600 hover:border-indigo-300 hover:text-indigo-700">
          {all ? 'Show fewer' : `Show all ${items.length}`}
        </button>
      )}
    </div>
  );
  return (
    <Card className="h-full">
      <div className="mb-3 flex flex-wrap items-center justify-between gap-2">
        <h3 className="text-sm font-bold text-slate-900">Deadlines</h3>
        <div className="no-print flex gap-1 text-[11px]">
          {tabs.map(([k, label, n]) => (
            <button key={k} onClick={() => { setTab(k); setAll(false); }} className={`rounded-md px-2 py-0.5 font-semibold ${tab === k ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>{label} ({n})</button>
          ))}
        </div>
      </div>
      <div className="mb-3 grid grid-cols-3 gap-2 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-xs">
        <div><span className="block text-[10px] font-semibold uppercase text-slate-400">Avg slip · {slips.length} tasks</span><b className="text-slate-900">+{avg}d</b></div>
        <div><span className="block text-[10px] font-semibold uppercase text-slate-400">Worst slip</span><b className={worst ? 'text-rose-600' : 'text-slate-900'}>+{worst}d</b></div>
        <div><span className="block text-[10px] font-semibold uppercase text-slate-400">Reopened</span><b className="text-slate-900">{m.reopenedN}</b></div>
      </div>
      {!m.completed && <List items={nowItems} active={tab === 'now'} />}
      <List items={lateItems} active={tab === 'late'} />
      <Note>Two tabs on one card: "Needs attention" (rules: past due; due within 2 days while others wait; no assignee and due within 7 days) is hidden once the project is COMPLETED; "Finished late" keeps the history. Avg slip and worst slip are over the tasks that missed their date (finished late, plus overdue ones counted up to today); tasks due soon or without an owner are not in them. Reopened = tasks with reopenedAt. Print shows both lists in full.</Note>
    </Card>
  );
}

/* =====================================================================
   v6 · Band 3: team table (layout from the Neon mock, numbers from the real formulas)
   ===================================================================== */
function TeamTable({ ds, people }) {
  const LIMIT = 6;
  const [all, setAll] = useState(false);
  const rows = ds.members.map((mb) => {
    const ts = ds.tasks.filter((t) => t.who === mb.id);
    const done = ts.filter((t) => t.status === 'DONE');
    const late = done.filter(isLateDone);
    const overdue = ts.filter(isOverdue).length;
    const onTime = done.length - late.length;
    const base = done.length + overdue;
    return { p: people[mb.id], total: ts.length, done: done.length, onTime, late: late.length, worst: late.reduce((w, t) => (!w || lateBy(t) > lateBy(w) ? t : w), null), overdue, active: ts.filter((t) => ['IN_PROGRESS', 'REVIEW'].includes(t.status)).length, todo: ts.filter((t) => t.status === 'TODO').length, waiting: ts.filter((t) => t.status === 'LOCKED').length, pct: base ? Math.round((onTime / base) * 100) : null };
  }).sort((a, b) => b.done - a.done || (b.pct ?? -1) - (a.pct ?? -1));
  const unassigned = ds.tasks.filter((t) => !t.who && t.status !== 'DONE');
  const pctCls = (p) => (p === null ? 'text-slate-400' : p >= 80 ? 'bg-emerald-50 text-emerald-700' : p >= 60 ? 'bg-amber-50 text-amber-800' : 'bg-rose-50 text-rose-700');
  return (
    <Card className="h-full" title="Who did what" note={<Sub>Per member, from the tasks currently assigned to them. Sorted by tasks done, then on-time %.</Sub>}
      right={<span className="shrink-0 rounded-full bg-slate-100 px-2 py-0.5 text-[11px] font-semibold text-slate-600">{ds.members.length} members</span>}>
      <div className="-mx-1 overflow-x-auto px-1">
        <table className="w-full min-w-[540px] text-left text-xs">
          <thead>
            <tr className="border-b border-slate-200 text-[11px] text-slate-500">
              <th className="pb-2 font-semibold">Member</th>
              <th className="pb-2 text-center font-semibold">On time</th>
              <th className="pb-2 text-center font-semibold" title="Tasks finished after their due date">Done late</th>
              <th className="pb-2 text-center font-semibold">Overdue</th>
              <th className="pb-2 text-center font-semibold">Active</th>
              <th className="pb-2 font-semibold">Done</th>
              <th className="pb-2 text-right font-semibold">On-time %</th>
            </tr>
          </thead>
          <tbody className="divide-y divide-slate-100">
            {rows.map((r, i) => (
              <tr key={r.p.id} className={all || i < LIMIT ? '' : 'hidden print-row'}>
                <td className="py-2 pr-2">
                  <div className="flex items-center gap-2">
                    <Avatar p={r.p} size="h-7 w-7 text-[10px]" />
                    <div className="min-w-0">
                      <div className="truncate font-semibold text-slate-900">{r.p.label}</div>
                      <div className="text-[10.5px] text-slate-400">{[r.p.role, r.todo && `${r.todo} to do`, r.waiting && `${r.waiting} waiting`].filter(Boolean).join(' · ')}</div>
                    </div>
                  </div>
                </td>
                <td className="py-2 text-center font-semibold text-emerald-700">{r.onTime}</td>
                <td className={`py-2 text-center font-semibold ${r.late ? 'text-orange-700' : 'text-slate-300'}`} title={r.worst ? `Most late: ${r.worst.code}, done ${lateBy(r.worst)} days after its due date` : ''}>{r.late}{r.worst && <span className="block whitespace-nowrap text-[10px] font-normal text-orange-500">worst +{lateBy(r.worst)}d</span>}</td>
                <td className={`py-2 text-center font-semibold ${r.overdue ? 'text-rose-600' : 'text-slate-300'}`}>{r.overdue}</td>
                <td className="py-2 text-center text-slate-600">{r.active}</td>
                <td className="w-28 py-2">
                  <div className="flex items-center gap-1.5">
                    <div className="flex h-1.5 flex-1 overflow-hidden rounded-full bg-slate-100">
                      <div className="h-full bg-emerald-500" style={{ width: `${r.total ? (r.onTime / r.total) * 100 : 0}%` }} />
                      <div className="h-full bg-orange-400" style={{ width: `${r.total ? (r.late / r.total) * 100 : 0}%` }} />
                    </div>
                    <span className="w-9 text-right text-[11px] font-semibold text-slate-700">{r.done}/{r.total}</span>
                  </div>
                </td>
                <td className="py-2 text-right">{r.pct === null ? <span className="text-slate-400">{r.total ? '—' : 'no task'}</span> : <span className={`rounded-full px-2 py-0.5 text-[10.5px] font-bold ${pctCls(r.pct)}`}>{r.pct}%</span>}</td>
              </tr>
            ))}
            {unassigned.length > 0 && (
              <tr className="bg-slate-50/70">
                <td className="py-2 pr-2" colSpan={7}>
                  <div className="flex items-center gap-2 text-slate-600"><Avatar p={null} size="h-7 w-7 text-[10px]" /> <b>{unassigned.length}</b> open {unassigned.length === 1 ? 'task has' : 'tasks have'} no assignee</div>
                </td>
              </tr>
            )}
          </tbody>
        </table>
      </div>
      {rows.length > LIMIT && (
        <button onClick={() => setAll(!all)} className="no-print mt-2 w-full rounded-lg border border-dashed border-slate-300 py-1.5 text-xs font-semibold text-slate-600 hover:border-indigo-300 hover:text-indigo-700">{all ? `Show top ${LIMIT}` : `Show all ${rows.length} members`}</button>

      <Note>On-time % per member uses the same formula as the On time card (done on time / (done + open overdue)). "Done late" = tasks finished after their due date, with the single worst slip under it (a summed total would make one task 12 days late look the same as 12 tasks 1 day late). Members with no task are still listed. The table scrolls sideways on phones instead of squeezing.</Note>
    </Card>
  );
}

/* =====================================================================
   v6 · Band 4: phase map (phase_dependency) → selected phase → its tasks
   Real page: reuse PhaseCard + WorkflowEdge for the map and MindmapTree (readOnly) for the task graph.
   ===================================================================== */
const TONE_BAR = { emerald: 'bg-emerald-400', orange: 'bg-orange-400', rose: 'bg-rose-400', blue: 'bg-blue-400', slate: 'bg-slate-300' };
/* Pan and zoom for a scrollable graph box (stands in for hooks/usePanZoom + ZoomControls in the app).
   Mouse drag on the box moves the view; Ctrl + wheel zooms around the cursor; plain wheel and touch keep
   scrolling the page, so a long guest page never gets stuck on a graph. */
const ZMIN = 0.3, ZMAX = 1.6;
const clampZ = (v) => Math.min(ZMAX, Math.max(ZMIN, +v.toFixed(2)));
function useDragZoom(fitOf) {
  const ref = useRef(null);
  const [box, setBox] = useState({ w: 900, h: 400 });
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const ro = new ResizeObserver(([e]) => setBox({ w: e.contentRect.width, h: e.contentRect.height })); ro.observe(el); return () => ro.disconnect();
  }, []);
  const [zoom, setZoom] = useState(null);
  const fit = fitOf(box);
  const z = zoom ?? fit.start;
  const zRef = useRef(z); zRef.current = z;
  // zoom keeping the point at (px, py) of the box still
  const zoomAt = (nz, px, py) => {
    const el = ref.current, k = nz / zRef.current;
    const cx = el ? el.scrollLeft + px : 0, cy = el ? el.scrollTop + py : 0;
    setZoom(nz);
    requestAnimationFrame(() => { if (el) { el.scrollLeft = cx * k - px; el.scrollTop = cy * k - py; } });
  };
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const onWheel = (e) => {
      if (!e.ctrlKey && !e.metaKey) return;
      e.preventDefault();
      const r = el.getBoundingClientRect();
      zoomAt(clampZ(zRef.current * (e.deltaY < 0 ? 1.12 : 1 / 1.12)), e.clientX - r.left, e.clientY - r.top);
    };
    el.addEventListener('wheel', onWheel, { passive: false });
    return () => el.removeEventListener('wheel', onWheel);
  }, []);
  const drag = useRef(null), dragged = useRef(false);
  const [dragging, setDragging] = useState(false);
  const bind = {
    onPointerDown: (e) => {
      if (e.pointerType !== 'mouse' || e.button !== 0) return;
      const el = ref.current;
      drag.current = { x: e.clientX, y: e.clientY, sl: el.scrollLeft, st: el.scrollTop, id: e.pointerId };
      dragged.current = false;
    },
    onPointerMove: (e) => {
      const d = drag.current, el = ref.current; if (!d) return;
      const dx = e.clientX - d.x, dy = e.clientY - d.y;
      if (!dragged.current) {
        if (Math.hypot(dx, dy) < 5) return; // a small wobble is still a click on a card
        dragged.current = true; setDragging(true);
        try { el.setPointerCapture(d.id); } catch { /* pointer already gone */ }
      }
      el.scrollLeft = d.sl - dx; el.scrollTop = d.st - dy;
    },
    onPointerUp: () => { drag.current = null; setDragging(false); },
    onPointerCancel: () => { drag.current = null; setDragging(false); },
    // after a drag, swallow the click so the card under the mouse is not opened
    onClickCapture: (e) => { if (dragged.current) { e.stopPropagation(); e.preventDefault(); dragged.current = false; } },
  };
  const center = () => { const el = ref.current; return el ? [el.clientWidth / 2, el.clientHeight / 2] : [0, 0]; };
  return {
    ref, z, bind, dragging,
    zoomIn: () => zoomAt(clampZ(z + 0.15), ...center()),
    zoomOut: () => zoomAt(clampZ(z - 0.15), ...center()),
    fitAll: () => { setZoom(fit.all); requestAnimationFrame(() => ref.current && ref.current.scrollTo({ left: 0, top: 0 })); },
    reset: () => setZoom(null),
  };
}

function ZoomBar({ pz, className = '' }) {
  const b = 'rounded border border-slate-200 bg-white hover:bg-slate-50';
  return (
    <span className={`print-hide flex items-center gap-1 text-[11px] ${className}`}>
      <button onClick={pz.zoomOut} className={`${b} p-1`} title="Zoom out (or Ctrl + scroll)"><Icon d={I.minus} className="h-3 w-3" /></button>
      <span className="w-9 text-center font-semibold text-slate-600">{Math.round(pz.z * 100)}%</span>
      <button onClick={pz.zoomIn} className={`${b} p-1`} title="Zoom in (or Ctrl + scroll)"><Icon d={I.plus} className="h-3 w-3" /></button>
      <button onClick={pz.fitAll} className={`${b} px-1.5 py-0.5 font-semibold`} title="Show the whole graph">Fit</button>
    </span>
  );
}

const PAN_HINT = 'Drag to move · Ctrl + scroll to zoom';

function PhaseMap({ ds, m, sel, onSelect, artsByTask }) {
  const phases = m.phases.filter((p) => p.index >= 0);
  const CW = 196, CH = 104, GX = 52, GY = 14, PAD = 14;
  const [hover, setHover] = useState(null);
  const L = useMemo(() => {
    const col = Object.fromEntries(phases.map((p) => [p.index, 0]));
    for (let r = 0; r < phases.length; r++) ds.phaseDeps.forEach(([a, b]) => { if (col[a] !== undefined && col[b] !== undefined) col[b] = Math.max(col[b], col[a] + 1); });
    const maxC = Math.max(0, ...Object.values(col));
    const pos = {}; let rows = 1;
    for (let c = 0; c <= maxC; c++) {
      const inCol = phases.filter((p) => col[p.index] === c);
      rows = Math.max(rows, inCol.length);
      inCol.forEach((p, i) => (pos[p.index] = { x: PAD + c * (CW + GX), y: PAD + i * (CH + GY) }));
    }
    const skip = ds.phaseDeps.some(([a, b]) => col[b] - col[a] > 1);
    const body = PAD * 2 + rows * CH + (rows - 1) * GY;
    // edges that skip a column run along a lane under the cards instead of passing behind them
    return { pos, col, w: PAD * 2 + (maxC + 1) * CW + maxC * GX, h: body + (skip ? 26 : 0), lane: body + 8 };
  }, [ds, m]);
  const focus = hover ?? sel;
  const MAXH = 340;
  // start at the size that shows everything, but never so small that the cards cannot be read
  const pz = useDragZoom(({ w }) => {
    const all = Math.min(1, (w - 4) / L.w, (MAXH - 4) / L.h);
    return { start: Math.min(1, Math.max(0.7, all)), all: Math.max(ZMIN, all) };
  });
  const z = pz.z;
  // keep the selected phase in view when the map is bigger than the box
  useEffect(() => {
    const el = pz.ref.current, p = L.pos[sel]; if (!el || !p) return;
    const x = p.x * z, y = p.y * z, w = CW * z, h = CH * z;
    const out = x < el.scrollLeft || x + w > el.scrollLeft + el.clientWidth || y < el.scrollTop || y + h > el.scrollTop + el.clientHeight;
    if (out) el.scrollTo({ left: Math.max(0, x - 40), top: Math.max(0, y - 20), behavior: 'smooth' });
  }, [sel, L]);
  return (
    <div className="border-b border-slate-200">
      <div className="print-hide flex flex-wrap items-center justify-between gap-2 border-b border-slate-200 bg-white px-3 py-1.5 text-[11px] text-slate-500">
        <span>Arrows go from a phase to the phases that start after it. Click a phase to open its tasks below. <span className="hidden text-slate-400 sm:inline">{PAN_HINT}.</span></span>
        <ZoomBar pz={pz} />
      </div>
      <div ref={pz.ref} {...pz.bind} className={`print-full overflow-auto ${pz.dragging ? 'cursor-grabbing select-none' : 'cursor-grab'}`} style={{ maxHeight: MAXH, backgroundImage: 'radial-gradient(#cbd5e1 1px, transparent 1px)', backgroundSize: '20px 20px', backgroundColor: '#f8fafc' }}>
      <div style={{ width: L.w * z, height: L.h * z, minWidth: '100%' }}>
      <div className="relative" style={{ width: L.w, height: L.h, transform: `scale(${z})`, transformOrigin: '0 0' }}>
        <svg width={L.w} height={L.h} className="absolute inset-0">
          <defs><marker id="pm" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#94a3b8" /></marker>
            <marker id="pmOn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#4f46e5" /></marker></defs>
          {ds.phaseDeps.map(([a, b]) => {
            const p = L.pos[a], q = L.pos[b]; if (!p || !q) return null;
            const x1 = p.x + CW, y1 = p.y + CH / 2, x2 = q.x - 2, y2 = q.y + CH / 2;
            const on = focus === a || focus === b;
            const ly = L.lane, h = GX / 2;
            const d = L.col[b] - L.col[a] > 1
              ? `M${x1},${y1} C${x1 + h},${y1} ${x1 + h},${ly} ${x1 + h + 12},${ly} L${x2 - h - 12},${ly} C${x2 - h},${ly} ${x2 - h},${y2} ${x2},${y2}`
              : `M${x1},${y1} C${x1 + GX * 0.6},${y1} ${x2 - GX * 0.6},${y2} ${x2},${y2}`;
            return <path key={a + '-' + b} d={d} fill="none" stroke={on ? '#4f46e5' : '#94a3b8'} strokeWidth={on ? 2 : 1.3} strokeDasharray={on ? '' : '4 4'} opacity={focus !== null && !on ? 0.4 : 1} markerEnd={`url(#${on ? 'pmOn' : 'pm'})`} />;
          })}
        </svg>
        {phases.map((p) => {
          const pos = L.pos[p.index], isSel = p.index === sel;
          return (
            <button key={p.index} onClick={() => onSelect(p.index)} onMouseEnter={() => setHover(p.index)} onMouseLeave={() => setHover(null)}
              className={`absolute flex flex-col overflow-hidden rounded-xl border bg-white text-left shadow-sm transition ${isSel ? 'border-indigo-500 ring-2 ring-indigo-100' : 'border-slate-200 hover:border-slate-300'}`}
              style={{ left: pos.x, top: pos.y, width: CW, height: CH }}>
              <span className={`h-1.5 w-full shrink-0 ${TONE_BAR[p.verdict.tone]}`} />
              <span className="flex flex-1 flex-col justify-between px-3 py-2">
                <span>
                  <span className="flex items-center justify-between text-[10px] font-semibold text-slate-400"><span>Phase {p.index + 1}</span>{isSel && <span className="text-indigo-600">Viewing</span>}</span>
                  <span className="line-clamp-1 text-xs font-bold text-slate-900" title={p.name}>{p.name}</span>
                </span>
                <span className={`inline-flex w-fit items-center whitespace-nowrap rounded-full px-1.5 py-px text-[10px] font-semibold ring-1 ${TONE[p.verdict.tone][0]}`}>{p.verdict.label}</span>
                <span className="flex items-center gap-2">
                  <span className="h-1.5 flex-1 overflow-hidden rounded-full bg-slate-100"><span className={`block h-full ${p.end ? 'bg-emerald-500' : 'bg-indigo-500'}`} style={{ width: `${p.pct}%` }} /></span>
                  <span className="text-[10px] font-semibold text-slate-500">{p.done}/{p.tasks.length}{(() => { const n = p.tasks.reduce((s2, x) => s2 + (artsByTask[x.code] || []).length, 0); return n ? ` · 📎${n}` : ''; })()}</span>
                </span>
              </span>
            </button>
          );
        })}
      </div>
      </div>
      </div>
    </div>
  );
}

function layoutTaskGraph(ph, ds, showGhosts, D) {
  const { NW, NH, CG, RG, PAD } = D;
  const inSet = new Set(ph.tasks.map((t) => t.code));
  const ups = new Map(), downs = new Map();
  if (showGhosts) ph.tasks.forEach((t) => {
    t.deps.forEach((d) => { if (!inSet.has(d)) ups.set(d, { id: 'u:' + d, ref: ds.by[d], dir: 'up' }); });
    t.dependents.forEach((c) => { if (!inSet.has(c)) downs.set(c, { id: 'd:' + c, ref: ds.by[c], dir: 'down' }); });
  });
  const base = ups.size ? 1 : 0;
  const level = {};
  const lv = (t) => {
    if (level[t.code] !== undefined) return level[t.code];
    level[t.code] = base;
    let L = base;
    t.deps.forEach((d) => { L = Math.max(L, inSet.has(d) ? lv(ds.by[d]) + 1 : base); });
    return (level[t.code] = L);
  };
  ph.tasks.forEach(lv);
  const maxL = Math.max(base, ...ph.tasks.map((t) => level[t.code]));
  const cols = [];
  const push = (L, n) => (cols[L] = cols[L] || []).push(n);
  [...ups.values()].forEach((n) => push(0, n));
  ph.tasks.forEach((t) => push(level[t.code], { id: t.code, ref: t, dir: null }));
  [...downs.values()].forEach((n) => push(maxL + 1, n));
  const parentsOf = (n) => n.dir === 'up' ? [] : n.dir === 'down' ? n.ref.deps.filter((d) => inSet.has(d)) : n.ref.deps.map((d) => (inSet.has(d) ? d : 'u:' + d)).filter((d) => !d.startsWith('u:') || showGhosts);
  const pos = {};
  cols.forEach((col, L) => {
    if (!col) return;
    if (L > 0) {
      const bary = (n) => { const ps = parentsOf(n).filter((p) => pos[p]); return ps.length ? ps.reduce((s, p) => s + pos[p].y, 0) / ps.length : 1e9; };
      col.sort((a, b) => bary(a) - bary(b));
    }
    col.forEach((n, i) => (pos[n.id] = { x: PAD + L * (NW + CG), y: PAD + i * (NH + RG) }));
  });
  const nodes = cols.flat().filter(Boolean);
  const edges = [];
  nodes.forEach((n) => parentsOf(n).forEach((p) => pos[p] && edges.push({ from: p, to: n.id })));
  const rows = Math.max(1, ...cols.filter(Boolean).map((c) => c.length));
  return { nodes, pos, edges, w: PAD * 2 + cols.length * (NW + CG) - CG, h: PAD * 2 + rows * (NH + RG) - RG, ups: ups.size, downs: downs.size };
}

function TaskGraph({ ph, ds, people, selected, onPick }) {
  const D = { NW: 190, NH: 70, CG: 60, RG: 14, PAD: 18 };
  const ghostCount = useMemo(() => {
    const inSet = new Set(ph.tasks.map((t) => t.code));
    return new Set(ph.tasks.flatMap((t) => [...t.deps, ...t.dependents]).filter((c) => !inSet.has(c))).size;
  }, [ph]);
  const [showGhosts, setShowGhosts] = useState(ghostCount <= 10);
  const g = useMemo(() => layoutTaskGraph(ph, ds, showGhosts, D), [ph, ds, showGhosts]);
  const MAXH = 440;
  // start fitted to the width (cards stay readable); Fit shows the whole graph
  const pz = useDragZoom(({ w }) => ({
    start: Math.max(0.5, Math.min(1, (w - 8) / g.w)),
    all: Math.max(ZMIN, Math.min(1, (w - 8) / g.w, (MAXH - 8) / g.h)),
  }));
  const z = pz.z;
  const [hover, setHover] = useState(null);
  const focus = hover || selected;
  // hover dims unrelated cards; a selected task only highlights its own links
  const refOf = Object.fromEntries(g.nodes.map((n) => [n.id, n.ref]));
  const near = hover ? new Set([hover, ...g.edges.filter((e) => e.from === hover || e.to === hover).flatMap((e) => [e.from, e.to])]) : null;
  const phaseOf = (t) => (t.phase >= 0 ? `Phase ${t.phase + 1}` : 'No phase');
  return (
    <div className="overflow-hidden rounded-xl border border-slate-200">
      <div className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-200 bg-white px-3 py-2 text-[11px] text-slate-500">
        <span>Arrows go from a task to the tasks waiting for it. Click a card for its detail. <span className="hidden text-slate-400 sm:inline">{PAN_HINT}.</span></span>
        <span className="flex items-center gap-1.5">
          {ghostCount > 0 && (
            <label className="mr-1 flex cursor-pointer items-center gap-1.5 rounded-md border border-slate-200 px-2 py-0.5 font-semibold text-slate-600">
              <input type="checkbox" checked={showGhosts} onChange={(e) => { setShowGhosts(e.target.checked); pz.reset(); }} className="accent-indigo-600" /> Other phases ({ghostCount})
            </label>
          )}
          <ZoomBar pz={pz} />
        </span>
      </div>
      <div ref={pz.ref} {...pz.bind} className={`overflow-auto ${pz.dragging ? 'cursor-grabbing select-none' : 'cursor-grab'}`} style={{ maxHeight: MAXH, backgroundImage: 'radial-gradient(#cbd5e1 1px, transparent 1px)', backgroundSize: '20px 20px', backgroundColor: '#f8fafc' }}>
        <div style={{ width: g.w * z, height: g.h * z }}>
          <div className="relative" style={{ width: g.w, height: g.h, transform: `scale(${z})`, transformOrigin: '0 0' }}>
            <svg width={g.w} height={g.h} className="absolute inset-0">
              <defs>
                <marker id="ta" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#94a3b8" /></marker>
                <marker id="taOn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#4f46e5" /></marker>
                <marker id="taBl" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#e11d48" /></marker>
              </defs>
              {g.edges.map((e) => {
                const a = g.pos[e.from], b = g.pos[e.to];
                const x1 = a.x + D.NW, y1 = a.y + D.NH / 2, x2 = b.x - 2, y2 = b.y + D.NH / 2;
                const on = !!focus && (e.from === focus || e.to === focus);
                // a waiting task held by an unfinished one: the bottleneck the reviewer should see
                const blocking = refOf[e.to].status === 'LOCKED' && refOf[e.from].status !== 'DONE';
                return <path key={e.from + '>' + e.to} d={`M${x1},${y1} C${x1 + D.CG / 2},${y1} ${x2 - D.CG / 2},${y2} ${x2},${y2}`} fill="none"
                  stroke={on ? '#4f46e5' : blocking ? '#e11d48' : '#94a3b8'} strokeWidth={on || blocking ? 2 : 1.4} strokeDasharray={blocking && !on ? '5 4' : ''} opacity={near && !on ? 0.25 : 1} markerEnd={`url(#${on ? 'taOn' : blocking ? 'taBl' : 'ta'})`} />;
              })}
            </svg>
            {g.nodes.map((n) => {
              const t = n.ref, p = g.pos[n.id], ghost = !!n.dir;
              const isSel = !ghost && t.code === selected;
              const dim = near && !near.has(n.id);
              return (
                <button key={n.id} onClick={() => onPick(t.code)} onMouseEnter={() => setHover(n.id)} onMouseLeave={() => setHover(null)} title={`${t.code} · ${t.title}`}
                  className={`absolute flex flex-col justify-start gap-0.5 overflow-hidden rounded-lg border-l-4 px-2.5 py-1.5 text-left shadow-sm transition ${STATUS_BAR[t.status]} ${ghost ? 'border border-dashed border-slate-300 bg-white/70' : isSel ? 'border border-indigo-400 bg-white ring-2 ring-indigo-200' : 'border border-slate-200 bg-white hover:border-indigo-300'} ${dim ? 'opacity-30' : ''}`}
                  style={{ left: p.x, top: p.y, width: D.NW, height: D.NH }}>
                  {ghost && <span className="text-[9.5px] font-semibold uppercase tracking-wide text-slate-400">{n.dir === 'up' ? 'Needed from' : 'Unlocks in'} {phaseOf(t)}</span>}
                  <span className="flex items-center gap-1.5">
                    <span className="mono text-[10px] text-slate-400">{t.code}</span>
                    {isOverdue(t) && <span className="rounded bg-rose-50 px-1 text-[9.5px] font-semibold text-rose-700">overdue</span>}
                    {isLateDone(t) && <span className="rounded bg-orange-50 px-1 text-[9.5px] font-semibold text-orange-700">+{lateBy(t)}d</span>}
                    {!ghost && <span className="ml-auto"><Avatar p={t.who ? people[t.who] : null} size="h-4 w-4 text-[8px]" /></span>}
                  </span>
                  <span className={`${ghost ? 'line-clamp-1' : 'line-clamp-2'} text-[11.5px] font-medium leading-tight text-slate-800`}>{t.title}</span>
                </button>
              );
            })}
          </div>
        </div>
      </div>
      <div className="flex flex-wrap items-center gap-x-3 gap-y-1 border-t border-slate-200 bg-white px-3 py-1.5 text-[10.5px] text-slate-500">
        {['DONE', 'REVIEW', 'IN_PROGRESS', 'TODO', 'LOCKED'].map((s) => <span key={s} className="flex items-center gap-1"><Dot s={s} />{STATUS_CHIP[s][0]}</span>)}
        <span className="flex items-center gap-1"><span className="h-2.5 w-4 rounded border border-dashed border-slate-400" />task in another phase</span>
        <span className="flex items-center gap-1"><span className="w-4 border-t-2 border-dashed border-rose-500" />blocking: waits on an unfinished task</span>
      </div>
    </div>
  );
}

function PhaseInspector({ ds, m, people, artsByTask, ph, selTask, mode, setMode, goTask, onComment, onCommentPhase }) {
  const [filter, setFilter] = useState('all');
  const [rows, setRows] = useState(() => new Set());
  const [more, setMore] = useState(false);
  useEffect(() => { setFilter('all'); setMore(false); }, [ph.index]);
  useEffect(() => { if (selTask) setRows((s) => new Set(s).add(selTask)); }, [selTask]);
  const ups = ds.phaseDeps.filter(([, c]) => c === ph.index).map(([p]) => m.phases.find((x) => x.index === p)).filter(Boolean);
  const t = selTask && ds.by[selTask] && ds.by[selTask].phase === ph.index ? ds.by[selTask] : null;
  const match = (x) => filter === 'all' || (filter === 'late' && (isLateDone(x) || isOverdue(x))) || (filter === 'waiting' && x.status === 'LOCKED') || (filter === 'deliv' && (artsByTask[x.code] || []).length);
  const list = ph.tasks.filter(match);
  const shown = more ? list : list.slice(0, ROW_LIMIT);
  const arts = ph.tasks.reduce((s, x) => s + (artsByTask[x.code] || []).length, 0);
  const listView = (
    <div>
      <div className="no-print mb-2 flex flex-wrap gap-1.5">
        {[['all', `All (${ph.tasks.length})`], ['late', 'Late or overdue'], ['waiting', 'Waiting'], ['deliv', 'Has deliverable']].map(([k, label]) => (
          <button key={k} onClick={() => { setFilter(k); setMore(false); }} className={`rounded-full px-2.5 py-0.5 text-[11px] font-semibold ${filter === k ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>{label}</button>
        ))}
      </div>
      {list.length === 0 && <p className="py-4 text-center text-xs text-slate-400">No task in this phase matches the filter.</p>}
      {list.map((x, i) => (
        <div key={x.code} className={i < shown.length ? '' : 'hidden print-block'}>
          <TaskRow t={x} by={ds.by} people={people} arts={artsByTask[x.code] || []} open={rows.has(x.code)} flash={x.code === selTask}
            onToggle={() => setRows((s) => { const n = new Set(s); n.has(x.code) ? n.delete(x.code) : n.add(x.code); return n; })} onJump={goTask} onComment={() => onComment(x.code)} />
        </div>
      ))}
      {list.length > shown.length && <button onClick={() => setMore(true)} className="no-print my-2 w-full rounded-lg border border-dashed border-slate-300 py-1.5 text-xs font-semibold text-slate-600 hover:border-indigo-300 hover:text-indigo-700">Show {list.length - shown.length} more</button>}
    </div>
  );
  return (
    <div id="inspector" className="scroll-mt-28 p-4 sm:p-5">
      <div className="mb-3 flex flex-wrap items-start justify-between gap-3 border-b border-slate-100 pb-3">
        <div className="min-w-0 space-y-1">
          <div className="flex flex-wrap items-center gap-2">
            <h3 className="text-sm font-bold text-slate-900">{phaseLabel(ph)}</h3>
            <span className={`inline-flex items-center rounded-full px-2 py-0.5 text-[11px] font-semibold ring-1 ${TONE[ph.verdict.tone][0]}`}>{ph.verdict.label}</span>
            <span className="text-xs text-slate-600"><b>{ph.done}/{ph.tasks.length}</b> done</span>
            {ph.onTimePct !== null && <span className="text-xs text-slate-600">· {ph.onTimePct}% on time</span>}
            {arts > 0 && <span className="text-xs text-slate-600">· {plural(arts, 'deliverable')}</span>}
          </div>
          <p className="text-[11px] text-slate-500">Planned end <b className="text-slate-700">{fmt(ph.plannedEnd)}</b>{ph.end && <> · finished <b className="text-slate-700">{fmt(ph.end)}</b></>} · comes after: <b className="text-slate-700">{ups.length ? ups.map((u) => `Phase ${u.index + 1}`).join(', ') : 'nothing (starting phase)'}</b></p>
        </div>
        <div className="no-print flex flex-wrap items-center gap-2">
          <button onClick={() => onCommentPhase(ph.index)} className="rounded-lg border border-indigo-200 bg-indigo-50 px-2.5 py-1 text-[11px] font-semibold text-indigo-700 hover:bg-indigo-100">Comment on this phase</button>
          <div className="inline-flex rounded-lg border border-slate-200 bg-slate-50 p-0.5 text-[11px]">
            {[['graph', 'Task graph'], ['list', 'Task list']].map(([k, label]) => (
              <button key={k} onClick={() => setMode(k)} className={`rounded-md px-2.5 py-1 font-semibold ${mode === k ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}>{label}</button>
            ))}
          </div>
        </div>
      </div>
      {mode === 'graph' ? (
        <>
          <div className="no-print">
            <TaskGraph key={ph.index} ph={ph} ds={ds} people={people} selected={t ? t.code : null} onPick={goTask} />
            {t ? (
              <div className="mt-3 rounded-xl border border-slate-200 bg-white p-3">
                <div className="mb-2 flex flex-wrap items-center gap-2">
                  <span className="mono rounded bg-slate-800 px-1.5 py-0.5 text-[10px] font-bold text-white">{t.code}</span>
                  <b className="text-sm text-slate-900">{t.title}</b>
                  <Chip s={t.status} />
                  {isOverdue(t) && <span className="rounded bg-rose-50 px-1.5 py-0.5 text-[10.5px] font-semibold text-rose-700">Overdue {daysBetween(t.due, TODAY)}d</span>}
                  {isLateDone(t) && <span className="rounded bg-orange-50 px-1.5 py-0.5 text-[10.5px] font-semibold text-orange-700">+{lateBy(t)}d late</span>}
                  {t.reopened && <span className="rounded bg-violet-50 px-1.5 py-0.5 text-[10.5px] font-semibold text-violet-700">Reopened</span>}
                </div>
                <TaskDetails flush t={t} by={ds.by} people={people} arts={artsByTask[t.code] || []} onJump={goTask} onComment={() => onComment(t.code)} />
              </div>
            ) : <p className="mt-3 text-center text-xs text-slate-400">Click a task in the graph to see its detail here.</p>}
          </div>
          <div className="hidden print-block">{listView}</div>
        </>
      ) : listView}
    </div>
  );
}

/* =====================================================================
   Reading flow: section headings, sticky section nav, "at a glance", phase scorecard
   ===================================================================== */
const SECTIONS = [['s-overview', 'Overview'], ['s-schedule', 'Schedule & deadlines'], ['s-team', 'Team & proof'], ['s-deep', 'Phases & tasks'], ['s-feedback', 'Feedback']];

function SectionNav() {
  const [active, setActive] = useState('s-overview');
  useEffect(() => {
    const io = new IntersectionObserver((es) => es.forEach((e) => e.isIntersecting && setActive(e.target.id)), { rootMargin: '-40% 0px -55% 0px' });
    SECTIONS.forEach(([id]) => { const el = document.getElementById(id); if (el) io.observe(el); });
    return () => io.disconnect();
  }, []);
  return (
    <nav className="sticky-nav no-print sticky top-[57px] z-10 border-b border-slate-200 bg-white/90 backdrop-blur">
      <div className="mx-auto flex max-w-5xl gap-1 overflow-x-auto px-4 py-2 sm:px-6">
        {SECTIONS.map(([id, label], i) => (
          <a key={id} href={'#' + id} onClick={(e) => { e.preventDefault(); document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); }}
            className={`shrink-0 rounded-full px-3 py-1 text-xs font-semibold transition ${active === id ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-100'}`}>
            <span className={active === id ? 'text-slate-400' : 'text-slate-400'}>{i + 1}</span> {label}
          </a>
        ))}
      </div>
    </nav>
  );
}

function SectionHead({ n, title, q }) {

      <span className="mt-0.5 flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-slate-900 text-xs font-bold text-white">{n}</span>
      <div>
        <h2 className="text-lg font-bold leading-tight text-slate-900">{title}</h2>
        <p className="mt-0.5 text-sm text-slate-500">{q}</p>
      </div>

}

// Full-width status split (idea from the Neon mock): finished work is split into on time and late

    <div className="card rise rounded-2xl border border-slate-200 bg-white px-5 py-3.5">
      <div className="flex h-2.5 overflow-hidden rounded-full bg-slate-100">
        {m.breakdown.map((s) => <div key={s.key} className={s.c} style={{ width: `${(s.n / m.total) * 100}%` }} title={`${s.label}: ${s.n}`} />)}
      </div>
      <div className="mt-2.5 flex flex-wrap gap-x-5 gap-y-1 text-xs text-slate-600">
