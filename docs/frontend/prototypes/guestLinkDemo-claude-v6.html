const TONE = {
  emerald: ['bg-emerald-50 text-emerald-700 ring-emerald-200', 'bg-emerald-400'],
  orange: ['bg-orange-50 text-orange-700 ring-orange-200', 'bg-emerald-400'],
  rose: ['bg-rose-50 text-rose-700 ring-rose-200', 'bg-blue-400'],
  blue: ['bg-blue-50 text-blue-700 ring-blue-200', 'bg-blue-400'],
  slate: ['bg-slate-50 text-slate-500 ring-slate-200', 'bg-slate-300'],
};
function PhaseScorecard({ ds, m, onOpen }) {
  const phases = m.phases.filter((p) => p.tasks.length); // includes the "No phase" group when it exists
  const t0 = startOfDay(new Date(Math.min(ds.project.startedAt.getTime(), ...ds.tasks.map((t) => t.created.getTime())))).getTime();
  const t1 = (m.completed ? Math.max(m.deadline, m.finishedAt) : Math.max(m.deadline, TODAY)) + 2 * DAY;
  const X = (d) => Math.max(0, Math.min(100, ((d - t0) / (t1 - t0)) * 100));
  const todayX = X(TODAY.getTime());
  const cols = 'sm:grid-cols-[minmax(0,1.25fr)_96px_minmax(0,2fr)_150px]';
  return (
    <Card>
      <div className={`hidden gap-4 border-b border-slate-100 pb-2 text-[10.5px] font-bold uppercase tracking-wide text-slate-400 sm:grid ${cols}`}>
        <span>Phase</span><span>Done</span>
        <span className="flex justify-between"><span>{fmt(new Date(t0))}</span><span>Timeline</span><span>{fmt(new Date(t1 - 2 * DAY))}</span></span>
        <span>Result</span>
      </div>
      <div className="divide-y divide-slate-100">
        {phases.map((ph) => {
          const s = ph.start ? X(ph.start.getTime()) : null;
          const e = X((ph.end || TODAY).getTime());
          const p = X(ph.plannedEnd.getTime());
          const overrun = s !== null && e > p;
          return (
            <button key={ph.index} onClick={() => onOpen(ph)} className={`group grid w-full grid-cols-1 items-center gap-x-4 gap-y-2 py-3 text-left hover:bg-slate-50 sm:py-2.5 ${cols}`}>
              <span className="min-w-0">
                <span className="block truncate text-sm font-semibold text-slate-900 group-hover:text-indigo-700">{phaseLabel(ph)}</span>
                <span className="text-[11px] text-slate-500">{plural(ph.tasks.length, 'task')}{ph.onTimePct !== null && <> · {ph.onTimePct}% on time</>}{ph.lateN + ph.overdueN > 0 && <> · <span className="font-semibold text-orange-600">{ph.lateN + ph.overdueN} late</span></>}</span>
              </span>
              <span className="flex items-center gap-2">
                <span className="w-9 text-right text-xs font-bold text-slate-800">{ph.pct}%</span>
                <span className="h-1.5 flex-1 rounded-full bg-slate-100"><span className={`block h-full rounded-full ${ph.end ? 'bg-emerald-500' : 'bg-indigo-500'}`} style={{ width: `${ph.pct}%` }} /></span>
              </span>
              <span className="relative block h-6" title={`${ph.start ? 'Worked ' + fmt(ph.start) + ' → ' + (ph.end ? fmt(ph.end) : 'now') : 'Not started'} · planned end ${fmt(ph.plannedEnd)}`}>
                <span className="absolute inset-x-0 top-1/2 h-px bg-slate-200" />
                {s !== null && <span className={`absolute top-1/2 h-2.5 -translate-y-1/2 rounded-full ${TONE[ph.verdict.tone][1]}`} style={{ left: `${s}%`, width: `${Math.max(1.2, Math.min(e, p) - s)}%` }} />}
                {overrun && <span className={`absolute top-1/2 h-2.5 -translate-y-1/2 rounded-r-full ${ph.end ? 'bg-orange-500' : 'bg-rose-500'}`} style={{ left: `${Math.max(s, p)}%`, width: `${Math.max(1, e - Math.max(s, p))}%` }} />}
                <span className="absolute top-1/2 h-2.5 w-2.5 -translate-x-1/2 -translate-y-1/2 rotate-45 border-2 border-white bg-slate-800" style={{ left: `${p}%` }} />
                {!m.completed && <span className="absolute inset-y-0 w-px bg-indigo-400" style={{ left: `${todayX}%` }} />}
              </span>
              <span className="flex flex-col items-start gap-0.5">
                <span className={`inline-flex items-center whitespace-nowrap rounded-full px-2 py-0.5 text-[11px] font-semibold ring-1 ${TONE[ph.verdict.tone][0]}`}>{ph.verdict.label}</span>
                <span className="text-[10.5px] text-slate-500">{ph.end ? `done ${fmt(ph.end)} · ` : ''}plan {fmt(ph.plannedEnd)}</span>
              </span>
            </button>
          );
        })}
      </div>
      <div className="mt-3 flex flex-wrap gap-x-4 gap-y-1 border-t border-slate-100 pt-3 text-[11px] text-slate-500">
        <span className="flex items-center gap-1.5"><span className="h-2 w-5 rounded-full bg-emerald-400" />worked on, within plan</span>
        <span className="flex items-center gap-1.5"><span className="h-2 w-5 rounded-full bg-orange-500" />past the planned end (finished)</span>
        <span className="flex items-center gap-1.5"><span className="h-2 w-5 rounded-full bg-rose-500" />past the planned end (still open)</span>
        <span className="flex items-center gap-1.5"><span className="h-2.5 w-2.5 rotate-45 bg-slate-800" />planned end</span>
        {!m.completed && <span className="flex items-center gap-1.5"><span className="h-3 w-px bg-indigo-400" />today</span>}
        <span className="no-print ml-auto">Click a phase to open its tasks</span>
      </div>
      <Note>A phase has no deadline column, so its planned end = the latest due date of its tasks. Bar = from the first task started (NodeEntity.startedAt) to the last task done (completedAt), or to today. Result: finished on time / finished N days late / behind (has overdue tasks) / on track / not started. "% on time" uses the same formula as the On time card. Tasks without a phase get their own row. If a phase has no startedAt (cleared when a task goes back to TODO, or old data), the bar starts at its first completedAt. No database change.</Note>
    </Card>
  );
}

function Page({ ds, demo, owner, setOwner }) {
  const m = useMemo(() => computeMetrics(ds), [ds]);
  const people = usePeople(ds.members, demo.names);
  const [visible, setVisible] = useState(() => new Set(ds.artifacts.filter((a) => !a.defaultHidden).map((a) => a.id)));
  const [fbTask, setFbTask] = useState('');
  const [fbFocus, setFbFocus] = useState(0);
  const arts = ds.artifacts.filter((a) => visible.has(a.id));
  const artsByTask = useMemo(() => { const o = {}; arts.forEach((a) => (o[a.task] = o[a.task] || []).push(a)); return o; }, [arts.length, visible]);
  const scrollTo = (id) => setTimeout(() => document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60);
  const print = () => window.print();
  const sec = 'scroll-mt-28';

  // Band 4 state: which phase is open in the inspector, which task is selected, graph or list
  const firstPick = (ph) => (ph.tasks.find(isOverdue) || ph.tasks.find(isLateDone) || null)?.code || null;
  const [selPhase, setSelPhase] = useState(() => {
    if (!m.completed) return m.current.index;
    const real = m.phases.filter((p) => p.index >= 0);
    return real.reduce((b, p) => (p.lateN > b.lateN ? p : b), real[0]).index; // finished project: open the phase that slipped most
  });
  const [selTask, setSelTask] = useState(() => firstPick(m.phases.find((p) => p.index === selPhase)));
  const [mode, setMode] = useState(() => (window.innerWidth < 640 ? 'list' : 'graph')); // phones start with the list
  const ph = m.phases.find((p) => p.index === selPhase) || m.phases[0];
  const goTask = (code) => { const t = ds.by[code]; setSelPhase(t.phase); setSelTask(code); scrollTo('inspector'); };
  const openPhase = (idx) => { setSelPhase(idx); setSelTask(firstPick(m.phases.find((p) => p.index === idx))); };
  const comment = (scope) => { setFbTask(scope); setFbFocus(Date.now()); };

  return (
    <>
      <TopBar onPrint={print} linkExpiresAt={ds.project.linkExpiresAt} onFeedback={() => scrollTo('s-feedback')} />
      <SectionNav />
      <main className="mx-auto max-w-6xl px-4 pb-28 sm:px-6">
        {/* 1. Overview: the whole picture in one screen */}
        <section id="s-overview" className={`${sec} space-y-4 pt-6`}>
          <ProjectHeader ds={ds} m={m} />
          <Kpis m={m} arts={arts} onOverdue={() => scrollTo('s-schedule')} />
          <StatusRibbon m={m} />
          <AiSummary ai={ds.ai} mode={demo.ai} />
        </section>

        {/* 2. Schedule & deadlines: plan vs reality per phase, pace over time, what slipped */}
        <section id="s-schedule" className={sec}>
          <SectionHead n={2} title="Schedule & deadlines" q="Did each phase finish by its plan, did the team work steadily, and what slipped?" />
          <PhaseScorecard ds={ds} m={m} onOpen={(p) => { openPhase(p.index); scrollTo('s-deep'); }} />
          <div className="print-cols-1 mt-5 grid items-start gap-5 lg:grid-cols-12">
            <div className="min-w-0 lg:col-span-7"><BurnUp ds={ds} m={m} /></div>
            <div className="min-w-0 lg:col-span-5"><DeadlineAudit m={m} people={people} onGraph={(code) => { setMode('graph'); goTask(code); }} onComment={comment} /></div>
          </div>
        </section>

        {/* 3. Team & proof: who delivered what, and where the evidence is */}
        <section id="s-team" className={sec}>
          <SectionHead n={3} title="Team & proof" q="Who delivered what, and where is the evidence?" />
          <div className="print-cols-1 grid items-start gap-5 lg:grid-cols-12">
            <div className="min-w-0 lg:col-span-7"><TeamTable ds={ds} people={people} /></div>
            <div className="min-w-0 lg:col-span-5"><Evidence arts={arts} onGoTask={goTask} /></div>
          </div>
        </section>

        {/* 4. Phases & tasks: phase map → one phase → its tasks (graph or list) */}
        <section id="s-deep" className={sec}>
          <SectionHead n={4} title="Phases & tasks" q="How the phases depend on each other. Pick a phase to see its tasks as a graph or a list." />
          <div className="card print-break overflow-hidden rounded-2xl border border-slate-200 bg-white">
            <PhaseMap ds={ds} m={m} sel={selPhase} onSelect={openPhase} artsByTask={artsByTask} />
            {m.phases.some((p) => p.index === -1) && (
              <div className="no-print border-b border-slate-100 bg-slate-50/60 px-4 py-2 text-xs text-slate-600">
                <button onClick={() => openPhase(-1)} className={`font-semibold hover:underline ${selPhase === -1 ? 'text-indigo-700' : 'text-slate-700'}`}>Tasks without a phase ({m.phases.find((p) => p.index === -1).tasks.length})</button> <span className="text-slate-400">· not part of the phase map</span>
              </div>
            )}
            <PhaseInspector ds={ds} m={m} people={people} artsByTask={artsByTask} ph={ph} selTask={selTask} mode={mode} setMode={setMode}
              goTask={goTask} onComment={comment} onCommentPhase={(i) => comment('p:' + i)} />
            <div className="border-t border-slate-100 px-5 pb-4"><Note>Phase map = phase_dependency (cards coloured by the phase result from section 2). The selected phase shows its tasks as a graph (MindmapTree readOnly in the real page, tasks from other phases as ghost cards) or as a list for phones and print. Clicking a task in another phase, a dependency chip, a deliverable's task code or "Graph" in Deadlines all open that task here. Both graphs pan by mouse drag and zoom with Ctrl + scroll or the buttons (usePanZoom + ZoomControls in the real page); plain scrolling and touch still scroll the page. "Blocks N tasks" on a task = every unfinished task further down its dependency chain, not only the direct arrows.</Note></div>
          </div>
        </section>

        {/* 5. Act */}
        <section id="s-feedback" className={sec}>
          <SectionHead n={5} title="Feedback" q="Comment on the whole project, a phase or a task. It is one-way: there is no reply thread." />
          <div className="max-w-2xl"><Feedback ds={ds} m={m} task={fbTask} setTask={setFbTask} focusKey={fbFocus} /></div>
        </section>
        <p className="pt-8 text-center text-[11px] text-slate-400">Shared read-only by the project owner · Pipeline Engine</p>
      </main>
      {owner && <OwnerPanel ds={ds} onClose={() => setOwner(false)} visible={visible} setVisible={setVisible} />}
    </>
  );
}

function App() {
  // URL params for quick review: ?data=new|normal|done|large&ai=stale|none&notes=1&owner=1
  const q = new URLSearchParams(location.search);
  const [demo, setDemo] = useState({ size: DATASETS[q.get('data')] ? q.get('data') : 'normal', names: true /* decided: always real names */, ai: q.get('ai') || 'fresh', notes: q.get('notes') === '1' });
  const [owner, setOwner] = useState(q.get('owner') === '1');
  return (
    <NotesCtx.Provider value={demo.notes}>
      <Page key={demo.size} ds={DATASETS[demo.size]} demo={demo} owner={owner} setOwner={setOwner} />
      <DemoPanel s={demo} set={setDemo} onOwner={() => setOwner(true)} />
    </NotesCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
