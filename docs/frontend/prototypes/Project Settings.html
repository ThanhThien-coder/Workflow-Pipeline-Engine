<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Settings</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  html,body{margin:0;background:#f8fafc;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .pop{animation:pop .18s ease-out}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const ME = {
  alex:  { name: "Alex Kim",   role: "OWNER",        icon: "👑" },
  sarah: { name: "Sarah Chen", role: "COLLABORATOR", icon: "🛠" },
  jamie: { name: "Jamie Doe",  role: "VIEWER",       icon: "👁" },
};
const MEMBERS0 = [
  { id: 1, name: "Alex Kim",   email: "alex.kim@acme.io",   role: "OWNER",        nodes: 3, joined: "Sep 02, 2026" },
  { id: 2, name: "Sarah Chen", email: "sarah.chen@acme.io", role: "COLLABORATOR", nodes: 4, joined: "Sep 04, 2026" },
  { id: 3, name: "Marcus Liu", email: "marcus.liu@acme.io", role: "COLLABORATOR", nodes: 0, joined: "Sep 09, 2026" },
  { id: 4, name: "Jamie Doe",  email: "jamie.doe@acme.io",  role: "VIEWER",       nodes: 0, joined: "Sep 15, 2026" },
];
const STATUS = {
  DRAFT: "bg-slate-100 text-slate-700 border-slate-200",
  ACTIVE: "bg-emerald-50 text-emerald-700 border-emerald-200",
  INACTIVE: "bg-amber-50 text-amber-700 border-amber-200",
  ARCHIVED: "bg-red-50 text-red-700 border-red-200",
};
const ROLE_CLS = {
  OWNER: "bg-indigo-50 text-indigo-700 border-indigo-200",
  COLLABORATOR: "bg-blue-50 text-blue-700 border-blue-200",
  VIEWER: "bg-slate-100 text-slate-600 border-slate-200",
};
const EVENT = {
  MEMBER_INVITED:     { cls: "bg-blue-50 text-blue-700 border-blue-200", scope: "Access", cat: "Security & RBAC" },
  ROLE_CHANGED:       { cls: "bg-amber-50 text-amber-700 border-amber-200", scope: "Access", cat: "Security & RBAC" },
  MEMBER_REMOVED:     { cls: "bg-red-50 text-red-700 border-red-200", scope: "Access", cat: "Security & RBAC" },
  PIPELINE_PUBLISHED: { cls: "bg-emerald-50 text-emerald-700 border-emerald-200", scope: "Lifecycle", cat: "Lifecycle" },
  PROJECT_UPDATED:    { cls: "bg-violet-50 text-violet-700 border-violet-200", scope: "Governance", cat: "Configuration" },
};
const CATS = { "All Events": null, "Security & RBAC": "Security & RBAC", "Lifecycle": "Lifecycle", "Configuration": "Configuration" };
const SEED_LOGS = [
  { id: 5, ts: "2026-10-03 09:12:44", actor: "Alex Kim", role: "OWNER", action: "ROLE_CHANGED", details: "Changed Jamie Doe's role from COLLABORATOR to VIEWER." },
  { id: 4, ts: "2026-09-29 16:40:05", actor: "Alex Kim", role: "OWNER", action: "MEMBER_INVITED", details: "Invited marcus.liu@acme.io as COLLABORATOR." },
  { id: 3, ts: "2026-09-24 08:30:00", actor: "SYSTEM", role: "SYSTEM", action: "PROJECT_UPDATED", details: "Refreshed cached AI analysis for the project." },
  { id: 2, ts: "2026-09-12 11:05:31", actor: "Alex Kim", role: "OWNER", action: "PROJECT_UPDATED", details: "Updated project description." },
  { id: 1, ts: "2026-09-02 10:00:12", actor: "Alex Kim", role: "OWNER", action: "MEMBER_INVITED", details: "Invited sarah.chen@acme.io as COLLABORATOR." },
];
const stamp = () => { const d = new Date(), p = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; };
const btn = "whitespace-nowrap text-xs font-semibold rounded-lg px-3 py-1.5 transition-colors disabled:opacity-40 disabled:pointer-events-none";
const primary = `${btn} bg-indigo-600 text-white hover:bg-indigo-700`;
const ghost = `${btn} bg-white border border-slate-200 text-slate-700 hover:bg-slate-50`;
const danger = `${btn} bg-red-600 text-white hover:bg-red-700`;
const input = "w-full text-sm py-1.5 px-3 rounded-lg border border-slate-200 bg-white outline-none focus:border-indigo-500 disabled:bg-slate-50 disabled:text-slate-500";

const Card = ({ title, desc, children, tone = "" }) => (
  <section className={`rounded-xl border bg-white ${tone || "border-slate-200"}`}>
    <div className="px-5 pt-4 pb-3 border-b border-slate-100">
      <h2 className="text-sm font-bold text-slate-800">{title}</h2>
      {desc && <p className="text-xs text-slate-500 mt-0.5">{desc}</p>}
    </div>
    <div className="p-5">{children}</div>
  </section>
);
const Avatar = ({ name }) => (
  <span className="w-7 h-7 shrink-0 rounded-full bg-slate-200 text-slate-600 text-[11px] font-bold grid place-items-center">{name.split(" ").map((s) => s[0]).join("")}</span>
);
const Modal = ({ title, children, onClose }) => (
  <div className="fixed inset-0 z-50 bg-slate-900/40 grid place-items-center p-4" onClick={onClose}>
    <div className="pop w-full max-w-md rounded-2xl bg-white p-5 space-y-3 shadow-xl" onClick={(e) => e.stopPropagation()}>
      <h3 className="font-bold text-slate-800">{title}</h3>
      {children}
    </div>
  </div>
);

function App() {
  const [who, setWho] = useState("alex");
  const me = ME[who];
  const isOwner = me.role === "OWNER";
  const [status, setStatus] = useState("DRAFT");
  const [saved, setSaved] = useState({ name: "Marketing Campaign Q4", desc: "Coordinates content, design and launch tasks for the Q4 campaign." });
  const [form, setForm] = useState(saved);
  const [members, setMembers] = useState(MEMBERS0);
  const [cycle, setCycle] = useState(false);
  const [modal, setModal] = useState(null);
  const [inv, setInv] = useState({ who: "", role: "COLLABORATOR" });
  const [toast, setToast] = useState(null);
  const [logs, setLogs] = useState(SEED_LOGS);
  const [q, setQ] = useState("");
  const [cat, setCat] = useState("All Events");
  const log = (action, details) => setLogs((l) => [{ id: Date.now() + Math.random(), ts: stamp(), actor: me.name, role: me.role, action, details, fresh: true }, ...l]);
  const shown = logs.filter((l) => (!CATS[cat] || EVENT[l.action].cat === CATS[cat]) && `${l.action} ${l.details} ${l.actor}`.toLowerCase().includes(q.toLowerCase()));

  const canEdit = isOwner;
  const dirty = form.name !== saved.name || form.desc !== saved.desc;
  const say = (m) => { setToast(m); clearTimeout(say.t); say.t = setTimeout(() => setToast(null), 2600); };
  const close = () => setModal(null);

  const save = () => {
    const ch = [form.name !== saved.name && "name", form.desc !== saved.desc && "description"].filter(Boolean).join(" and ");
    setSaved(form); say("Project details saved.");
    log("PROJECT_UPDATED", `Updated project ${ch}.`);
  };
  const publish = () => {
    if (cycle) return setModal({ type: "cycle" });
    setStatus("ACTIVE");
    say("Pipeline published successfully. Kahn's check passed.");
    log("PIPELINE_PUBLISHED", "Published pipeline from DRAFT to ACTIVE (Kahn cycle check passed with 24 nodes).");
  };
  const invite = () => {
    if (!inv.who.trim()) return;
    setMembers((m) => [...m, { id: Date.now(), name: inv.who.includes("@") ? inv.who.split("@")[0] : inv.who, email: inv.who.includes("@") ? inv.who : `${inv.who.toLowerCase().replace(/\s+/g, ".")}@acme.io`, role: inv.role, nodes: 0, joined: "Oct 03, 2026" }]);
    say(`Invitation sent to ${inv.who}.`);
    log("MEMBER_INVITED", `Invited ${inv.who} as ${inv.role}.`);
    setInv({ who: "", role: "COLLABORATOR" });
    close();
  };
  const changeRole = (m, role) => {
    if (m.role !== "VIEWER" && role === "VIEWER" && m.nodes > 0) return setModal({ type: "kick", m, demote: true });
    setMembers((ms) => ms.map((x) => (x.id === m.id ? { ...x, role } : x)));
    say(`${m.name} is now ${role}.`);
    log("ROLE_CHANGED", `Changed ${m.name}'s role from ${m.role} to ${role}.`);
  };
  const remove = (m) => {
    setMembers((ms) => ms.filter((x) => x.id !== m.id));
    say(m.nodes ? `${m.name} removed. ${m.nodes} task(s) unassigned.` : `${m.name} removed.`);
    log("MEMBER_REMOVED", `Removed ${m.name} from workspace${m.nodes ? ` (Unassigned ${m.nodes} active tasks)` : ""}.`);
    close();
  };
  const demote = (m) => {
    setMembers((ms) => ms.map((x) => (x.id === m.id ? { ...x, role: "VIEWER", nodes: 0 } : x)));
    say(`${m.name} is now VIEWER. ${m.nodes} task(s) unassigned.`);
    log("ROLE_CHANGED", `Changed ${m.name}'s role from ${m.role} to VIEWER (Unassigned ${m.nodes} active tasks).`);
    close();
  };

  return (
    <div className="min-h-screen pb-16" style={{ paddingTop: "env(safe-area-inset-top,0px)", paddingBottom: "env(safe-area-inset-bottom,0px)" }}>
      <div className="max-w-4xl mx-auto px-4 pt-6 space-y-4">
        <header className="flex flex-wrap items-start justify-between gap-3">
          <div>
            <h1 className="text-xl font-extrabold text-slate-800">Project Settings</h1>
            <p className="text-xs text-slate-500 mt-1">Manage pipeline configuration, workspace members, and governance policies.</p>
          </div>
          <label className="flex items-center gap-2 text-xs text-slate-500">
            Viewing as
            <select value={who} onChange={(e) => setWho(e.target.value)} className="text-xs font-semibold py-1.5 px-2 rounded-lg border border-slate-200 bg-white">
              {Object.entries(ME).map(([k, u]) => <option key={k} value={k}>{u.icon} {u.name} ({u.role})</option>)}
            </select>
          </label>
        </header>

        {!isOwner && <div className="text-xs rounded-lg border border-amber-200 bg-amber-50 text-amber-800 px-3 py-2">You are viewing settings with read-only permissions.</div>}

        <Card title="General" desc="Basic information about this pipeline.">
          <div className="space-y-3">
            <div>
              <label className="text-xs font-semibold text-slate-600">Project name</label>
              <input className={`${input} mt-1`} value={form.name} disabled={!canEdit} onChange={(e) => setForm({ ...form, name: e.target.value })} />
            </div>
            <div>
              <label className="text-xs font-semibold text-slate-600">Description</label>
              <textarea rows={3} className={`${input} mt-1 resize-none`} value={form.desc} disabled={!canEdit} onChange={(e) => setForm({ ...form, desc: e.target.value })} />
            </div>
            <div className="flex flex-wrap items-center justify-between gap-3 pt-1">
              <div className="flex items-center gap-2">
                <span className="text-xs font-semibold text-slate-600">Lifecycle status</span>
                <span className={`text-[11px] font-bold border rounded-full px-2 py-0.5 ${STATUS[status]}`}>{status}</span>
              </div>
              <div className="flex flex-wrap items-center gap-2">
                {isOwner && status === "DRAFT" && (
                  <>
                    <label className="flex items-center gap-1.5 text-[11px] text-slate-400 cursor-pointer">
                      <input type="checkbox" checked={cycle} onChange={(e) => setCycle(e.target.checked)} /> Simulate cycle (demo)
                    </label>
                    <button className={primary} onClick={publish}>Publish Pipeline</button>
                  </>
                )}
                <button className={primary} disabled={!canEdit || !dirty} onClick={save}>Save Changes</button>
              </div>
            </div>
          </div>
        </Card>

        <Card title="Workspace Members" desc="People with access to this pipeline.">
          <div className="flex justify-end mb-3">
            {isOwner && <button className={primary} onClick={() => setModal({ type: "invite" })}>Invite Member</button>}
          </div>
          <div className="overflow-x-auto -mx-1">
            <table className="w-full text-left min-w-[560px]">
              <thead>
                <tr className="text-[11px] uppercase tracking-wide text-slate-400">
                  <th className="font-semibold px-1 pb-2">Member</th><th className="font-semibold px-1 pb-2">Role</th>
                  <th className="font-semibold px-1 pb-2">Active nodes</th><th className="font-semibold px-1 pb-2">Joined</th>
                  {isOwner && <th className="px-1 pb-2" />}
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {members.map((m) => (
                  <tr key={m.id} className="text-sm">
                    <td className="px-1 py-2.5">
                      <div className="flex items-center gap-2.5">
                        <Avatar name={m.name} />
                        <div className="min-w-0"><div className="font-semibold text-slate-800 text-[13px] truncate">{m.name}</div><div className="text-[11px] text-slate-400 truncate">{m.email}</div></div>
                      </div>
                    </td>
                    <td className="px-1 py-2.5">
                      {isOwner && m.role !== "OWNER" ? (
                        <select value={m.role} onChange={(e) => changeRole(m, e.target.value)} className="text-xs font-semibold py-1 px-2 rounded-lg border border-slate-200 bg-white">
                          <option>COLLABORATOR</option><option>VIEWER</option>
                        </select>
                      ) : <span className={`text-[11px] font-bold border rounded-full px-2 py-0.5 ${ROLE_CLS[m.role]}`}>{m.role}</span>}
                    </td>
                    <td className="px-1 py-2.5 text-xs text-slate-600 whitespace-nowrap">{m.nodes} active node{m.nodes === 1 ? "" : "s"}</td>
                    <td className="px-1 py-2.5 text-xs text-slate-500 whitespace-nowrap">{m.joined}</td>
                    {isOwner && (
                      <td className="px-1 py-2.5 text-right">
                        {m.role !== "OWNER" && <button className={`${ghost} !text-red-600`} onClick={() => (m.nodes ? setModal({ type: "kick", m }) : remove(m))}>Remove</button>}
                      </td>
                    )}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </Card>

        <Card title="System Audit Log" desc="Immutable chronological record of project governance, permission adjustments, and lifecycle events.">
          <div className="flex flex-wrap items-center gap-2 mb-3">
            <input className={`${input} !w-56 max-w-full`} placeholder="Search events..." value={q} onChange={(e) => setQ(e.target.value)} />
            <select className="text-xs font-semibold py-1.5 px-2 rounded-lg border border-slate-200 bg-white" value={cat} onChange={(e) => setCat(e.target.value)}>
              {Object.keys(CATS).map((c) => <option key={c}>{c}</option>)}
            </select>
            <span className="text-[11px] text-slate-400 ml-auto">{shown.length} of {logs.length} events</span>
          </div>
          <div className="overflow-x-auto -mx-1">
            <table className="w-full text-left min-w-[720px]">
              <thead>
                <tr className="text-[11px] uppercase tracking-wide text-slate-400">
                  <th className="font-semibold px-1 pb-2">Timestamp</th><th className="font-semibold px-1 pb-2">Actor</th>
                  <th className="font-semibold px-1 pb-2">Event</th><th className="font-semibold px-1 pb-2">Details</th><th className="font-semibold px-1 pb-2">Scope</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {shown.map((l) => (
                  <tr key={l.id} className={`align-top text-xs ${l.fresh ? "pop bg-indigo-50/40" : ""}`}>
                    <td className="px-1 py-2.5 text-slate-500 whitespace-nowrap font-mono text-[11px]">{l.ts}</td>
                    <td className="px-1 py-2.5">
                      <div className="flex items-center gap-2 whitespace-nowrap">
                        <Avatar name={l.actor} />
                        <span className="font-semibold text-slate-800">{l.actor}</span>
                        <span className={`text-[10px] font-bold border rounded-full px-1.5 py-0.5 ${l.role === "SYSTEM" ? "bg-slate-100 text-slate-600 border-slate-200" : ROLE_CLS[l.role]}`}>{l.role}</span>
                      </div>
                    </td>
                    <td className="px-1 py-2.5"><span className={`text-[10px] font-bold border rounded px-1.5 py-0.5 whitespace-nowrap font-mono ${EVENT[l.action].cls}`}>{l.action}</span></td>
                    <td className="px-1 py-2.5 text-slate-600 min-w-[220px]">{l.details}</td>
                    <td className="px-1 py-2.5"><span className="text-[10px] font-semibold text-slate-500 border border-slate-200 rounded px-1.5 py-0.5 whitespace-nowrap">{EVENT[l.action].scope}</span></td>
                  </tr>
                ))}
                {!shown.length && <tr><td colSpan={5} className="py-8 text-center text-xs text-slate-400">No events match your filters.</td></tr>}
              </tbody>
            </table>
          </div>
        </Card>
      </div>

      {modal?.type === "invite" && (
        <Modal title="Invite Member" onClose={close}>
          <input autoFocus className={input} placeholder="Username or email" value={inv.who} onChange={(e) => setInv({ ...inv, who: e.target.value })} onKeyDown={(e) => e.key === "Enter" && invite()} />
          <select className={input} value={inv.role} onChange={(e) => setInv({ ...inv, role: e.target.value })}><option>COLLABORATOR</option><option>VIEWER</option></select>
          <div className="flex justify-end gap-2"><button className={ghost} onClick={close}>Cancel</button><button className={primary} disabled={!inv.who.trim()} onClick={invite}>Send Invite</button></div>
        </Modal>
      )}
      {modal?.type === "kick" && (
        <Modal title={modal.demote ? "Change role to VIEWER?" : "Remove member?"} onClose={close}>
          <p className="text-sm text-slate-600">Warning: {modal.m.name} is currently assigned to {modal.m.nodes} active tasks. {modal.demote ? "Changing this role" : "Removing this member"} will unassign these tasks and revert any in-progress work back to To Do.</p>
          <div className="flex justify-end gap-2"><button className={ghost} onClick={close}>Cancel</button><button className={danger} onClick={() => (modal.demote ? demote(modal.m) : remove(modal.m))}>{modal.demote ? "Confirm Change" : "Confirm Removal"}</button></div>
        </Modal>
      )}
      {modal?.type === "cycle" && (
        <Modal title="Cycle Detected! (400)" onClose={close}>
          <p className="text-sm text-slate-600">Cannot publish. Violating nodes: <code className="text-xs bg-red-50 text-red-700 px-1.5 py-0.5 rounded">WPE-009 → WPE-014 → WPE-009</code></p>
          <div className="flex justify-end"><button className={primary} onClick={close}>Back to editor</button></div>
        </Modal>
      )}
      {toast && <div className="pop fixed bottom-5 left-1/2 -translate-x-1/2 z-[60] max-w-[90vw] bg-slate-800 text-white text-xs font-medium px-4 py-2 rounded-full shadow-lg">{toast}</div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
