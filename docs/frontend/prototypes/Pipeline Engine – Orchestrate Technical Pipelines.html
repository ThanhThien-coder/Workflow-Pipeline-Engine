<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Pipeline Engine – Orchestrate Technical Pipelines</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  html,body,#root{margin:0;padding:0;width:100%;height:100%;overflow:hidden!important;overscroll-behavior:none;background:#F8FAFC;color:#0f172a;font-family:Inter,Geist,system-ui,-apple-system,sans-serif}
  input,textarea{user-select:text;-webkit-user-select:text}
  .fixed-ambient-bg{position:fixed;inset:0;pointer-events:none;z-index:0;background-color:#f8fafc;background-image:linear-gradient(to right,rgba(203,213,225,.4) 1px,transparent 1px),linear-gradient(to bottom,rgba(203,213,225,.4) 1px,transparent 1px);background-size:32px 32px}
  .hardware-accelerated{transform:translateZ(0);backface-visibility:hidden;perspective:1000px;will-change:transform}
  .is-off .flow,.is-off .pulse2,.is-off .sweep{animation-play-state:paused}
  .flow{stroke-dasharray:5 9;animation:dash 1s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-14}}
  @keyframes pulse2{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}
  .pulse2{animation:pulse2 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(400%)}}
  .sweep{animation:sweep 1.1s ease-out 2}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .pop{animation:pop .2s ease-out}
  .grad-text{background:linear-gradient(90deg,#4f46e5,#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent}
  .btn-grad{background:#4f46e5;box-shadow:0 1px 2px rgba(79,70,229,.25),0 4px 12px -4px rgba(79,70,229,.35);transition:background .15s}.btn-grad:hover{background:#4338ca}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const ST = ["LOCKED", "TODO", "IN_PROGRESS", "REVIEW", "DONE"];
const STC = { LOCKED: "#94a3b8", TODO: "#0ea5e9", IN_PROGRESS: "#2563eb", REVIEW: "#7c3aed", DONE: "#059669" };

const Logo = () => (
  <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
    <rect x="1" y="1" width="24" height="24" rx="7" fill="#eef2ff" stroke="#6366f1"/>
    <circle cx="7" cy="8" r="2.2" fill="#a78bfa"/><circle cx="7" cy="18" r="2.2" fill="#38bdf8"/><circle cx="19" cy="13" r="2.2" fill="#34d399"/>
    <path d="M9 8c5 0 4 5 8 5M9 18c5 0 4-5 8-5" stroke="#818cf8" strokeWidth="1.4"/>
  </svg>
);
const Eyebrow = ({ children }) => <div className="text-[11px] font-bold uppercase tracking-widest text-indigo-600 mb-2">{children}</div>;
/* ---------- Hero DAG ---------- */
const HN = [
  { id: "Spec", x: 70, y: 130, o: 0 }, { id: "Design", x: 230, y: 50, o: 2 }, { id: "API", x: 230, y: 210, o: 2 },
  { id: "Build", x: 400, y: 130, o: 4 }, { id: "Ship", x: 550, y: 130, o: 6 },
];
const HE = [[0, 1], [0, 2], [1, 3], [2, 3], [3, 4]];
function HeroDag() {
  const [t, setT] = useState(0);
  useEffect(() => { const i = setInterval(() => setT((v) => (v + 1) % 13), 1100); return () => clearInterval(i); }, []);
  const st = (n) => ST[Math.max(0, Math.min(4, t - n.o))];
  return (
    <svg viewBox="0 0 620 260" className="w-full">
      {HE.map(([a, b], i) => {
        const A = HN[a], B = HN[b], mx = (A.x + B.x) / 2;
        const d = `M${A.x + 38} ${A.y} C${mx} ${A.y} ${mx} ${B.y} ${B.x - 38} ${B.y}`;
        return <g key={i}><path d={d} fill="none" stroke="#cbd5e1" strokeWidth="1.6" /><path d={d} fill="none" stroke="#6366f1" strokeWidth="2" strokeLinecap="round" className="flow" style={{ opacity: st(A) === "DONE" ? 1 : 0.35 }} /></g>;
      })}
      {HN.map((n) => {
        const s = st(n), c = STC[s];
        return (
          <g key={n.id}>
            <rect x={n.x - 38} y={n.y - 20} width="76" height="40" rx="10" fill="#ffffff" stroke="#e2e8f0" strokeWidth="1.5" />
            <text x={n.x} y={n.y - 2} textAnchor="middle" fontSize="11" fontWeight="700" fill="#0f172a">{n.id}</text>
            <text x={n.x} y={n.y + 12} textAnchor="middle" fontSize="7.5" fontWeight="700" fill={c}>{s}</text>
            {s === "IN_PROGRESS" && <circle cx={n.x + 38} cy={n.y - 20} r="4" fill={c} className="pulse2" />}
          </g>
        );
      })}
    </svg>
  );
}

/* ---------- Kahn simulator ---------- */
function KahnSim() {
  const [cyc, setCyc] = useState(false);
  const [toast, setToast] = useState(false);
  const N = [60, 190, 320];
  return (
    <div>
      <div className="flex gap-2 mb-3">
        <button onClick={() => setCyc(false)} className={`text-xs font-semibold px-3 py-1.5 rounded-lg border ${!cyc ? "border-emerald-300 text-emerald-700 bg-emerald-50" : "border-slate-200 text-slate-600"}`}>Valid Workflow</button>
        <button onClick={() => { setCyc(true); setToast(true); setTimeout(() => setToast(false), 3200); }} className={`text-xs font-semibold px-3 py-1.5 rounded-lg border ${cyc ? "border-rose-300 text-rose-700 bg-rose-50" : "border-slate-200 text-slate-600"}`}>Inject Dependency Cycle</button>
      </div>
      {toast && ReactDOM.createPortal(<div className="pop fixed top-20 right-5 z-[70] text-xs font-semibold text-rose-700 bg-rose-50 border border-rose-200 rounded-xl px-4 py-2.5 shadow-md">400 Bad Request: Cycle Detected</div>, document.body)}
      <div className="relative overflow-hidden rounded-xl bg-slate-50 border border-slate-200/90">
        <svg viewBox="0 0 380 150" className="w-full">
          {[0, 1].map((i) => <path key={i} d={`M${N[i] + 28} 55 L${N[i + 1] - 28} 55`} stroke={cyc ? "#f43f5e" : "#059669"} strokeWidth="2" className="flow" />)}
          {cyc && <path d={`M${N[2]} 78 C${N[2]} 140 ${N[0]} 140 ${N[0]} 78`} fill="none" stroke="#e11d48" strokeWidth="2" className="flow" />}
          {N.map((x, i) => (
            <g key={i}>
              <rect x={x - 28} y="32" width="56" height="46" rx="10" fill="#ffffff" stroke={cyc ? "#f43f5e" : "#059669"} />
              <text x={x} y="52" textAnchor="middle" fontSize="10" fontWeight="700" fill="#0f172a">Node-0{i + 1}</text>
              <text x={x} y="66" textAnchor="middle" fontSize="7.5" fill="#94a3b8">P{i + 1}</text>
            </g>
          ))}
        </svg>
        {cyc && <div key="sw" className="sweep absolute inset-y-0 left-0 w-1/4 bg-gradient-to-r from-transparent via-rose-400/30 to-transparent pointer-events-none" />}
      </div>
      <div className={`mt-3 text-xs font-mono rounded-lg px-3 py-2 border ${cyc ? "border-rose-200 bg-rose-50 text-rose-700 pop" : "border-emerald-200 bg-emerald-50 text-emerald-700"}`}>
        {cyc ? "400 Bad Request: Cycle detected via Kahn's Algorithm [Node-03 -> Node-01]" : "200 OK: 3/3 nodes visited. Graph is acyclic."}
      </div>
    </div>
  );
}

/* ---------- Review gate ---------- */
function ReviewGate() {
  const [s, setS] = useState("IN_PROGRESS");
  const [open, setOpen] = useState(false);
  const [url, setUrl] = useState("");
  const [err, setErr] = useState("");
  const [link, setLink] = useState("");
  const send = () => {
    if (!/^https:\/\/[^\s.]+\.[^\s]+/.test(url.trim())) return setErr("Enter a valid https:// URL (PR, Figma, API Docs, Zip).");
    setLink(url.trim()); setS("REVIEW"); setOpen(false); setErr("");
  };
  const c = STC[s];
  return (
    <div className="rounded-xl border bg-slate-50 p-4 space-y-3" style={{ borderColor: c + "66" }}>
      <div className="flex items-center justify-between">
        <span className="font-mono text-[11px] text-slate-400">WPE-018</span>
        <span className="text-[10px] font-bold rounded-full px-2 py-0.5 border" style={{ color: c, borderColor: c + "66" }}>{s}</span>
      </div>
      <div className="font-semibold text-slate-900 text-sm">Implement JWT refresh-token rotation</div>
      {link && <div className="text-xs text-purple-700 font-mono truncate pop">🔗 {link}</div>}
      <div className="flex flex-wrap items-center gap-2">
        {s === "IN_PROGRESS" && <button onClick={() => setOpen(true)} className="btn-grad text-xs font-semibold text-white rounded-lg px-3 py-1.5">Submit for Review</button>}
        {s === "REVIEW" && <>
          <span className="text-[11px] font-semibold text-amber-700 border border-amber-200 bg-amber-50 rounded-full px-2 py-0.5">Owner Approval Required</span>
          <button onClick={() => setS("DONE")} className="text-xs font-semibold text-emerald-700 border border-emerald-200 rounded-lg px-3 py-1.5">Approve as Owner</button>
        </>}
        {s === "DONE" && <span className="text-xs text-emerald-700 font-semibold">✓ Accepted by Owner</span>}
        {s !== "IN_PROGRESS" && <button onClick={() => { setS("IN_PROGRESS"); setLink(""); setUrl(""); }} className="text-xs text-slate-400 hover:text-slate-700 ml-auto">Reset</button>}
      </div>
      {open && (
        <div className="pop rounded-lg border border-slate-200 bg-white p-3 space-y-2">
          <div className="text-xs font-semibold text-slate-700">Attach evidence URL</div>
          <input autoFocus value={url} onChange={(e) => setUrl(e.target.value)} onKeyDown={(e) => e.key === "Enter" && send()} placeholder="https://github.com/acme/repo/pull/142" className="w-full text-xs rounded-md bg-white border border-slate-200 px-2.5 py-1.5 outline-none focus:border-indigo-500" />
          {err && <div className="text-[11px] text-rose-600">{err}</div>}
          <div className="flex gap-2 justify-end">
            <button onClick={() => { setOpen(false); setErr(""); }} className="text-xs text-slate-600 px-2">Cancel</button>
            <button onClick={send} className="btn-grad text-xs font-semibold text-white rounded-md px-3 py-1">Submit</button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------- Mini Kanban pagination ---------- */
const CARDS = [["WPE-021", "Provision staging database", "IN_PROGRESS"], ["WPE-024", "Write migration for audit table", "TODO"], ["WPE-027", "Review OAuth scopes", "TODO"], ["WPE-031", "Load-test state engine", "TODO"]];
function MiniKanban() {
  const [p, setP] = useState(0);
  const H = 64, G = 10, STEP = 2 * (H + G);
  return (
    <div>
      <div className="flex items-center justify-between mb-3">
        <div className="text-xs font-bold text-slate-700">My Tasks · <span className="text-slate-400">{p + 1}/2</span></div>
        <div className="flex gap-1.5">
          <button aria-label="Up" disabled={p === 0} onClick={() => setP(0)} className="w-7 h-7 rounded-md border border-slate-200 text-slate-700 disabled:opacity-30">▲</button>
          <button aria-label="Down" disabled={p === 1} onClick={() => setP(1)} className="w-7 h-7 rounded-md border border-slate-200 text-slate-700 disabled:opacity-30">▼</button>
        </div>
      </div>
      <div className="overflow-hidden" style={{ height: 2 * H + G }}>
        <div className="flex flex-col" style={{ gap: G }}>
          {CARDS.map(([id, t, s], i) => (
            <div key={id} className="rounded-xl border border-slate-200/90 bg-white shadow-sm px-3 flex flex-col justify-center" style={{ height: H, transform: `translate3d(0,-${p * STEP}px,0)`, transition: `transform 300ms cubic-bezier(.25,1,.5,1) ${i * 50}ms, opacity 300ms ${i * 50}ms`, opacity: Math.floor(i / 2) === p ? 1 : 0.4 }}>
              <div className="flex justify-between"><span className="font-mono text-[10px] text-slate-400">{id}</span><span className="text-[9px] font-bold" style={{ color: STC[s] }}>{s}</span></div>
              <div className="text-xs font-semibold text-slate-100 truncate">{t}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ---------- AI Telemetry (rendered directly) ---------- */
function AiCard() {
  const ax = [[100, 20], [176, 75], [147, 165], [53, 165], [24, 75]];
  const labels = [["Critical Path", 100, 11, "middle"], ["Bottleneck", 184, 72, "start"], ["Capacity", 150, 181, "middle"], ["Velocity", 50, 181, "middle"], ["SLA", 16, 72, "end"]];
  const val = [0.92, 0.55, 0.85, 0.45, 0.7];
  const pt = (k, i) => `${100 + (ax[i][0] - 100) * k},${95 + (ax[i][1] - 95) * k}`;
  const pts = val.map((v, i) => pt(v, i)).join(" ");
  return (
    <div className="py-1">
      <div className="inline-flex items-center gap-1.5 text-[11px] font-semibold text-slate-700 bg-slate-50 border border-slate-200 rounded-full px-3 py-1 mb-3">
        <span className="w-2 h-2 rounded-full bg-emerald-500 pulse2" />Live Telemetry Active · Monitored via Gemini Engine
      </div>
      <div className="grid md:grid-cols-2 gap-8 items-center">
        <div className="flex flex-col items-center">
          <svg viewBox="-30 0 260 192" className="w-full max-w-[250px]" style={{ maxHeight: "26vh" }}>
            {[1, 0.66, 0.33].map((k) => <polygon key={k} points={ax.map((_, i) => pt(k, i)).join(" ")} fill="none" stroke="#e2e8f0" strokeWidth="1.2" />)}
            {ax.map(([x, y], i) => <line key={i} x1="100" y1="95" x2={x} y2={y} stroke="#eef2f7" strokeWidth="1" />)}
            <polygon points={pts} fill="rgba(99,102,241,0.18)" stroke="#6366f1" strokeWidth="1.8" />
            {labels.map(([t, x, y, a]) => <text key={t} x={x} y={y} textAnchor={a} fontSize="8.5" fontWeight="600" fill="#64748b">{t}</text>)}
            <circle cx="100" cy={95 - 75 * 0.92} r="5" fill="#f43f5e" className="pulse2" />
          </svg>
          <span className="text-[10px] font-mono text-slate-400 mt-1 uppercase tracking-wider">Topology Risk Factor</span>
        </div>
        <div className="space-y-3">
          <div className="text-xs text-rose-700 border border-rose-200 bg-rose-50/80 rounded-xl p-3 leading-relaxed">
            <span className="font-bold block mb-0.5 text-rose-800">🔴 Critical Path Alert</span>
            Auth Token Service is delaying Phase 2B by 3.2 days.
          </div>
          <div className="text-xs text-emerald-700 border border-emerald-200 bg-emerald-50/80 rounded-xl p-3 leading-relaxed">
            <span className="font-bold block mb-0.5 text-emerald-800">🟢 AI Recommendation</span>
            Assign secondary backend engineer to unblock.
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------- Auth modal ---------- */
function AuthModal({ mode, setMode, onClose }) {
  const [done, setDone] = useState(false);
  return (
    <div className="fixed inset-0 z-[60] bg-slate-900/30 backdrop-blur-sm grid place-items-center p-4" onClick={onClose}>
      <div className="pop w-full max-w-sm rounded-2xl border border-slate-200/90 bg-white p-6 space-y-4" onClick={(e) => e.stopPropagation()}>
        <div className="flex gap-1 p-1 rounded-lg bg-white border border-slate-200/90">
          {["login", "signup"].map((m) => <button key={m} onClick={() => { setMode(m); setDone(false); }} className={`flex-1 text-xs font-semibold py-1.5 rounded-md ${mode === m ? "bg-slate-100 text-slate-900" : "text-slate-400"}`}>{m === "login" ? "Log In" : "Sign Up"}</button>)}
        </div>
        {done ? <div className="text-sm text-emerald-700 text-center py-6 pop">✓ {mode === "login" ? "Welcome back (demo)." : "Account created (demo)."}</div> : (
          <>
            {mode === "signup" && <input className="w-full text-sm rounded-lg bg-white border border-slate-200 px-3 py-2 outline-none focus:border-indigo-500" placeholder="Username" />}
            <input className="w-full text-sm rounded-lg bg-white border border-slate-200 px-3 py-2 outline-none focus:border-indigo-500" placeholder="Email" type="email" />
            <input className="w-full text-sm rounded-lg bg-white border border-slate-200 px-3 py-2 outline-none focus:border-indigo-500" placeholder="Password" type="password" />
            <button onClick={() => { setDone(true); setTimeout(onClose, 1200); }} className="btn-grad w-full text-sm font-semibold text-white rounded-lg py-2">{mode === "login" ? "Log In" : "Create Account"}</button>
          </>
        )}
      </div>
    </div>
  );
}

const SECTIONS = ["01. Overview", "02. Kahn Engine", "03. Quality Gates", "04. Diagnostics", "05. Get Started"];
const TOTAL = SECTIONS.length;
const SEC = "h-screen w-full shrink-0 relative overflow-hidden";
const WRAP = "absolute inset-0 flex flex-col justify-center items-center px-6 md:px-12 pt-16 pb-6";
const Card = ({ children, className = "" }) => <div className={`w-full rounded-2xl border border-slate-200/90 ring-1 ring-slate-900/[0.03] bg-white/95 shadow-sm hover:shadow-[0_20px_45px_-10px_rgba(99,102,241,0.08)] hover:border-indigo-200/80 transition-all duration-300 p-5 ${className}`}>{children}</div>;
const Copy = ({ eyebrow, title, desc, children }) => (
  <div className="max-w-md">
    <Eyebrow>{eyebrow}</Eyebrow>
    <h2 className="text-[clamp(1.5rem,4.2vh,2.25rem)] font-extrabold tracking-tight text-slate-900 leading-tight">{title}</h2>
    <p className="mt-3 text-slate-600 leading-relaxed text-sm">{desc}</p>
    {children}
  </div>
);

function App() {
  const [cur, setCur] = useState(0);
  const [auth, setAuth] = useState(null);
  const curRef = useRef(0), lockRef = useRef(false), authRef = useRef(null);
  authRef.current = auth;

  const go = (index) => {
    if (index < 0 || index >= TOTAL || index === curRef.current || lockRef.current) return;
    lockRef.current = true;
    curRef.current = index;
    setCur(index);
    // Cooldown 600ms (transition is 550ms) to swallow wheel/trackpad inertia
    setTimeout(() => { lockRef.current = false; }, 600);
  };

  useEffect(() => {
    const onWheel = (e) => {
      e.preventDefault();
      if (authRef.current || lockRef.current) return;
      if (Math.abs(e.deltaY) > 25) go(curRef.current + (e.deltaY > 0 ? 1 : -1));
    };
    const onKey = (e) => {
      if (authRef.current || lockRef.current || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
      if (["ArrowDown", "PageDown", " "].includes(e.key)) { e.preventDefault(); go(curRef.current + 1); }
      else if (["ArrowUp", "PageUp"].includes(e.key)) { e.preventDefault(); go(curRef.current - 1); }
    };
    let touchStartY = 0;
    const onTouchStart = (e) => { touchStartY = e.touches[0].clientY; };
    const onTouchEnd = (e) => {
      if (authRef.current || lockRef.current) return;
      const dy = touchStartY - e.changedTouches[0].clientY;
      if (Math.abs(dy) > 40) go(curRef.current + (dy > 0 ? 1 : -1));
    };
    window.addEventListener("wheel", onWheel, { passive: false });
    window.addEventListener("keydown", onKey);
    window.addEventListener("touchstart", onTouchStart, { passive: true });
    window.addEventListener("touchend", onTouchEnd, { passive: true });
    return () => {
      window.removeEventListener("wheel", onWheel);
      window.removeEventListener("keydown", onKey);
      window.removeEventListener("touchstart", onTouchStart);
      window.removeEventListener("touchend", onTouchEnd);
    };
  }, []);

  const links = [["DAG Engine", 1], ["Features", 2], ["Metrics", 3], ["Docs", 4]];
  const metrics = [["0%", "Circular Dependencies"], ["100%", "Artifact Verified"], ["3 Roles", "Strict RBAC"], ["< 150ms", "State Evaluation"]];

  return (
    <div className="h-screen overflow-hidden relative">
      <div className="fixed-ambient-bg" aria-hidden="true">
        <div className="absolute -top-40 -left-40 w-[600px] h-[600px] rounded-full" style={{ background: "radial-gradient(circle, rgba(99,102,241,0.10) 0%, transparent 70%)" }} />
        <div className="absolute -bottom-40 -right-40 w-[550px] h-[550px] rounded-full" style={{ background: "radial-gradient(circle, rgba(14,165,233,0.09) 0%, transparent 70%)" }} />
        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[700px] h-[700px] rounded-full" style={{ background: "radial-gradient(circle, rgba(168,85,247,0.04) 0%, transparent 70%)" }} />
      </div>
      <nav className="fixed top-0 inset-x-0 z-50 bg-white/95 border-b border-slate-200/80 px-8 py-3.5 flex items-center justify-between" style={{ paddingTop: "calc(.875rem + env(safe-area-inset-top,0px))" }}>
        <button onClick={() => go(0)} className="flex items-center gap-2.5"><Logo /><span className="font-bold text-slate-900 text-lg">Pipeline Engine</span></button>
        <div className="hidden md:flex gap-7 text-sm font-medium text-slate-600">{links.map(([l, i]) => <button key={l} onClick={() => go(i)} className="hover:text-slate-900">{l}</button>)}</div>
        <div className="flex items-center gap-2">
          <button onClick={() => setAuth("login")} className="text-sm font-semibold text-slate-700 hover:bg-slate-100 rounded-xl px-4 py-2">Log In</button>
          <button onClick={() => setAuth("signup")} className="btn-grad text-sm font-semibold text-white rounded-xl px-4 py-2">Sign Up</button>
        </div>
      </nav>

      <div className="fixed right-6 top-1/2 -translate-y-1/2 z-40 flex flex-col gap-3 items-center">
        {SECTIONS.map((n, i) => (
          <button key={n} aria-label={n} onClick={() => go(i)} className="group relative flex justify-center">
            <span className={`block w-2.5 rounded-full transition-all duration-300 ${i === cur ? "h-6 bg-indigo-600" : "h-2.5 bg-slate-300 group-hover:bg-slate-400"}`} />
            <span className="pointer-events-none absolute right-full mr-3 top-1/2 -translate-y-1/2 whitespace-nowrap text-[11px] font-semibold text-slate-700 bg-white border border-slate-200 rounded-md px-2 py-1 shadow-sm opacity-0 group-hover:opacity-100 transition-opacity">{n}</span>
          </button>
        ))}
      </div>

      <main className="relative z-10 w-full h-full hardware-accelerated" style={{ transform: `translate3d(0, -${cur * 100}vh, 0)`, transition: "transform 550ms cubic-bezier(0.22, 1, 0.36, 1)" }}>
        {/* 1 HERO */}
        <section className={SEC}><div className={`${WRAP} ${cur === 0 ? "" : "is-off"}`}>
          <div className="absolute inset-x-0 top-0 h-[60vh] bg-[radial-gradient(ellipse_at_top,rgba(99,102,241,.14),transparent_65%)] pointer-events-none" />
          <div className="relative max-w-4xl text-center">
            <div className="inline-flex items-center text-xs font-semibold text-indigo-700 border border-indigo-200/60 bg-indigo-50 rounded-full px-3 py-1">✨ V2.0 Engine Live · Mathematical DAG Execution &amp; Zero State Bypass</div>
            <h1 className="mt-[2.2vh] text-[clamp(1.9rem,6.2vh,3.9rem)] font-extrabold tracking-tight text-slate-900 leading-[1.05]">Orchestrate Technical Pipelines<br /><span className="grad-text">with Mathematical Rigor.</span></h1>
            <p className="mt-[2vh] max-w-2xl mx-auto text-slate-600 leading-relaxed text-[clamp(.8rem,2.2vh,1.05rem)]">Replace chaotic task boards with an immutable Directed Acyclic Graph engine. Enforce strict review constraints, automated Kahn cycle detection, and AI-driven critical path diagnostics.</p>
            <div className="mt-[2.4vh] flex flex-wrap justify-center gap-3">
              <button onClick={() => go(1)} className="btn-grad text-sm font-semibold text-white rounded-xl px-5 py-2.5">Launch Live Sandbox ➔</button>
              <button onClick={() => go(4)} className="text-sm font-semibold text-slate-700 bg-white border border-slate-200 hover:bg-slate-50 rounded-xl px-5 py-2.5">📄 View Architecture Spec</button>
            </div>
            <div className="mt-[3vh] max-w-2xl mx-auto rounded-2xl border border-slate-200/90 bg-white shadow-xl p-3 relative overflow-hidden" style={{ backgroundImage: "radial-gradient(#CBD5E1 1px, transparent 1px)", backgroundSize: "18px 18px" }}>
              <div className="flex items-center justify-between text-[11px] text-slate-400 px-1"><span className="font-mono">pipeline/release-v2.dag</span><span className="flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full bg-emerald-500 pulse2" />engine running</span></div>
              <div style={{ maxHeight: "30vh" }} className="flex justify-center"><div className="w-full" style={{ maxWidth: "min(100%, 62vh)" }}><HeroDag /></div></div>
            </div>
          </div>
        </div></section>

        {/* 2 KAHN */}
        <section className={SEC}><div className={`${WRAP} ${cur === 1 ? "" : "is-off"}`}>
          <div className="max-w-5xl w-full grid lg:grid-cols-2 gap-10 items-center">
            <Copy eyebrow="DAG Engine" title="Algorithmic Dependency Governance" desc="A DAG removes workflow deadlocks entirely. Every structural change is audited in real time by Kahn's algorithm, blocking infinite dependency cycles before a pipeline is ever published.">
              <ol className="mt-4 space-y-2 text-xs text-slate-600 list-decimal list-inside">
                <li>Count each node's incoming edges (in-degree).</li>
                <li>Queue every node with in-degree 0, then peel them off one by one.</li>
                <li>If visited nodes equal total nodes, the graph is acyclic. Otherwise the remaining nodes form a cycle.</li>
              </ol>
            </Copy>
            <Card><KahnSim /></Card>
          </div>
        </div></section>

        {/* 3 GATES */}
        <section className={SEC}><div className={`${WRAP} ${cur === 2 ? "" : "is-off"}`}>
          <div className="max-w-5xl w-full">
            <div className="text-center mb-[3vh]">
              <Eyebrow>Execution &amp; Governance</Eyebrow>
              <h2 className="text-[clamp(1.5rem,4.2vh,2.25rem)] font-extrabold tracking-tight text-slate-900">Zero-Bypass Quality Gateways</h2>
              <p className="mt-2 text-sm text-slate-600 max-w-xl mx-auto">Evidence is mandatory before review, and only the Owner can accept work. Tasks are pushed straight to each engineer's focused board.</p>
            </div>
            <div className="mb-3 flex justify-center">
              <div className="inline-flex flex-wrap items-center justify-center gap-x-2 gap-y-1 rounded-full border border-slate-200 bg-white/90 px-3.5 py-1 text-[11px] font-mono font-semibold text-slate-600 shadow-sm">
                <span>Pipeline Execution Mode</span><span className="text-slate-300">·</span>
                <span className="inline-flex items-center gap-1.5 text-emerald-700"><span className="w-1.5 h-1.5 rounded-full bg-emerald-500 pulse2" />Strict Gate Active</span><span className="text-slate-300">·</span>
                <span className="text-indigo-700">SHA-256 Verified</span>
              </div>
            </div>
            <div className="grid lg:grid-cols-2 gap-6 items-start">
              <Card><div className="text-xs font-extrabold text-slate-900 uppercase tracking-wide mb-3">Submit artifact · Owner approval</div><ReviewGate /></Card>
              <Card><MiniKanban /></Card>
            </div>
          </div>
        </div></section>

        {/* 4 AI + METRICS */}
        <section className={SEC}><div className={`${WRAP} ${cur === 3 ? "" : "is-off"}`}>
          <div className="max-w-4xl w-full space-y-[3vh]">
            <div className="text-center">
              <Eyebrow>AI Telemetry</Eyebrow>
              <h2 className="text-[clamp(1.5rem,4.2vh,2.25rem)] font-extrabold tracking-tight text-slate-900">Predictive Bottleneck Diagnostics</h2>
              <p className="mt-2 text-sm text-slate-600 max-w-xl mx-auto">A background AI engine analyzes the critical path, scans overdue nodes, and recommends resource allocation before the schedule slips.</p>
            </div>
            <Card><AiCard /></Card>
            <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
              {metrics.map(([v, l]) => (
                <div key={l} className="rounded-2xl border border-slate-200/90 ring-1 ring-slate-900/[0.03] bg-white/95 shadow-sm hover:shadow-[0_20px_45px_-10px_rgba(99,102,241,0.08)] hover:border-indigo-200/80 transition-all duration-300 p-4">
                  <div className="text-2xl font-extrabold grad-text">{v}</div>
                  <div className="mt-0.5 text-xs font-semibold text-slate-800">{l}</div>
                </div>
              ))}
            </div>
          </div>
        </div></section>

        {/* 5 CTA */}
        <section className={SEC}><div className={`${WRAP} ${cur === 4 ? "" : "is-off"}`}>
          <div className="relative max-w-3xl w-full overflow-hidden rounded-3xl border border-indigo-100 bg-gradient-to-br from-indigo-50 via-white to-sky-50 px-6 py-[7vh] text-center shadow-sm">
            <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_top,rgba(99,102,241,.12),transparent_60%),radial-gradient(ellipse_at_bottom_right,rgba(14,165,233,.12),transparent_55%)] pointer-events-none" />
            <h2 className="relative text-[clamp(1.6rem,5vh,2.6rem)] font-extrabold tracking-tight text-slate-900">Ready to elevate your engineering delivery?</h2>
            <div className="relative mt-6 flex flex-wrap justify-center gap-3">
              <button onClick={() => setAuth("signup")} className="btn-grad text-sm font-semibold text-white rounded-xl px-5 py-2.5">Launch Live Sandbox</button>
              <button onClick={() => setAuth("login")} className="text-sm font-semibold text-slate-700 bg-white border border-slate-200 hover:bg-slate-50 rounded-xl px-5 py-2.5">Book Enterprise Demo</button>
            </div>
          </div>
          <div className="absolute bottom-0 inset-x-0 bg-white border-t border-slate-200 px-8 py-4 flex flex-wrap items-center justify-between gap-2 text-xs text-slate-500">
            <span className="flex items-center gap-2"><Logo />© 2026 Pipeline Engine. Strict, graph-based orchestration for engineering teams.</span>
            <span>🟢 All Systems Operational · V2.4 Active</span>
          </div>
        </div></section>
      </main>
      {auth && <AuthModal mode={auth} setMode={setAuth} onClose={() => setAuth(null)} />}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
