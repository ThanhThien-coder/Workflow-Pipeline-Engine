/* ---------- Ghost Node (proxy tới task của Phase khác) ---------- */
const isLaneGhost=n=>n.kind==='ghost'&&n.parentIds[0]==='root'; // Ghost tiền đề → ghim vào Ghost Lane
function ghostNode(id,parentIds,refPhase,refId,dir){ return {id,kind:'ghost',parentIds,refPhase,refId,dir,title:'',joinPolicy:null}; }

function ghostInfo(trees,g){ // trạng thái LIVE từ Phase gốc
  const src=trees[g.refPhase]&&trees[g.refPhase].nodes[g.refId];
  return {title:src?src.title:'(Task gốc đã bị xóa)',status:src?src.status:'LOCKED',pct:src?pctOf(src):null,phase:PHASE_LABEL[g.refPhase]||g.refPhase,missing:!src};
}
// AND/OR-join với Ghost cha: chưa thỏa → task TODO/IN_PROGRESS tự LOCKED; thỏa → task bị khóa-do-ghost tự mở về TODO.
function applyGhostGates(trees){
  let out=trees;
  Object.keys(trees).forEach(pid=>{
    const nodes=trees[pid].nodes; let nn=nodes;
    Object.values(nodes).forEach(n=>{
      if(n.kind!=='branch') return;
      const gs=n.parentIds.map(p=>nodes[p]).filter(p=>p&&p.kind==='ghost'); if(!gs.length) return;
      const done=g=>ghostInfo(trees,g).status==='DONE';
      const ok=n.joinPolicy==='OR'?gs.some(done):gs.every(done); let patch=null;
      if(!ok&&(n.status==='TODO'||n.status==='IN_PROGRESS')) patch={status:'LOCKED',lockedByGhost:true,blocker:'Chờ Ghost Node (Phase khác) hoàn tất'};
      else if(ok&&n.status==='LOCKED'&&n.lockedByGhost) patch={status:'TODO',lockedByGhost:false,blocker:'Không có'};
      if(patch){ if(nn===nodes) nn={...nodes}; nn[n.id]={...n,...patch}; }
    });
    if(nn!==nodes){ if(out===trees) out={...trees}; out[pid]={...trees[pid],nodes:nn}; }
  });
  return out;
}

/* ---------- Graph helpers ---------- */
// childrenOf: ANY parent match (used for cycle-check + drag-connect semantics — a merge edge
// still counts as a real dependency even though it doesn't affect this node's tree position).
function childrenOf(nodes,id){ return Object.values(nodes).filter(n=>n.parentIds.includes(id)); }
function isAncestor(nodes,targetId,sourceId){ // path targetId -> ... -> sourceId ?
  const queue=[targetId], seen=new Set([targetId]);
  while(queue.length){ const cur=queue.shift(); if(cur===sourceId) return true;
    for(const c of childrenOf(nodes,cur)){ if(!seen.has(c.id)){ seen.add(c.id); queue.push(c.id); } } }
  return false;
}
// Layout uses a SPANNING TREE: each node's on-screen position/subtree membership is driven only
// by its PRIMARY parent (parentIds[0]). Extra parents (index 1+, added via drag-connect or
// multi-select merge) never affect layout — they only draw an extra converging Bézier edge.
// This is what makes sibling groups push down correctly: a node's vertical footprint is the
// full recursive height of its primary-children, computed bottom-up before anything is placed.
function primaryParentOf(nodes,id){ const n=nodes[id]; return n&&n.parentIds.length?n.parentIds[0]:null; }
function childrenOfPrimary(nodes,id){ return Object.values(nodes).filter(n=>primaryParentOf(nodes,n.id)===id); }
function computeVisible(nodes,collapsed){
  const cache={};
  function vis(id){ if(id in cache) return cache[id];
    if(id==='root'){ cache[id]=true; return true; }
    const p=primaryParentOf(nodes,id);
    const r = p? (vis(p)&&!collapsed.has(p)) : false; cache[id]=r; return r; }
  Object.keys(nodes).forEach(vis); return cache;
}
function deleteNodeCascade(nodes,id){
  let next={...nodes}; const removed=new Set([id]); let changed=true;
  while(changed){ changed=false;
    Object.keys(next).forEach(k=>{ if(removed.has(k)) return;
      const f=next[k].parentIds.filter(p=>!removed.has(p));
      if(f.length!==next[k].parentIds.length) next[k]={...next[k],parentIds:f}; });
    Object.keys(next).forEach(k=>{ if(k!=='root'&&!removed.has(k)&&next[k].parentIds.length===0){ removed.add(k); changed=true; } });
  }
  removed.forEach(r=>delete next[r]); return next;
}

/* ---------- Mindmap: recursive flex tree + Bézier đo từ DOM thật ---------- */
function TreeBranch({id,ctx}){
  const {nodes,collapsed,toggle,selectedId,setSelected,edit,mutate,merge,connect,ghostApi,focus}=ctx;
  const n=nodes[id];
  const allKids=childrenOfPrimary(nodes,id).filter(k=>!isLaneGhost(k));
  const kids=collapsed.has(id)?[]:allKids;

function MindmapTree({nodes,collapsed,toggle,selectedId,setSelected,edit,mutate,merge,connect,ghostApi}){

    const hv=hoverRef.current, H=hv&&R[hv.id]?hv.id:null, T=H&&hv.target&&R[hv.target]?hv.target:null, rel={};
    if(H) rel[H]='self';

        if(H){ if(T){ if(cid===H&&pid===T) mode='up'; else if(pid===H&&cid===T) mode='down'; }
               else if(cid===H) mode='up'; else if(pid===H) mode='down'; }
        if(mode){ const k=mode==='up'?pid:cid; if(!rel[k]) rel[k]=mode; }
        if(!direct&&!mode) return;
        const dx=Math.max((c.l-p.r)*.5,48), d='M'+p.r+' '+p.cy+' C'+(p.r+dx)+' '+p.cy+' '+(c.l-dx)+' '+c.cy+' '+c.l+' '+c.cy;
        if(mode){ const up=mode==='up';
          const path='<path d="'+d+'" fill="none" stroke="'+(up?'#2563eb':'#10b981')+'" stroke-width="2.5" stroke-linecap="round"'+(direct?'':' stroke-dasharray="6 4"')+' style="filter:drop-shadow(0 0 3px '+(up?'rgba(37,99,235,.65)':'rgba(16,185,129,.65)')+')"/>';

      }); });

        h('div',{className:'flex flex-col gap-y-4'},lane.map(g=>h(TreeBranch,{key:g.id,id:g.id,ctx})))),

    h('button',{onClick:onOpen,className:'w-full text-[12px] font-semibold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 rounded-lg px-3 py-2'},'Mở Phase gốc để xem chi tiết ↗'));
}
function GhostPicker({trees,currentPhase,anchor,onConfirm,onClose}){
  const phases=Object.keys(PHASE_LABEL).filter(p=>p!==currentPhase&&trees[p]);
  const tasksOf=p=>Object.values(trees[p].nodes).filter(n=>n.kind==='branch'&&!n.isTrack&&n.title);
  const [ph,setPh]=useState(phases[0]),[task,setTask]=useState((tasksOf(phases[0])[0]||{}).id),[dir,setDir]=useState('up');
  const tOpts=tasksOf(ph).map(n=>({value:n.id,label:n.title+' ('+STATUS_LBL[n.status]+')'}));
  const dirBtn=(v,label)=>h('label',{key:v,className:'flex items-start gap-2 rounded-lg border px-2.5 py-1.5 cursor-pointer text-[11.5px] '+(dir===v?'border-indigo-300 bg-indigo-50/60 text-indigo-700 font-medium':'border-slate-200 text-slate-600 hover:bg-slate-50')},
    h('input',{type:'radio',name:'gdir',checked:dir===v,onChange:()=>setDir(v),className:'mt-0.5 accent-indigo-600'}),h('span',null,label));
  return h('div',{className:'space-y-3'},
    h('div',{className:'flex items-center gap-1.5 text-[12px] font-bold text-slate-800'},h(I,{p:'link2',s:13}),'Thêm Ghost Node (Tham chiếu Phase khác)'),
    h(Field,{label:'1. Phase nguồn'},h(Select,{value:ph,options:phases.map(p=>({value:p,label:PHASE_LABEL[p]})),onChange:v=>{ setPh(v); setTask((tasksOf(v)[0]||{}).id); }})),
    h(Field,{label:'2. Task nguồn'},tOpts.length?h(Select,{value:task,options:tOpts,onChange:setTask}):h('div',{className:'text-[12px] text-slate-400 italic'},'Phase này chưa có task nào.')),
    anchor&&h(Field,{label:'Hướng phụ thuộc'},h('div',{className:'space-y-1.5'},
      dirBtn('up','Phase khác → «'+(anchor.title||'task này')+'» (tiền đề)'),dirBtn('down','«'+(anchor.title||'task này')+'» → Phase khác (kế tiếp)'))),
    h('div',{className:'flex justify-end gap-2 pt-1'},
      h('button',{onClick:onClose,className:'text-[12px] font-medium text-slate-500 hover:bg-slate-100 rounded-lg px-3 py-1.5'},'Hủy'),
      h('button',{disabled:!tOpts.length,onClick:()=>onConfirm({refPhase:ph,refId:task,dir,anchorId:anchor?anchor.id:null}),
        className:'text-[12px] font-semibold text-white bg-indigo-600 hover:bg-indigo-700 disabled:opacity-40 rounded-lg px-3.5 py-1.5'},'3. Xác nhận')));
}

/* ---------- Resizable panel ---------- */
function useResizable(defaultW){
  const [w,setW]=useState(defaultW),[dragging,setDragging]=useState(false); const drag=useRef(false);
  useEffect(()=>{
    const onMove=e=>{ if(!drag.current) return; const min=window.innerWidth*.35,max=window.innerWidth*.8;
      setW(Math.min(max,Math.max(min,window.innerWidth-e.clientX))); };
    const onUp=()=>{ if(drag.current){ drag.current=false; setDragging(false); document.body.style.cursor=''; document.body.style.userSelect=''; } };
    window.addEventListener('mousemove',onMove); window.addEventListener('mouseup',onUp);
    return ()=>{ window.removeEventListener('mousemove',onMove); window.removeEventListener('mouseup',onUp); };
  },[]);
  const onMouseDown=e=>{ drag.current=true; setDragging(true); document.body.style.cursor='col-resize'; document.body.style.userSelect='none'; e.preventDefault(); };
  return {w,dragging,onMouseDown};
}

/* ---------- Connect-drag (drag-to-add-parent) overlay ---------- */
function useConnectDrag(nodes,setNodes){
  const [line,setLine]=useState(null);   // {x1,y1,x2,y2}
  const [err,setErr]=useState(null);     // {x,y,msg}
  const startDrag=(e,sourceId,onClick)=>{
    e.stopPropagation(); e.preventDefault();
    const r=e.currentTarget.getBoundingClientRect(), sx=r.left+r.width/2, sy=r.top+r.height/2;
    const sx0=e.clientX, sy0=e.clientY; let dragged=false;
    const onMove=ev=>{ if(!dragged && Math.hypot(ev.clientX-sx0,ev.clientY-sy0)>6) dragged=true;
      if(dragged) setLine({x1:sx,y1:sy,x2:ev.clientX,y2:ev.clientY}); };
    const onUp=ev=>{
      window.removeEventListener('mousemove',onMove); window.removeEventListener('mouseup',onUp); setLine(null); suppressClickUntil=performance.now()+80;
      if(!dragged){ onClick({x:sx,y:sy}); return; }
      const el=document.elementFromPoint(ev.clientX,ev.clientY);
      const targetEl=el&&el.closest('[data-node-id]'); const targetId=targetEl&&targetEl.getAttribute('data-node-id');
      const flash=msg=>{ setErr({x:ev.clientX,y:ev.clientY,msg}); setTimeout(()=>setErr(null),1600); };
      if(!targetId||targetId===sourceId) return;
      const t=nodes[targetId];
      if(!t||(t.kind!=='branch'&&t.kind!=='ghost')) return;
      if(t.kind==='ghost'&&nodes[sourceId]&&nodes[sourceId].kind==='ghost') return;
      if(t.parentIds.includes(sourceId)){ flash('Liên kết đã tồn tại'); return; }
      if(isAncestor(nodes,targetId,sourceId)){ flash('Không thể nối ngược (tránh chu trình lặp)'); return; }
      setNodes(prev=>({...prev,[targetId]:{...prev[targetId],parentIds:[...prev[targetId].parentIds,sourceId],joinPolicy:prev[targetId].joinPolicy||'AND'}}));
    };
    window.addEventListener('mousemove',onMove); window.addEventListener('mouseup',onUp);
  };
  return {line,err,startDrag};
}
function ConnectOverlay({line,err}){
  return h(React.Fragment,null,
    line&&h('svg',{className:'fixed inset-0 pointer-events-none z-40',width:'100vw',height:'100vh'},
      h('line',{x1:line.x1,y1:line.y1,x2:line.x2,y2:line.y2,stroke:'#3b82f6',strokeWidth:2.5,strokeDasharray:'6 5'}),
      h('circle',{cx:line.x2,cy:line.y2,r:4,fill:'#3b82f6'})),
    err&&h('div',{style:{position:'fixed',left:err.x+10,top:err.y+10},className:'z-50 flex items-center gap-1.5 text-[11px] font-medium text-white bg-rose-500 rounded-lg px-2.5 py-1.5 shadow-lg pointer-events-none'},
      h(I,{p:'alert',s:12}),err.msg));
}

/* ---------- Panel ---------- */
function Panel({phaseId,onClose,panel,onOpenPhase}){
  const [treesState,setTreesState]=useState(TREES);
  const [collapsedByPhase,setCollapsedByPhase]=useState({});
  const [selectedByPhase,setSelectedByPhase]=useState({});
  const [mergeByPhase,setMergeByPhase]=useState({});
  const [editId,setEditId]=useState(null),[editValue,setEditValue]=useState('');
  const newIdsRef=useRef(new Set());

  const tree=phaseId?treesState[phaseId]:null;
  const nodes=tree?tree.nodes:{};
  const collapsed=collapsedByPhase[phaseId]||new Set();
  const toggle=id=>setCollapsedByPhase(o=>{const s=new Set(o[phaseId]||[]); s.has(id)?s.delete(id):s.add(id); return {...o,[phaseId]:s};});
  const selectedId=selectedByPhase[phaseId]||null;
  const setSelected=id=>setSelectedByPhase(o=>({...o,[phaseId]:id}));
  const mergeSel=mergeByPhase[phaseId]||new Set();
  const setMergeSel=fn=>setMergeByPhase(o=>({...o,[phaseId]:fn(o[phaseId]||new Set())}));

  const setNodes=updater=>setTreesState(o=>({...o,[phaseId]:{...o[phaseId],nodes:typeof updater==='function'?updater(o[phaseId].nodes):updater}}));
  const mutate={
    add:node=>setNodes(ns=>({...ns,[node.id]:node})),
    remove:id=>setNodes(ns=>deleteNodeCascade(ns,id))
  };
  const startEdit=(id,val,isNew)=>{ setEditId(id); setEditValue(val); if(isNew) newIdsRef.current.add(id); };
  const commitEdit=()=>{ const val=editValue.trim(); if(!editId) return;
    if(!val){ if(newIdsRef.current.has(editId)) mutate.remove(editId); }
    else setNodes(ns=>({...ns,[editId]:{...ns[editId],title:val}}));
    newIdsRef.current.delete(editId); setEditId(null); setEditValue(''); };
  const cancelEdit=()=>{ if(editId&&newIdsRef.current.has(editId)) mutate.remove(editId); newIdsRef.current.delete(editId); setEditId(null); setEditValue(''); };
  const edit={id:editId,value:editValue,setValue:setEditValue,start:startEdit,commit:commitEdit,cancel:cancelEdit};

  const merge={selection:mergeSel,
    toggle:id=>setMergeSel(s=>{const n=new Set(s); n.has(id)?n.delete(id):n.add(id); return n;}),
    toggleJoin:id=>setNodes(ns=>({...ns,[id]:{...ns[id],joinPolicy:ns[id].joinPolicy==='OR'?'AND':'OR'}}))};

  const connect=useConnectDrag(nodes,setNodes);

  const [pop,setPop]=useState(null);
  useEffect(()=>{ const nx=applyGhostGates(treesState); if(nx!==treesState) setTreesState(nx); },[treesState]);
  const ghostApi={trees:treesState,
    openInfo:(id,r)=>setPop({type:'info',id,x:r.right+8,y:r.top}),
    openChip:(srcId,pos)=>setPop({type:'chip',srcId,x:pos.x+16,y:pos.y+18}),
    openPicker:(anchorId,pos)=>setPop({type:'picker',anchorId,x:pos.x,y:pos.y})};
  const addGhost=({refPhase,refId,dir,anchorId})=>{
    setNodes(ns=>{ const nx={...ns};
      if(anchorId&&dir==='down'){ const g=ghostNode(uid(),[anchorId],refPhase,refId,'down'); nx[g.id]=g; return nx; }
      let g=Object.values(ns).find(x=>x.kind==='ghost'&&x.refPhase===refPhase&&x.refId===refId&&x.dir==='up');
      if(!g){ g=ghostNode(uid(),['root'],refPhase,refId,'up'); nx[g.id]=g; }
      if(anchorId&&!nx[anchorId].parentIds.includes(g.id)&&!isAncestor(nx,anchorId,g.id))
        nx[anchorId]={...nx[anchorId],parentIds:[...nx[anchorId].parentIds,g.id],joinPolicy:nx[anchorId].joinPolicy||'AND'};
      return nx; });
    if(anchorId&&dir==='down'&&collapsed.has(anchorId)) toggle(anchorId);
    setPop(null);
  };
  const renderPop=()=>{
    if(!pop) return null; const close=()=>setPop(null);
    if(pop.type==='info'){ const g=nodes[pop.id]; if(!g) return null;
      return h(Popover,{key:'i'+pop.id,x:pop.x,y:pop.y,w:290,onClose:close},h(GhostInfo,{gi:ghostInfo(treesState,g),onOpen:()=>{ close(); onOpenPhase&&onOpenPhase(g.refPhase); }})); }
    if(pop.type==='chip') return h(Popover,{key:'c'+pop.srcId,x:pop.x,y:pop.y,w:250,onClose:close},
      h('button',{onMouseDown:e=>e.preventDefault(),onClick:()=>{ edit.cancel(); setPop({type:'picker',anchorId:pop.srcId,x:pop.x,y:pop.y}); },
        className:'w-full flex items-center gap-2 text-left text-[12px] font-medium text-indigo-600 hover:bg-indigo-50 rounded-lg px-2 py-1.5'},h(I,{p:'link2',s:13}),'Gắn phụ thuộc từ Phase khác (Ghost Node)'));
    if(pop.type==='picker') return h(Popover,{key:'p',x:pop.x,y:pop.y,w:310,onClose:close},
      h(GhostPicker,{trees:treesState,currentPhase:phaseId,anchor:pop.anchorId?nodes[pop.anchorId]:null,onConfirm:addGhost,onClose:close}));
    return null; };

  const createMergeTask=()=>{
    const parents=[...mergeSel]; if(parents.length<2) return;
    const allDone=parents.every(id=>nodes[id].status==='DONE');
    const child=n_({id:uid(),title:'',status:allDone?'TODO':'LOCKED',parentIds:parents,joinPolicy:'AND',blocker:'Chờ tất cả task nguồn hoàn tất'});
    mutate.add(child); startEdit(child.id,'',true);
    setCollapsedByPhase(o=>{const s=new Set(o[phaseId]||[]); parents.forEach(p=>s.delete(p)); return {...o,[phaseId]:s};});
    setMergeSel(()=>new Set());
  };

  const selectedTaskObj=tree&&selectedId?nodes[selectedId]:null;

  return h('div',{style:{width:phaseId?panel.w+'px':'0px'},
    className:'relative shrink-0 h-full bg-white border-l border-slate-200 shadow-2xl overflow-hidden flex flex-col '+(panel.dragging?'':'transition-all duration-300')},
    h(ConnectOverlay,{line:connect.line,err:connect.err}),
    phaseId&&h('div',{onMouseDown:panel.onMouseDown,
      className:'absolute left-0 top-0 h-full w-[7px] cursor-col-resize z-30 flex items-center justify-center '+
        (panel.dragging?'bg-blue-500':'bg-blue-500/0 hover:bg-blue-500/70 transition-colors')},
      h('div',{className:'w-[3px] h-8 rounded-full bg-slate-300'})),
    tree&&h(React.Fragment,null,
      h('div',{className:'p-5 pl-6 border-b border-slate-200 shrink-0'},
        h('div',{className:'flex items-start justify-between gap-3'},
          h('div',{className:'min-w-0'},h('div',{className:'text-[11px] text-slate-400 truncate'},tree.breadcrumb),
            h('h2',{className:'text-base font-bold text-slate-800 mt-0.5'},tree.title)),
          h('button',{onClick:onClose,className:'shrink-0 grid place-items-center w-9 h-9 rounded-xl text-slate-400 hover:bg-slate-100 hover:text-slate-600'},h(I,{p:'x',s:20}))),
        h('div',{className:'flex items-center gap-2 mt-3'},
          h('div',{className:'flex-1 h-1.5 rounded-full bg-slate-100 overflow-hidden'},h('div',{className:'h-full rounded-full bg-blue-400 transition-all duration-500',style:{width:tree.pct+'%'}})),
          h('span',{className:'text-xs font-semibold text-slate-500 shrink-0'},tree.pct+'%')),
        null),
      h('div',{className:'flex-1 overflow-auto p-6 pl-8'},
        h(MindmapTree,{key:phaseId,nodes,collapsed,toggle,selectedId,setSelected,edit,mutate,merge,connect,ghostApi})),
      mergeSel.size>=2&&h('div',{className:'shrink-0 px-4 py-2.5 bg-amber-50 border-t border-amber-200 flex items-center justify-between gap-3'},
        h('span',{className:'text-[12px] text-amber-700 font-medium'},'Đã chọn '+mergeSel.size+' task'),
        h('button',{onClick:createMergeTask,className:'flex items-center gap-1.5 text-[12px] font-semibold text-white bg-amber-500 hover:bg-amber-600 rounded-lg px-3 py-1.5'},
          h(I,{p:'merge',s:13}),'Tạo Task hội tụ từ '+mergeSel.size+' task đã chọn')),
      selectedTaskObj&&selectedTaskObj.kind==='branch'&&!selectedTaskObj.isTrack&&h(NodeProperties,{key:selectedTaskObj.id,node:selectedTaskObj,onClose:()=>setSelected(null),
        onSave:patch=>{ setNodes(ns=>({...ns,[selectedId]:{...ns[selectedId],...patch}})); setSelected(null); },
        onDelete:()=>{ const id=selectedId; setSelected(null); mutate.remove(id); }}),
      renderPop()));
}

/* ---------- Macro canvas components ---------- */
function PhaseCard({ph,selected,onClick}){
  const acc=ACCENT[ph.accent];
  return h('button',{onClick,style:{position:'absolute',left:ph.x,top:ph.y,width:ph.w,height:ph.h},
    className:'text-left rounded-2xl bg-white border shadow-sm overflow-hidden transition-all duration-200 '+
      (selected?'border-indigo-300 shadow-lg ring-2 ring-indigo-200':'border-slate-200 hover:shadow-md hover:-translate-y-0.5')},
    h('div',{className:'h-[5px] w-full '+acc.bar}),
    h('div',{className:'p-4 h-full flex flex-col'},
      h('div',{className:'flex items-start justify-between gap-2'},
        h('div',null,h('div',{className:'text-[11px] font-bold tracking-widest text-slate-400'},ph.name),
          h('div',{className:'text-sm font-semibold text-slate-800 mt-0.5 leading-snug'},ph.sub)),
        ph.locked?h('span',{className:'text-slate-300 shrink-0'},h(I,{p:'lock',s:18})):
          h('span',{className:'shrink-0 text-[10px] font-semibold text-indigo-500 flex items-center gap-0.5'},'Click to inspect',h(I,{p:'chev',s:11}))),
      h('div',{className:'mt-auto pt-3'},
        h('div',{className:'flex items-center justify-between mb-1.5'},
          h('span',{className:'text-[9px] font-bold uppercase rounded-full px-2 py-0.5 border '+acc.pill},ph.status),
          h('span',{className:'text-xs font-semibold text-slate-500'},ph.pct+'%')),
        h('div',{className:'h-1.5 rounded-full bg-slate-100 overflow-hidden'},
          h('div',{className:'h-full rounded-full transition-all duration-500 '+acc.track,style:{width:ph.pct+'%'}})))));
}
function CanvasEdge({a,b}){
  const x1=a.x+a.w,y1=a.y+a.h/2,x2=b.x,y2=b.y+b.h/2,dx=(x2-x1)*.5;
  return h('path',{d:`M${x1} ${y1} C${x1+dx} ${y1} ${x2-dx} ${y2} ${x2} ${y2}`,fill:'none',stroke:'#94a3b8',strokeWidth:2,strokeDasharray:'5 6'});
}

function App(){
  const [sel,setSel]=useState('p2a');
  const panel=useResizable(Math.round(window.innerWidth*0.5));
  return h('div',{className:'h-screen w-screen flex overflow-hidden'},
    h('div',{style:{width:sel?`calc(100% - ${panel.w}px)`:'100%'},className:(panel.dragging?'':'transition-all duration-300')+' flex flex-col h-full min-w-0'},
      h('div',{className:'flex items-center justify-between px-4 py-2.5 border-b border-slate-200 bg-white shrink-0'},
        h('div',null,h('div',{className:'text-sm font-semibold text-slate-800'},'Workflow Pipeline Engine'),
          h('div',{className:'text-[11px] text-slate-400'},'Macro Pipeline · click a cluster to inspect')),
        h('span',{className:'text-[11px] font-semibold text-slate-500 bg-slate-100 rounded-full px-2.5 py-1'},'4 clusters')),
      h('div',{className:'flex-1 overflow-auto relative canvas'},
        h('div',{className:'relative',style:{width:CW,height:CH,margin:20}},
          h('svg',{className:'absolute inset-0 pointer-events-none',width:CW,height:CH},
            CANVAS_EDGES.map(([a,b])=>h(CanvasEdge,{key:a+b,a:PHASES.find(p=>p.id===a),b:PHASES.find(p=>p.id===b)}))),
          PHASES.map(ph=>h(PhaseCard,{key:ph.id,ph,selected:sel===ph.id,onClick:()=>setSel(sel===ph.id?null:ph.id)}))))),
    h(Panel,{phaseId:sel,onClose:()=>setSel(null),panel,onOpenPhase:setSel}));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
