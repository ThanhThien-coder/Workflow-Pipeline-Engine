<script type="text/babel">
const { useState, useEffect, useLayoutEffect, useRef } = React;

/* ---------- Icons ---------- */

const I = {
  link: "M10 13a5 5 0 007.07 0l3-3a5 5 0 00-7.07-7.07l-1 1M14 11a5 5 0 00-7.07 0l-3 3a5 5 0 007.07 7.07l1-1",
  clock: ["M12 6v6l4 2", "M12 21a9 9 0 100-18 9 9 0 000 18z"],
  doc: ["M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z", "M14 3v6h6M9 14l2 2 4-4"],
  net: ["M12 5m-2 0a2 2 0 104 0 2 2 0 10-4 0", "M5 19m-2 0a2 2 0 104 0 2 2 0 10-4 0", "M19 19m-2 0a2 2 0 104 0 2 2 0 10-4 0", "M11 7l-5 10M13 7l5 10"],

function Sparkle({ className = "w-4 h-4", id = "aiGrad" }) {
  return (
    <svg viewBox="0 0 24 24" className={className} fill="none" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" stroke={`url(#${id})`}>
      <defs>
        <linearGradient id={id} x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
          <stop offset="0" stopColor="#7c3aed" />
          <stop offset="1" stopColor="#0ea5e9" />
        </linearGradient>
      </defs>
      <path d="M12 3l1.9 4.6L18.5 9l-4.6 1.9L12 15.5l-1.9-4.6L5.5 9l4.6-1.4z" />
      <path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z" />

}

/* ---------- Mock data ---------- */
const VELOCITY = { days: ["T2","T3","T4","T5","T6","T7","CN"], vals: [7,9,11,8,10,4,3], peak: 2 };
const PERIOD_LABEL = "Tháng này";
const STATUS = [

const FEEDBACKS = [
  { id: 1, who: "Cô Lan (Giáo viên)", node: "WPE-009 · Thiết kế Schema", text: "Chưa thấy ràng buộc UNIQUE cho cặp parent/child, cần giải trình.", time: "3h trước" },

];
const ACTIVITY = [
  { ini: "SC", color: "bg-indigo-500", text: "vừa nộp PR cho WPE-012", time: "10 phút" },
  { ini: "AK", color: "bg-emerald-500", text: "vừa duyệt schema WPE-009", time: "45 phút" },
  { ini: "ML", color: "bg-rose-500", text: "cảnh báo WPE-014 trễ hạn", time: "2 giờ" },
  { ini: "JD", color: "bg-amber-500", text: "nhận việc WPE-021 (Claim)", time: "5 giờ" },
];
const INSIGHTS = [
  { id: 1, icon: "🔴", kicker: "Cảnh báo Đường găng · Critical Path at risk", tag: "Nguy cơ cao",
    box: "bg-red-50 border-red-200", tagCls: "bg-red-100 text-red-700",
    title: "QA Testing bị chặn bởi 2 upstream nodes.",
    text: "Backend Auth API và Data Schema trễ hạn 2 ngày làm trễ toàn bộ mốc phát hành." },
  { id: 2, icon: "🟡", kicker: "Điểm nghẽn nhân sự · Bottleneck detected", tag: "Tắc nghẽn tải trọng",
    box: "bg-amber-50 border-amber-200", tagCls: "bg-amber-100 text-amber-800",
    title: "Node WPE-014 (Marcus Liu) quá tải 147%.",
    text: "Đang ngâm 8 ngày không có cập nhật sub-task. Đề xuất san sẻ tải." },
  { id: 3, icon: "🟢", kicker: "Khuyến nghị hành động · AI Actionable Advice", tag: "Khuyến nghị ưu tiên",

];

/* ---------- Small components ---------- */
function Ring({ pct, size = 56 }) {
  const r = 22, c = 2 * Math.PI * r;
  return (
    <svg width={size} height={size} viewBox="0 0 56 56">
      <circle cx="28" cy="28" r={r} stroke="#e0e7ff" strokeWidth="6" fill="none" />
      <circle cx="28" cy="28" r={r} stroke="#6366f1" strokeWidth="6" fill="none" strokeLinecap="round"
        strokeDasharray={c} strokeDashoffset={c * (1 - pct / 100)} transform="rotate(-90 28 28)"
        style={{ transition: "stroke-dashoffset .8s" }} />
      <text x="28" y="32" textAnchor="middle" fontSize="12" fontWeight="700" fill="#4338ca">{pct}%</text>
    </svg>
  );
}

function Kpi({ label, value, sub, icon, badge, badgeCls, right }) {
  return (
    <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm hover:shadow-md transition fade-up">
      <div className="flex items-start justify-between">
        <div className="flex items-center gap-2 text-slate-500 text-sm font-medium">
          <span className={`p-2 rounded-lg ${badgeCls}`}>{icon}</span>{label}
        </div>
        {badge && <span className={`text-[11px] font-semibold px-2 py-0.5 rounded-full ${badgeCls}`}>{badge}</span>}
      </div>
      <div className="mt-4 flex items-end justify-between">
        <div>
          <div className="text-4xl font-bold tracking-tight">{value}</div>
          <div className="text-xs text-slate-500 mt-1">{sub}</div>
        </div>
        {right}
      </div>
    </div>
  );
}

function Velocity() {
  const { days, vals, peak } = VELOCITY;
  const [hover, setHover] = useState(null);
  const max = Math.max(...vals);
  const ticks = [1, 0.75, 0.5, 0.25, 0];
  return (
    <div className="flex gap-3">
      <div className="flex flex-col justify-between h-64 text-[11px] text-slate-400 text-right w-6 shrink-0">
        {ticks.map((t) => <span key={t}>{Math.round(max * t)}</span>)}
      </div>
      <div className="flex-1">
        <div className="relative h-64">
          <div className="absolute inset-0 flex flex-col justify-between pointer-events-none">
            {ticks.map((t) => <div key={t} className={`border-t ${t === 0 ? "border-slate-300" : "border-dashed border-slate-200"}`} />)}
          </div>
          <div className="absolute inset-0 flex items-end gap-4 px-2">
            {vals.map((v, i) => (
              <div key={i} className="flex-1 h-full flex flex-col justify-end items-center relative"
                onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)}>
                {hover === i && (
                  <div className="absolute bg-slate-900 text-white text-xs px-2.5 py-1.5 rounded-md whitespace-nowrap z-10 shadow-lg"
                    style={{ bottom: `calc(${(v / max) * 100}% + 8px)` }}>
                    {days[i]}: <b>{v} tasks</b>
                  </div>
                )}
                <div className={`bar w-full max-w-[56px] rounded-t-lg cursor-pointer transition-colors ${i === peak ? "bg-emerald-500 hover:bg-emerald-600 shadow-lg shadow-emerald-200" : "bg-indigo-200 hover:bg-indigo-300"}`}
                  style={{ height: `${(v / max) * 100}%`, animationDelay: `${i * 50}ms` }} />
              </div>
            ))}
          </div>
        </div>
        <div className="flex gap-4 px-2 mt-3 text-xs text-slate-500">
          {days.map((d, i) => <div key={d} className={`flex-1 text-center ${i === peak ? "font-bold text-emerald-600" : ""}`}>{d}</div>)}
        </div>
      </div>
    </div>
  );
}

/* ---------- AI Diagnosis: nút + popover căn giữa, đuôi chỉ neo theo nút ---------- */
function AiDiagnosis() {
  const [isOpen, setIsOpen] = useState(false);
  const [pos, setPos] = useState({ top: 80, caret: 0, origin: 0 });
  const [scanning, setScanning] = useState(false);
  const [updated, setUpdated] = useState("2h trước");
  const btnRef = useRef(null);
  const popRef = useRef(null);

  const measure = () => {
    if (!btnRef.current) return;
    const b = btnRef.current.getBoundingClientRect();
    const vw = document.documentElement.clientWidth;
    const w = Math.min(1024, vw - 64);
    const left = (vw - w) / 2;
    const center = b.left + b.width / 2;
    const caret = Math.min(Math.max(center - left - 8, 20), w - 36);
    setPos({ top: b.bottom + 12, caret, origin: caret + 8 });
  };

  useLayoutEffect(() => { if (isOpen) measure(); }, [isOpen]);

  useEffect(() => {
    if (!isOpen) return;
    const onDown = (e) => {
      const inBtn = btnRef.current && btnRef.current.contains(e.target);
      const inPop = popRef.current && popRef.current.contains(e.target);
      if (!inBtn && !inPop) setIsOpen(false);
    };
    const onKey = (e) => { if (e.key === "Escape") setIsOpen(false); };
    window.addEventListener("resize", measure);
    document.addEventListener("mousedown", onDown);
    document.addEventListener("keydown", onKey);
    return () => {
      window.removeEventListener("resize", measure);
      document.removeEventListener("mousedown", onDown);
      document.removeEventListener("keydown", onKey);
    };
  }, [isOpen]);

  const rescan = () => {
    if (scanning) return;
    setScanning(true);
    setTimeout(() => { setScanning(false); setUpdated("vừa xong"); }, 1400);
  };

  return (
    <div className="relative z-[45] shrink-0">
      <button ref={btnRef}
        onClick={() => setIsOpen((o) => !o)}
        aria-haspopup="dialog" aria-expanded={isOpen}
        className={`flex items-center gap-2 px-4 py-2 text-sm font-medium text-indigo-700 rounded-lg border transition ${
          isOpen
            ? "bg-indigo-50 border-indigo-400 ring-2 ring-indigo-100"
            : "bg-white border-indigo-200 hover:border-indigo-300 hover:bg-indigo-50/40"
        }`}>
        <Sparkle id="aiGradBtn" className="w-4 h-4" /> AI Diagnosis
      </button>

      {isOpen && (
        <>
          <div className="fade-in fixed inset-0 bg-slate-900/10 z-40" />
          <div ref={popRef} role="dialog" aria-label="AI Pipeline Diagnostic Insights"
            className="pop-in fixed inset-x-0 mx-auto z-50 w-[calc(100%-4rem)] max-w-5xl rounded-2xl border border-slate-200/80 bg-white/95 backdrop-blur-md shadow-2xl max-h-[calc(100vh-120px)] overflow-y-auto"
            style={{ top: pos.top, transformOrigin: `${pos.origin}px top`, boxShadow: "0 25px 50px -12px rgba(15,23,42,.25), 0 10px 20px -8px rgba(79,70,229,.12)" }}>
            <div className="absolute -top-2 w-4 h-4 bg-white rotate-45 border-l border-t border-slate-200"
              style={{ left: pos.caret }} />
            <div className="relative flex items-start justify-between gap-4 px-6 pt-5 pb-4 border-b border-slate-100 rounded-t-2xl bg-white">
              <div className="flex items-center gap-3">
                <span className="p-2 rounded-xl bg-gradient-to-br from-violet-100 to-sky-100"><Sparkle id="aiGradHead" className="w-5 h-5" /></span>
                <div>
                  <h3 className="text-base font-semibold leading-tight">AI Pipeline Diagnostic Insights</h3>
                  <span className="inline-block mt-1 text-[11px] font-medium px-2 py-0.5 rounded-full bg-violet-50 text-violet-700">
                    Model: Gemini Engine · Cập nhật {updated}
                  </span>
                </div>
              </div>
              <button onClick={() => setIsOpen(false)} aria-label="Đóng"
                className="p-2 rounded-full text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition">
                <Icon d={I.x} className="w-4 h-4" />
              </button>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 px-6 my-5">
              {INSIGHTS.map((n) => (
                <div key={n.id} className={`rounded-xl border p-4 flex flex-col ${n.box} ${scanning ? "opacity-50" : ""} transition-opacity`}>
                  <div className="flex items-center justify-between gap-2">
                    <span className="text-lg leading-none">{n.icon}</span>
                    <span className={`text-[11px] font-bold px-2 py-0.5 rounded-full ${n.tagCls}`}>{n.tag}</span>
                  </div>
                  <div className="mt-3 text-[11px] font-semibold uppercase tracking-wide text-slate-500">{n.kicker}</div>
                  <h4 className="mt-1 text-sm font-semibold text-slate-900 leading-snug">{n.title}</h4>
                  <p className="mt-2 text-sm text-slate-700 leading-relaxed">{n.text}</p>
                </div>
              ))}
            </div>

            <div className="flex flex-wrap items-center justify-between gap-3 px-6 py-3.5 border-t border-slate-100 bg-slate-50/70 rounded-b-2xl">
              <p className="text-[11px] text-slate-400 max-w-xl">
                Phân tích tự động dựa trên cấu trúc đồ thị DAG và trạng thái máy trạng thái (State Machine) của từng Node trong dự án.
              </p>
              <button onClick={rescan} disabled={scanning}
                className="flex items-center gap-2 px-3.5 py-2 text-xs font-semibold text-indigo-700 bg-white border border-indigo-200 rounded-lg hover:bg-indigo-50 hover:border-indigo-300 disabled:opacity-70 transition">
                <Icon d={I.refresh} className={`w-3.5 h-3.5 ${scanning ? "spin-360" : ""}`} />
                {scanning ? "Đang quét…" : "Chạy lại chẩn đoán (Re-scan Pipeline)"}
              </button>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

/* ---------- Guest Access: nút Header + popover quản lý token ---------- */
const guestUrl = (token) => `https://pipeline.io/guest?token=${token.replace("gst_sec_", "gst_")}`;

function GuestAccess({ guestAccess, setGuestAccess, notify }) {
  const { isActive, token, expiresAt } = guestAccess;
  const [isOpen, setIsOpen] = useState(false);
  const [copied, setCopied] = useState(false);
  const [btnW, setBtnW] = useState(160);
  const wrapRef = useRef(null);
  const btnRef = useRef(null);

  useLayoutEffect(() => {
    if (btnRef.current) setBtnW(btnRef.current.getBoundingClientRect().width);
  }, [isActive, isOpen]);

  useEffect(() => {
    if (!isOpen) return;
    const onDown = (e) => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setIsOpen(false); };
    const onKey = (e) => { if (e.key === "Escape") setIsOpen(false); };
    document.addEventListener("mousedown", onDown);
    document.addEventListener("keydown", onKey);
    return () => {
      document.removeEventListener("mousedown", onDown);
      document.removeEventListener("keydown", onKey);
    };
  }, [isOpen]);

  useEffect(() => {
    if (!copied) return;
    const t = setTimeout(() => setCopied(false), 1800);
    return () => clearTimeout(t);
  }, [copied]);

  const copy = async () => {
    try { await navigator.clipboard.writeText(guestUrl(token)); } catch (e) { /* môi trường sandbox có thể chặn clipboard */ }
    setCopied(true);
  };

  const revoke = () => {
    setGuestAccess((g) => ({ ...g, isActive: false }));
    setCopied(false);
    notify("Đã vô hiệu hóa token. Liên kết cũ không còn truy cập được.");
  };

  const regenerate = () => {
    const suffix = Math.random().toString(16).slice(2, 8).padEnd(6, "0");
    setGuestAccess({ isActive: true, token: `gst_sec_${suffix}`, expiresAt: "2026-10-09 (còn 7 ngày)" });
    notify("Đã tạo liên kết mới (Generate New Token)");
  };

  // Đuôi chỉ nằm thẳng dưới tâm nút (popover căn mép phải với nút)
  const caretRight = Math.max(btnW / 2 - 8, 16);

  return (
    <div ref={wrapRef} className="relative z-[45] shrink-0">
      <button ref={btnRef} onClick={() => setIsOpen((o) => !o)}
        aria-haspopup="dialog" aria-expanded={isOpen}
        className={`relative flex items-center gap-2 px-4 py-2 text-sm font-medium rounded-lg border transition ${
          isOpen
            ? "bg-slate-50 border-slate-400 ring-2 ring-slate-100 text-slate-800"
            : isActive
              ? "bg-white border-slate-200 text-slate-700 hover:bg-slate-50 hover:border-slate-300"
              : "bg-white border-red-200 text-red-700 hover:bg-red-50 hover:border-red-300"
        }`}>
        <Icon d={I.link} className="w-4 h-4" />
        {isActive ? "Share Guest Link" : "Guest Link (Đã đóng)"}
        {!isActive && (
          <span className="absolute -top-1 -right-1 flex w-2.5 h-2.5">
            <span className="absolute inline-flex w-full h-full rounded-full bg-red-400 opacity-60 animate-ping" />
            <span className="relative inline-flex w-2.5 h-2.5 rounded-full bg-red-500 ring-2 ring-white" />
          </span>
        )}
      </button>

      {isOpen && (
        <div role="dialog" aria-label="Chia sẻ quyền Khách / Giáo viên"
          className="pop-in absolute right-0 top-full mt-3 z-50 w-[400px] max-w-[calc(100vw-2rem)] rounded-2xl border border-slate-200 bg-white shadow-2xl"
          style={{ transformOrigin: `calc(100% - ${btnW / 2}px) top` }}>
          <div className="absolute -top-2 w-4 h-4 bg-white rotate-45 border-l border-t border-slate-200" style={{ right: caretRight }} />

          {/* Header */}
          <div className="relative flex items-center justify-between gap-3 px-5 pt-4 pb-3 border-b border-slate-100 rounded-t-2xl bg-white">
            <div className="flex items-center gap-2.5">
              <span className="p-1.5 rounded-lg bg-indigo-50 text-indigo-600"><Icon d={I.link} className="w-4 h-4" /></span>
              <h3 className="text-sm font-semibold">Chia sẻ quyền Khách / Giáo viên</h3>
            </div>
            <button onClick={() => setIsOpen(false)} aria-label="Đóng"
              className="p-1.5 rounded-md text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition">
              <Icon d={I.x} className="w-4 h-4" />
            </button>
          </div>

          {isActive ? (
            <div key="active" className="fade-up px-5 py-4 space-y-4">
              <span className="inline-flex items-center gap-1.5 text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-700">
                🟢 Đang mở truy cập
              </span>

              <div>
                <label className="text-[11px] font-semibold uppercase tracking-wide text-slate-500">Liên kết truy cập</label>
                <div className="mt-1.5 flex items-center gap-2">
                  <div className="flex-1 min-w-0 px-3 py-2 text-sm font-mono text-slate-600 bg-slate-50 border border-slate-200 rounded-lg truncate" title={guestUrl(token)}>
                    {guestUrl(token)}...
                  </div>
                  <button onClick={copy}
                    className={`shrink-0 flex items-center gap-1.5 px-3 py-2 text-xs font-semibold rounded-lg border transition ${
                      copied ? "bg-emerald-50 border-emerald-300 text-emerald-700" : "bg-white border-slate-200 text-slate-700 hover:bg-slate-50 hover:border-slate-300"}`}>
                    <Icon d={copied ? I.check : I.copy} className="w-3.5 h-3.5" />
                    {copied ? "Đã sao chép!" : "Sao chép"}
                  </button>
                </div>
              </div>

              <ul className="space-y-2 text-sm text-slate-600">
                <li className="flex items-center gap-2"><Icon d={I.eye} className="w-4 h-4 text-slate-400" /> Quyền: <b className="text-slate-800 font-semibold">Chỉ xem &amp; gửi Feedback</b></li>
                <li className="flex items-center gap-2"><Icon d={I.clock} className="w-4 h-4 text-slate-400" /> Hết hạn: <b className="text-slate-800 font-semibold">{expiresAt}</b></li>
                <li className="flex items-center gap-2 text-xs text-slate-400 font-mono pl-6">token: {token}</li>
              </ul>

              <button onClick={revoke}
                className="w-full flex items-center justify-center gap-2 px-4 py-2.5 text-sm font-semibold text-red-600 bg-white border border-red-300 rounded-lg hover:bg-red-50 hover:border-red-400 transition">
                <Icon d={I.ban} className="w-4 h-4" /> Đóng liên kết (Vô hiệu hóa token)
              </button>
            </div>
          ) : (
            <div key="closed" className="fade-up px-5 py-4 space-y-4">
              <span className="inline-flex items-center gap-1.5 text-xs font-semibold px-2.5 py-1 rounded-full bg-red-100 text-red-700">
                🔴 Đã khóa liên kết
              </span>
              <div className="rounded-xl border border-slate-200 bg-slate-50 px-4 py-3.5 flex gap-3">
                <span className="mt-0.5 text-red-500"><Icon d={I.ban} className="w-5 h-5" /></span>
                <p className="text-sm text-slate-600 leading-relaxed">
                  Khách ngoài và giáo viên không thể truy cập dự án bằng liên kết trước đó nữa.
                </p>
              </div>
              <button onClick={regenerate}
                className="w-full flex items-center justify-center gap-2 px-4 py-2.5 text-sm font-semibold text-white bg-blue-600 rounded-lg hover:bg-blue-700 shadow-sm transition">
                <Icon d={I.refresh} className="w-4 h-4" /> Tạo liên kết mới (Generate New Token)
              </button>
            </div>
          )}

          <div className="px-5 py-3 border-t border-slate-100 bg-slate-50/60 rounded-b-2xl">
            <p className="text-[11px] text-slate-400">Token có thời hạn, có thể thu hồi tức thì và chỉ mở các tài nguyên được cấu hình công khai.</p>
          </div>
        </div>
      )}
    </div>
  );
}
