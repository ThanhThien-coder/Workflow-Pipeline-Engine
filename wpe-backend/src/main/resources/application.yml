server:
  port: 8080

spring:
  application:
    name: wpe-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/wpe_db
    username: wpe_user
    password: wpe_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Cấu hình Token bảo mật JWT
