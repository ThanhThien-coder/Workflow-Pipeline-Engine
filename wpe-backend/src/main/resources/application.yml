server:
  port: 8080

spring:
  application:
    name: wpe-backend

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    # Production phải false. Profile dev bật true (application-dev.yml).
    out-of-order: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000ms

# Cấu hình RabbitMQ Topology (Exchanges, Queues, Routing Keys)
app:
  upload:
    dir: ${APP_UPLOAD_DIR:uploads}
  rabbitmq:
    exchange: wpe.workflow.exchange
    queues:
      task-completed: wpe.task.completed.queue
      notification: wpe.notification.queue
      ai-diagnostics: wpe.ai.diagnostics.queue
      dead-letter: wpe.workflow.dlq
    routing-keys:
      task-completed: wpe.task.completed
      notification-all: wpe.notification.#
      ai-diagnostics: wpe.ai.diagnostics
      dead-letter: wpe.workflow.dlq.key
  security:
    debug-user-id-enabled: false
  cors:
    # Danh sách origin, cách nhau dấu phẩy.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  ai:
    cooldown-seconds: 180
    service-url: ${AI_SERVICE_URL:http://localhost:8081}
    # http = gọi microservice AI Python (mặc định); mock = dữ liệu mẫu trong Java, chỉ dùng để demo
    mode: ${AI_MODE:http}
    diagnose-path: ${AI_DIAGNOSE_PATH:/api/ai/diagnose}
    connect-timeout-seconds: ${AI_CONNECT_TIMEOUT_SECONDS:3}
    read-timeout-seconds: ${AI_READ_TIMEOUT_SECONDS:30}
    # Khóa nội bộ gửi kèm header X-Internal-Key khi gọi dịch vụ AI. Để trống thì không gửi.
    internal-key: ${AI_INTERNAL_KEY:}
  invitation:
    expiry-days: ${INVITATION_EXPIRY_DAYS:7}
    expiry-scan-ms: ${INVITATION_EXPIRY_SCAN_MS:3600000}

# Cấu hình Token bảo mật JWT
jwt:
  # Bắt buộc, >= 32 byte. Máy dev lấy từ application-dev.yml.
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 900000 # 15 phút
  refresh-token-expiration-ms: 604800000 # 7 ngày
