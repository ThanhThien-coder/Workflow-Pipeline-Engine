server:
  port: 8080

spring:
  application:
    name: wpe-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/wpe_db
    username: wpe_user
    password: wpe_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    # CHỈ DÙNG CHO GIAI ĐOẠN DEV khi 4 người làm song song: cho phép chạy migration có số
    # nhỏ hơn bản mới nhất đã chạy (VD: máy đã chạy V8 rồi mới pull về V7). Trước khi
    # triển khai thật phải tắt (false) và chốt lại thứ tự migration.
    out-of-order: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:wpe_rabbit}
    password: ${RABBITMQ_PASSWORD:wpe_rabbit_pass}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000ms

# Cấu hình RabbitMQ Topology (Exchanges, Queues, Routing Keys)
app:
  rabbitmq:
    exchange: wpe.workflow.exchange
    queues:
      task-completed: wpe.task.completed.queue
      notification: wpe.notification.queue
      ai-diagnostics: wpe.ai.diagnostics.queue
      dead-letter: wpe.workflow.dlq
    routing-keys:
      task-completed: wpe.task.completed
      notification-all: wpe.notification.#
      ai-diagnostics: wpe.ai.diagnostics
      dead-letter: wpe.workflow.dlq.key
  security:
    debug-user-id-enabled: true
    default-debug-user-id: 2
  ai:
    cooldown-seconds: 180
    service-url: ${AI_SERVICE_URL:http://localhost:8081}

# Cấu hình Token bảo mật JWT
jwt:
  # Production/CI phải đặt biến môi trường JWT_SECRET (>= 32 byte). Giá trị mặc định chỉ dùng cho máy dev.
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  access-token-expiration-ms: 900000 # 15 phút
  refresh-token-expiration-ms: 604800000 # 7 ngày
