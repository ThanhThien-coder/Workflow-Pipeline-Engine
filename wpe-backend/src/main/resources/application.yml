server:
  port: 8080

spring:
  application:
    name: wpe-backend

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    # Production phải false. Profile dev bật true (application-dev.yml).
    out-of-order: false

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000ms

# Cấu hình RabbitMQ Topology (Exchanges, Queues, Routing Keys)
app:
  seed-accounts:
    guard-enabled: ${SEED_ACCOUNT_GUARD_ENABLED:true}
    password: ${SEED_ACCOUNT_PASSWORD:}
  demo-tools:
    enabled: ${DEMO_TOOLS_ENABLED:false}
  maintenance:
    cleanup-orphan-nodes: ${CLEANUP_ORPHAN_NODES:true}
  frontend:
    base-url: ${APP_PUBLIC_URL:http://localhost:5173}
  upload:
    dir: ${APP_UPLOAD_DIR:uploads}
  mail:
    from: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:Workflow Pipeline Engine}
  password-reset:
    token-ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:30}
    resend-cooldown-seconds: ${PASSWORD_RESET_RESEND_COOLDOWN_SECONDS:60}
  rabbitmq:
    exchange: wpe.workflow.exchange
    queues:
      task-completed: wpe.task.completed.queue
      notification: wpe.notification.queue
      ai-diagnostics: wpe.ai.diagnostics.queue
      dead-letter: wpe.workflow.dlq
    routing-keys:
      task-completed: wpe.task.completed
      notification-all: wpe.notification.#
      ai-diagnostics: wpe.ai.diagnostics
      dead-letter: wpe.workflow.dlq.key
  security:
    debug-user-id-enabled: false
  cors:
    # Danh sách origin, cách nhau dấu phẩy.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  ai:
    # Thời gian chờ giữa 2 lần bấm phân tích (giây). Lúc demo đặt AI_COOLDOWN_SECONDS=0
    cooldown-seconds: ${AI_COOLDOWN_SECONDS:60}
    service-url: ${AI_SERVICE_URL:http://localhost:8081}
    # http = gọi microservice AI Python (mặc định); mock = dữ liệu mẫu trong Java, chỉ dùng để demo
    mode: ${AI_MODE:http}
    diagnose-path: ${AI_DIAGNOSE_PATH:/api/ai/diagnose}
    connect-timeout-seconds: ${AI_CONNECT_TIMEOUT_SECONDS:5}
    read-timeout-seconds: ${AI_READ_TIMEOUT_SECONDS:180}
    # Khóa nội bộ gửi kèm header X-Internal-Key khi gọi dịch vụ AI. Để trống thì không gửi.
    internal-key: ${AI_INTERNAL_KEY:}
  invitation:
    expiry-days: ${INVITATION_EXPIRY_DAYS:7}
    expiry-scan-ms: ${INVITATION_EXPIRY_SCAN_MS:3600000}

# Cấu hình Token bảo mật JWT
jwt:
  # Bắt buộc, >= 32 byte. Máy dev lấy từ application-dev.yml.
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 900000 # 15 phút
  refresh-token-expiration-ms: 604800000 # 7 ngày
